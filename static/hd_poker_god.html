<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HD Poker God App</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-200">

    <!-- Root Element for React -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- INLINE SVG ICONS (Replacing lucide-react dependency) ---
        const Icon = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Spade = (p) => <Icon {...p}><path d="M5 9c-1.5 1.5-3 3.2-3 5.5A5.5 5.5 0 0 0 7.5 20c1.8 0 3-.5 4.5-2 1.5 1.5 2.7 2 4.5 2a5.5 5.5 0 0 0 5.5-5.5c0-2.3-1.5-4-3-5.5l-7-8Z"/><path d="M12 18v4l-2-2m4 0-2 2"/></Icon>;
        const Layers = (p) => <Icon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></Icon>;
        const History = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></Icon>;
        const BarChart2 = (p) => <Icon {...p}><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></Icon>;
        const ChevronDown = (p) => <Icon {...p}><path d="m6 9 6 6 6-6"/></Icon>;
        const ChevronUp = (p) => <Icon {...p}><path d="m18 15-6-6-6 6"/></Icon>;
        const Eye = (p) => <Icon {...p}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></Icon>;
        const EyeOff = (p) => <Icon {...p}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></Icon>;
        const Plus = (p) => <Icon {...p}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
        const Minus = (p) => <Icon {...p}><path d="M5 12h14"/></Icon>;
        const ArrowLeft = (p) => <Icon {...p}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></Icon>;
        const Trash2 = (p) => <Icon {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>;
        const Download = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></Icon>;
        const Upload = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></Icon>;

        // --- CONSTANTS ---
        const RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
        const SUITS = [
          { symbol: '♥', name: 'hearts', color: 'text-red-500', bg: 'bg-red-950', border: 'border-red-900' },
          { symbol: '♦', name: 'diamonds', color: 'text-red-500', bg: 'bg-red-950', border: 'border-red-900' },
          { symbol: '♣', name: 'clubs', color: 'text-blue-400', bg: 'bg-slate-900', border: 'border-slate-800' },
          { symbol: '♠', name: 'spades', color: 'text-blue-400', bg: 'bg-slate-900', border: 'border-slate-800' }
        ];

        // --- CUSTOM HOOKS ---
        function useLocalStorage(key, initialValue) {
          const [storedValue, setStoredValue] = useState(() => {
            try {
              const item = window.localStorage.getItem(key);
              return item ? JSON.parse(item) : initialValue;
            } catch (error) {
              console.warn(`Error reading localStorage key "${key}":`, error);
              return initialValue;
            }
          });

          const setValue = (value) => {
            try {
              const valueToStore = value instanceof Function ? value(storedValue) : value;
              setStoredValue(valueToStore);
              window.localStorage.setItem(key, JSON.stringify(valueToStore));
            } catch (error) {
              console.warn(`Error setting localStorage key "${key}":`, error);
            }
          };

          return [storedValue, setValue];
        }

        // --- PHYSICS CANVAS COMPONENT ---
        function TokenPhysicsArea({ count, onAdd, onRemove }) {
          const containerRef = useRef(null);
          const rafRef = useRef(null);
          const tokensRef = useRef([]); 
          const domRefs = useRef({});
          const dragRef = useRef({ id: null, lastX: 0, lastY: 0 });
          const [renderList, setRenderList] = useState([]);

          // Sync count to tokens array
          useEffect(() => {
            const currentLen = tokensRef.current.length;
            let changed = false;
            
            if (count > currentLen) {
              // Add tokens
              for(let i = 0; i < count - currentLen; i++) {
                const width = containerRef.current?.clientWidth || 200;
                tokensRef.current.push({
                  id: Math.random().toString(36).substr(2, 9),
                  index: currentLen + i, // Store index for tier styling
                  x: width / 2 + (Math.random() * 40 - 20),
                  y: -40 - (i * 30),
                  vx: Math.random() * 6 - 3,
                  vy: Math.random() * 2,
                  isDragging: false
                });
              }
              changed = true;
            } else if (count < currentLen) {
              // Remove tokens from the end
              tokensRef.current.splice(count, currentLen - count);
              changed = true;
            }
            
            // Trigger React to draw/remove the DOM nodes for the tokens
            if (changed) {
              setRenderList([...tokensRef.current]);
            }
          }, [count]);

          // Physics Loop
          useEffect(() => {
            const animate = () => {
              const container = containerRef.current;
              if (!container) return;
              
              const width = container.clientWidth;
              const height = container.clientHeight;
              const tokens = tokensRef.current;
              const RADIUS = 16;
              
              // Integrate forces
              tokens.forEach(t => {
                if (!t.isDragging) {
                  t.vy += 0.5; // gravity
                  
                  // Terminal velocity
                  if (t.vy > 18) t.vy = 18;
                  if (t.vx > 18) t.vx = 18;
                  if (t.vx < -18) t.vx = -18;

                  t.x += t.vx;
                  t.y += t.vy;

                  // Floor/Ceiling
                  if (t.y + RADIUS > height) { 
                    t.y = height - RADIUS; 
                    t.vy *= -0.55; // bounce
                    t.vx *= 0.92;  // friction
                  }
                  
                  // Walls
                  if (t.x - RADIUS < 0) { 
                    t.x = RADIUS; 
                    t.vx *= -0.6; 
                  }
                  if (t.x + RADIUS > width) { 
                    t.x = width - RADIUS; 
                    t.vx *= -0.6; 
                  }
                }
              });

              // Collisions
              for (let i = 0; i < tokens.length; i++) {
                for (let j = i + 1; j < tokens.length; j++) {
                  let dx = tokens[j].x - tokens[i].x;
                  let dy = tokens[j].y - tokens[i].y;
                  let dist = Math.sqrt(dx * dx + dy * dy);
                  
                  if (dist < RADIUS * 2 && dist > 0) {
                    let overlap = (RADIUS * 2) - dist;
                    let nx = dx / dist;
                    let ny = dy / dist;

                    // Separate overlapping circles
                    if (!tokens[i].isDragging) { tokens[i].x -= nx * overlap / 2; tokens[i].y -= ny * overlap / 2; }
                    if (!tokens[j].isDragging) { tokens[j].x += nx * overlap / 2; tokens[j].y += ny * overlap / 2; }

                    // Exchange momentum
                    let kx = (tokens[i].vx - tokens[j].vx);
                    let ky = (tokens[i].vy - tokens[j].vy);
                    let p = 1.3 * (nx * kx + ny * ky) / 2;
                    
                    if (p > 0) { // Only resolve if moving towards each other
                      if (!tokens[i].isDragging) { tokens[i].vx -= p * nx; tokens[i].vy -= p * ny; }
                      if (!tokens[j].isDragging) { tokens[j].vx += p * nx; tokens[j].vy += p * ny; }
                    }
                  }
                }
              }

              // Update DOM Nodes via Direct Manipulation (High Performance)
              tokens.forEach(t => {
                const el = domRefs.current[t.id];
                if (el) {
                  el.style.transform = `translate(${t.x}px, ${t.y}px)`;
                }
              });

              rafRef.current = requestAnimationFrame(animate);
            };

            rafRef.current = requestAnimationFrame(animate);
            return () => cancelAnimationFrame(rafRef.current);
          }, []);

          // Drag Interactions
          const handlePointerDown = (e, id) => {
            e.preventDefault();
            const container = containerRef.current.getBoundingClientRect();
            const x = e.clientX - container.left;
            const y = e.clientY - container.top;
            
            dragRef.current = { id, lastX: x, lastY: y };
            const t = tokensRef.current.find(t => t.id === id);
            if (t) { 
              t.isDragging = true; 
              t.vx = 0; 
              t.vy = 0; 
            }
          };

          const handlePointerMove = (e) => {
            if (!dragRef.current.id) return;
            const container = containerRef.current.getBoundingClientRect();
            const x = e.clientX - container.left;
            const y = e.clientY - container.top;
            
            const t = tokensRef.current.find(t => t.id === dragRef.current.id);
            if (t) {
              t.vx = x - dragRef.current.lastX;
              t.vy = y - dragRef.current.lastY;
              t.x = x;
              t.y = y;
            }
            dragRef.current.lastX = x;
            dragRef.current.lastY = y;
          };

          const handlePointerUp = () => {
            if (!dragRef.current.id) return;
            const t = tokensRef.current.find(t => t.id === dragRef.current.id);
            if (t) { t.isDragging = false; }
            dragRef.current.id = null;
          };

          // Determine CSS class based on token index
          const getTokenClass = (index) => {
            if (index < 5) return 'token-t1';      // 1-5
            if (index < 12) return 'token-t2';     // 6-12
            if (index < 21) return 'token-t3';     // 13-21
            return 'token-t4';                     // 22+
          };

          return (
            <div className="bg-neutral-900 border border-neutral-800 rounded-xl mb-4 flex overflow-hidden shadow-inner h-[240px] select-none touch-none">
              
              {/* Physics Canvas Area (4/5 width) */}
              <div 
                className="w-4/5 relative border-r border-neutral-800 overflow-hidden bg-neutral-950" 
                ref={containerRef}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                onPointerLeave={handlePointerUp}
              >
                {renderList.map((token) => (
                  <div
                    key={token.id}
                    ref={el => domRefs.current[token.id] = el}
                    onPointerDown={(e) => handlePointerDown(e, token.id)}
                    className="absolute left-0 top-0 w-8 h-8 cursor-grab active:cursor-grabbing will-change-transform z-10"
                    style={{ marginLeft: '-16px', marginTop: '-16px' }}
                  >
                    {/* Inner div handles the CSS scaling animations without overriding JS translate */}
                    <div className={`w-full h-full rounded-full flex items-center justify-center transition-colors duration-200 ${getTokenClass(token.index)}`}>
                      ★
                    </div>
                  </div>
                ))}
              </div>

              {/* Control Panel (1/5 width) */}
              <div className="w-1/5 bg-neutral-900 flex flex-col justify-center items-center py-2 z-20 shadow-[-5px_0_15px_rgba(0,0,0,0.5)]">
                <button 
                  onClick={onAdd} 
                  className="flex-1 w-full flex items-center justify-center text-yellow-500 hover:bg-neutral-800 active:bg-neutral-700 active:scale-95 transition-all"
                >
                  <Plus size={28} />
                </button>
                <div className="py-2 flex flex-col items-center">
                  <div className="text-3xl font-mono font-black text-yellow-500 leading-none">{count}</div>
                </div>
                <button 
                  onClick={onRemove} 
                  className="flex-1 w-full flex items-center justify-center text-neutral-500 hover:bg-neutral-800 active:bg-neutral-700 active:scale-95 transition-all"
                >
                  <Minus size={28} />
                </button>
              </div>
            </div>
          );
        }

        // --- MAIN APP COMPONENT ---
        function App() {
          // Global State
          const [hands, setHands] = useLocalStorage('pt2_hands', []);
          const [sessions, setSessions] = useLocalStorage('pt2_sessions', []);
          const [discTokens, setDiscTokens] = useLocalStorage('pt2_disc', 0);
          const [startTime, setStartTime] = useLocalStorage('pt2_start', Date.now());
          const [commOpen, setCommOpen] = useLocalStorage('pt2_comm', true);
          
          // Navigation State
          const [activeTab, setActiveTab] = useState('session'); // 'session', 'add', 'history', 'sessions', 'stats'
          const [editingHandId, setEditingHandId] = useState(null);
          
          // Toast State
          const [toastMsg, setToastMsg] = useState('');

          const showToast = (msg) => {
            setToastMsg(msg);
            setTimeout(() => setToastMsg(''), 2500);
          };

          // --- HELPERS ---
          const clearAllData = () => {
            if (window.confirm('Clear ALL data including all sessions? Cannot be undone.')) {
              setHands([]);
              setSessions([]);
              setDiscTokens(0);
              setStartTime(Date.now());
              showToast('All data cleared');
            }
          };

          const endSession = (pnl) => {
            const total = hands.length;
            const played = hands.filter(h => h.isVPIP).length;
            const vpip = total > 0 ? Math.round((played / total) * 100) : 0;
            
            const newSession = {
              id: startTime,
              date: new Date(startTime).toLocaleDateString(),
              dateMs: startTime,
              hands: [...hands],
              totalHands: total,
              vpip,
              played,
              pnl: parseFloat(pnl) || 0,
              discTokens
            };

            setSessions([newSession, ...sessions]);
            setHands([]);
            setDiscTokens(0);
            setStartTime(Date.now());
            setActiveTab('session');
            showToast('Session saved!');
          };

          // Render appropriate screen based on active tab
          const renderScreen = () => {
            switch (activeTab) {
              case 'session':
                return <ScreenSession 
                  hands={hands} discTokens={discTokens} setDiscTokens={setDiscTokens} 
                  startTime={startTime} commOpen={commOpen} setCommOpen={setCommOpen} 
                  navigate={setActiveTab} endSession={endSession} 
                  onAddHand={() => { setEditingHandId(null); setActiveTab('add'); }}
                  onEditHand={(id) => { setEditingHandId(id); setActiveTab('add'); }}
                  showToast={showToast}
                />;
              case 'add':
                return <ScreenAddHand 
                  hands={hands} setHands={setHands} navigate={setActiveTab} showToast={showToast} 
                  editingHandId={editingHandId}
                />;
              case 'history':
                return <ScreenHistory hands={hands} startTime={startTime} showToast={showToast} onEditHand={(id) => { setEditingHandId(id); setActiveTab('add'); }} />;
              case 'sessions':
                return <ScreenSessions sessions={sessions} setSessions={setSessions} showToast={showToast} />;
              case 'stats':
                return <ScreenStats 
                  hands={hands} sessions={sessions} discTokens={discTokens} startTime={startTime}
                  setHands={setHands} setSessions={setSessions} setDiscTokens={setDiscTokens} setStartTime={setStartTime}
                  clearAllData={clearAllData} showToast={showToast} 
                />;
              default:
                return <ScreenSession navigate={setActiveTab} />;
            }
          };

          return (
            <div className="min-h-screen bg-neutral-950 text-neutral-200 font-sans selection:bg-yellow-600/30 flex justify-center">
              {/* Global Styles for Custom VFX Keyframes */}
              <style>{`
                @keyframes pulseSlow {
                  0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(250,204,21,0.5); }
                  50% { transform: scale(1.1); box-shadow: 0 0 30px rgba(250,204,21,0.9); }
                }
                @keyframes pulseFast {
                  0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(253,224,71,0.7); }
                  50% { transform: scale(1.2); box-shadow: 0 0 45px rgba(253,224,71,1); }
                }
                @keyframes flipColor {
                  0%, 49% { background: #eab308; color: #422006; border-color: #fef08a; transform: scale(1.25); box-shadow: 0 0 50px #fef08a; }
                  50%, 100% { background: #422006; color: #eab308; border-color: #a16207; transform: scale(1.15); box-shadow: 0 0 20px #eab308; }
                }
                .token-t1 {
                  background: rgba(234,179,8,0.2); border: 1px solid rgba(234,179,8,0.5); color: #eab308;
                  box-shadow: 0 0 8px rgba(234,179,8,0.4);
                }
                .token-t2 {
                  background: #facc15; border: 1px solid #fef08a; color: #713f12; font-weight: bold;
                  animation: pulseSlow 2.5s infinite ease-in-out;
                }
                .token-t3 {
                  background: #fde047; border: 1px solid #fef08a; color: #422006; font-weight: 900;
                  animation: pulseFast 0.6s infinite ease-in-out;
                }
                .token-t4 {
                  font-weight: 900;
                  animation: flipColor 0.2s infinite step-start;
                }
              `}</style>

              <div className="w-full max-w-md bg-neutral-950 flex flex-col min-h-screen relative shadow-2xl border-x border-neutral-900">
                
                {/* Main Content Area */}
                <div className="flex-1 flex flex-col h-full">
                  {renderScreen()}
                </div>

                {/* Bottom Navigation (Hide when adding a hand) */}
                {activeTab !== 'add' && (
                  <div className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 flex justify-between px-2 pb-6 pt-2 z-20">
                    <NavItem icon={<Spade size={20} />} label="Session" isActive={activeTab === 'session'} onClick={() => setActiveTab('session')} />
                    <NavItem icon={<History size={20} />} label="Hands" isActive={activeTab === 'history'} onClick={() => setActiveTab('history')} />
                    <NavItem icon={<Layers size={20} />} label="Sessions" isActive={activeTab === 'sessions'} onClick={() => setActiveTab('sessions')} />
                    <NavItem icon={<BarChart2 size={20} />} label="Stats" isActive={activeTab === 'stats'} onClick={() => setActiveTab('stats')} />
                  </div>
                )}

                {/* Toast Notification */}
                <div className={`fixed bottom-24 left-1/2 -translate-x-1/2 bg-neutral-800 border border-neutral-700 text-white px-4 py-2 rounded-full text-sm font-medium shadow-lg transition-all duration-300 pointer-events-none z-50 ${toastMsg ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`}>
                  {toastMsg}
                </div>
              </div>
            </div>
          );
        }

        // --- NAVIGATION ITEM ---
        function NavItem({ icon, label, isActive, onClick }) {
          return (
            <button onClick={onClick} className={`flex-1 flex flex-col items-center gap-1 p-2 transition-colors ${isActive ? 'text-yellow-500' : 'text-neutral-500 hover:text-neutral-300'}`}>
              {icon}
              <span className="text-[10px] uppercase tracking-wider font-semibold">{label}</span>
            </button>
          );
        }

        // --- SHARED UI COMPONENTS ---
        function CardMini({ card, hidden }) {
          if (hidden || !card) {
            return <div className="w-7 h-10 rounded text-xs flex items-center justify-center border border-neutral-700 bg-neutral-800 text-neutral-500 font-mono select-none">?</div>;
          }
          const isRed = card.suitName === 'hearts' || card.suitName === 'diamonds';
          return (
            <div className={`w-7 h-10 rounded text-xs flex flex-col items-center justify-center border font-mono font-bold leading-none select-none
              ${isRed ? 'bg-red-950/50 border-red-900 text-red-500' : 'bg-slate-900 border-slate-800 text-blue-400'}`}>
              <span>{card.rank}</span>
              <span>{card.suit}</span>
            </div>
          );
        }

        // --- SCREEN: SESSION (DASHBOARD) ---
        function ScreenSession({ hands, discTokens, setDiscTokens, startTime, commOpen, setCommOpen, navigate, endSession, onAddHand, onEditHand, showToast }) {
          const [listHidden, setListHidden] = useState(true);
          const [showEndModal, setShowEndModal] = useState(false);
          const [pnlInput, setPnlInput] = useState('');

          // Derived Stats
          const total = hands.length;
          const played = hands.filter(h => h.isVPIP).length;
          const folded = total - played;
          const vpip = total > 0 ? Math.round((played / total) * 100) : 0;
          
          const vpipColor = vpip <= 30 ? 'text-green-500' : vpip <= 50 ? 'text-yellow-500' : 'text-red-500';

          const formatTime = (ts) => {
            const d = new Date(ts);
            return `${d.toLocaleDateString()} · ${d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
          };

          const handleEndSession = () => {
            endSession(pnlInput);
            setShowEndModal(false);
            setPnlInput('');
          };

          return (
            <div className="flex flex-col h-full overflow-hidden">
              {/* Header */}
              <div className="px-5 pt-12 pb-4 border-b border-neutral-800/50 bg-neutral-950 sticky top-0 z-10 flex justify-between items-center">
                <div>
                  <h1 className="text-lg font-medium text-white">Poker Tracker</h1>
                  <p className="text-xs text-neutral-500 font-mono mt-0.5">Started {formatTime(startTime)}</p>
                </div>
                <button onClick={() => setShowEndModal(true)} className="px-3 py-1.5 rounded-md border border-neutral-700 bg-neutral-800 text-xs font-medium text-neutral-300 hover:bg-neutral-700 active:scale-95 transition-all">
                  End Session
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-4 pb-12">
                {/* Commitments */}
                <div className="mb-4 rounded-xl border border-yellow-500/30 bg-gradient-to-br from-yellow-500/10 to-transparent relative overflow-hidden">
                  <div className="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-yellow-500 to-yellow-500/20"></div>
                  <button onClick={() => setCommOpen(!commOpen)} className="w-full flex items-center justify-between p-3">
                    <span className="text-[10px] font-bold uppercase tracking-widest text-yellow-500">My Commitments</span>
                    {commOpen ? <ChevronUp size={16} className="text-neutral-400" /> : <ChevronDown size={16} className="text-neutral-400" />}
                  </button>
                  
                  {commOpen && (
                    <div className="px-4 pb-4 flex flex-col gap-3">
                      <div className="flex items-start gap-3">
                        <div className="w-6 h-6 rounded-full bg-yellow-500/20 border border-yellow-500/30 flex items-center justify-center text-xs shrink-0 mt-0.5">✋</div>
                        <p className="text-sm text-neutral-300 leading-snug"><em className="text-yellow-500 font-medium not-italic">Hands on table, 2 seconds</em> before every pre-flop action — no exceptions.</p>
                      </div>
                      <div className="flex items-start gap-3">
                        <div className="w-6 h-6 rounded-full bg-yellow-500/20 border border-yellow-500/30 flex items-center justify-center text-xs shrink-0 mt-0.5">🥂</div>
                        <p className="text-sm text-neutral-300 leading-snug">Every week I <em className="text-yellow-500 font-medium not-italic">win money</em> → I treat the table with drinks and food.</p>
                      </div>
                      <div className="flex items-start gap-3">
                        <div className="w-6 h-6 rounded-full bg-yellow-500/20 border border-yellow-500/30 flex items-center justify-center text-xs shrink-0 mt-0.5">♛</div>
                        <p className="text-sm text-neutral-300 leading-snug">I am building toward being <em className="text-yellow-500 font-medium not-italic">the most skilled</em> and <em className="text-yellow-500 font-medium not-italic">most generous</em> player at this table — winning well, giving back more.</p>
                      </div>
                    </div>
                  )}
                </div>

                {/* Stats Grid */}
                <div className="grid grid-cols-2 gap-2 mb-4">
                  <div className="bg-neutral-900 p-4 rounded-xl border border-neutral-800/50">
                    <div className={`text-3xl font-mono font-medium ${vpipColor}`}>{vpip}%</div>
                    <div className="text-[10px] text-neutral-500 uppercase tracking-widest mt-1">VPIP</div>
                  </div>
                  <div className="bg-neutral-900 p-4 rounded-xl border border-neutral-800/50">
                    <div className="text-3xl font-mono font-medium text-white">{total}</div>
                    <div className="text-[10px] text-neutral-500 uppercase tracking-widest mt-1">Hands</div>
                  </div>
                  <div className="bg-neutral-900 p-4 rounded-xl border border-neutral-800/50">
                    <div className="text-3xl font-mono font-medium text-green-500">{played}</div>
                    <div className="text-[10px] text-neutral-500 uppercase tracking-widest mt-1">Played</div>
                  </div>
                  <div className="bg-neutral-900 p-4 rounded-xl border border-neutral-800/50">
                    <div className="text-3xl font-mono font-medium text-neutral-300">{folded}</div>
                    <div className="text-[10px] text-neutral-500 uppercase tracking-widest mt-1">Folded Pre</div>
                  </div>
                </div>

                {/* Discipline Physics Playground */}
                <div className="mb-2 pl-2 text-[11px] font-bold uppercase tracking-widest text-neutral-500">
                  Cast votes for the Generous Winner in HDPG!
                </div>
                <TokenPhysicsArea 
                  count={discTokens} 
                  onAdd={() => setDiscTokens(prev => prev + 1)}
                  onRemove={() => setDiscTokens(prev => Math.max(0, prev - 1))}
                />

                {/* Log Hand Button */}
                <button 
                  onClick={onAddHand}
                  className="w-full bg-yellow-500 text-black font-semibold text-lg py-3.5 rounded-xl flex items-center justify-center gap-2 mb-6 active:scale-[0.98] transition-transform shadow-lg shadow-yellow-500/20 mt-4"
                >
                  <Plus size={20} /> Log Hand
                </button>

                {/* Mini Hand List */}
                <div className="flex items-center justify-between mb-3">
                  <div className="text-[11px] uppercase tracking-widest text-neutral-500">Recent Hands</div>
                  <button 
                    onClick={() => setListHidden(!listHidden)}
                    className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded text-xs font-medium border transition-colors ${listHidden ? 'bg-yellow-500/10 border-yellow-500/30 text-yellow-500' : 'bg-neutral-800 border-neutral-700 text-neutral-400'}`}
                  >
                    {listHidden ? <EyeOff size={14} /> : <Eye size={14} />} {listHidden ? 'Hidden' : 'Visible'}
                  </button>
                </div>

                <div className="flex flex-col gap-2">
                  {hands.length === 0 ? (
                    <div className="text-center py-10 text-neutral-500 border border-dashed border-neutral-800 rounded-xl">
                      <Spade size={32} className="mx-auto mb-3 opacity-20" />
                      <p className="text-sm">No hands logged yet.</p>
                    </div>
                  ) : (
                    hands.slice().reverse().map(h => (
                      <div key={h.id} onClick={() => onEditHand(h.id)} className="bg-neutral-900 border border-neutral-800/70 p-3 rounded-xl flex items-center gap-3 cursor-pointer hover:bg-neutral-800 transition-colors">
                        <div className="text-xs text-neutral-500 font-mono w-6">#{h.num}</div>
                        <div className="flex gap-1">
                          <CardMini card={h.card1} hidden={listHidden} />
                          <CardMini card={h.card2} hidden={listHidden} />
                        </div>
                        <div className="flex-1">
                          <div className="flex items-center gap-2">
                            <span className={`text-sm font-medium ${h.result === 'won' ? 'text-green-500' : h.result === 'lost' ? 'text-red-500' : 'text-neutral-400'}`}>
                              {h.result === 'won' ? 'Won' : h.result === 'lost' ? 'Lost' : 'Folded'}
                            </span>
                            <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded ${h.isVPIP ? 'bg-yellow-500/10 text-yellow-500' : 'bg-neutral-800 text-neutral-500'}`}>
                              {h.isVPIP ? 'VPIP' : 'FOLD'}
                            </span>
                          </div>
                          <div className="text-[11px] text-neutral-500 font-mono mt-1">
                            {h.total > 0 ? `${h.total} chips in` : 'No chips in'}
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>

              {/* End Session Modal */}
              {showEndModal && (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                  <div className="bg-neutral-900 p-6 rounded-2xl w-full max-w-sm border border-neutral-800 animate-in fade-in zoom-in-95 duration-200">
                    <h3 className="text-lg font-medium mb-2 text-white">End session?</h3>
                    <p className="text-sm text-neutral-400 mb-6">Enter your net P&L. This session will be archived.</p>
                    
                    <div className="mb-6">
                      <label className="text-xs text-neutral-500 block mb-2">Net P&L (negative if lost)</label>
                      <input 
                        type="number" 
                        value={pnlInput}
                        onChange={(e) => setPnlInput(e.target.value)}
                        placeholder="e.g. -200 or 500" 
                        className="w-full bg-neutral-950 border border-neutral-700 rounded-lg p-3 text-white font-mono focus:border-yellow-500 focus:outline-none"
                        autoFocus
                      />
                    </div>

                    <div className="flex flex-col gap-2">
                      <button onClick={handleEndSession} className="w-full bg-yellow-500 text-black font-semibold py-3 rounded-lg active:scale-95 transition-transform">
                        Save & End Session
                      </button>
                      <button onClick={() => setShowEndModal(false)} className="w-full bg-transparent border border-neutral-700 text-white font-medium py-3 rounded-lg active:scale-95 transition-transform">
                        Cancel
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // --- SCREEN: ADD HAND ---
        function ScreenAddHand({ hands, setHands, navigate, showToast, editingHandId }) {
          const initialHand = editingHandId ? hands.find(h => h.id === editingHandId) : null;

          const [holeCardsHidden, setHoleCardsHidden] = useState(false);
          const [pickingCard, setPickingCard] = useState(1);
          const [pendingRank, setPendingRank] = useState(null);
          const [card1, setCard1] = useState(initialHand ? initialHand.card1 : null);
          const [card2, setCard2] = useState(initialHand ? initialHand.card2 : null);
          
          const [bets, setBets] = useState(initialHand ? {
            preflop: initialHand.bets.preflop.amount || '',
            flop: initialHand.bets.flop.amount || '',
            turn: initialHand.bets.turn.amount || '',
            river: initialHand.bets.river.amount || ''
          } : { preflop: '', flop: '', turn: '', river: '' });
          
          const [folds, setFolds] = useState(initialHand ? {
            preflop: initialHand.bets.preflop.folded,
            flop: initialHand.bets.flop.folded,
            turn: initialHand.bets.turn.folded,
            river: initialHand.bets.river.folded
          } : { preflop: false, flop: false, turn: false, river: false });
          
          const [result, setResult] = useState(initialHand ? initialHand.result : null);

          const totalIn = Object.values(bets).reduce((acc, val) => acc + (parseFloat(val) || 0), 0);
          const isVPIP = (parseFloat(bets.preflop) || 0) > 0 && !folds.preflop;

          const handleSelectRank = (r) => {
            setPendingRank(r);
          };

          const handleSelectSuit = (suitObj) => {
            if (!pendingRank) return;
            const newCard = { rank: pendingRank, suit: suitObj.symbol, suitName: suitObj.name };
            
            // Check dupe
            const otherCard = pickingCard === 1 ? card2 : card1;
            if (otherCard && otherCard.rank === newCard.rank && otherCard.suit === newCard.suit) {
              showToast('Card already selected');
              return;
            }

            if (pickingCard === 1) {
              setCard1(newCard);
              setPickingCard(2);
            } else {
              setCard2(newCard);
              setPickingCard(1);
            }
            setPendingRank(null);
          };

          const handleClearCards = () => {
            setCard1(null); setCard2(null); setPendingRank(null); setPickingCard(1);
          };

          const handleBetChange = (round, val) => {
            setBets(prev => ({ ...prev, [round]: val }));
          };

          const toggleFold = (round) => {
            setFolds(prev => ({ ...prev, [round]: !prev[round] }));
          };

          const handleSave = () => {
            if (!result) return;

            const formattedBets = {
              preflop: { amount: parseFloat(bets.preflop) || 0, folded: folds.preflop },
              flop: { amount: parseFloat(bets.flop) || 0, folded: folds.flop },
              turn: { amount: parseFloat(bets.turn) || 0, folded: folds.turn },
              river: { amount: parseFloat(bets.river) || 0, folded: folds.river }
            };

            if (initialHand) {
              setHands(hands.map(h => h.id === initialHand.id ? {
                ...h, card1, card2, bets: formattedBets, total: totalIn, isVPIP, result, ts: Date.now()
              } : h));
              showToast(`Hand #${initialHand.num} updated`);
            } else {
              const newHand = {
                id: Date.now(),
                num: hands.length + 1,
                card1,
                card2,
                bets: formattedBets,
                total: totalIn,
                isVPIP,
                result,
                ts: Date.now()
              };
              setHands([...hands, newHand]);
              showToast(`Hand #${newHand.num} saved`);
            }
            navigate('session');
          };

          const handleDelete = () => {
            if (window.confirm('Delete this hand?')) {
              setHands(hands.filter(h => h.id !== initialHand.id));
              showToast(`Hand #${initialHand.num} deleted`);
              navigate('session');
            }
          };

          // UI Helpers
          const CardLarge = ({ card, placeholder }) => {
            if (holeCardsHidden && card) {
              return <div className="w-16 h-24 rounded-xl border-2 border-neutral-700 bg-neutral-800 flex items-center justify-center text-3xl text-neutral-500 font-mono shadow-inner select-none">?</div>;
            }
            if (!card) {
              return <div className="w-16 h-24 rounded-xl border-2 border-dashed border-neutral-700 bg-neutral-900 flex items-center justify-center text-sm text-neutral-600 font-mono select-none">{placeholder}</div>;
            }
            const isRed = card.suitName === 'hearts' || card.suitName === 'diamonds';
            return (
              <div className={`w-16 h-24 rounded-xl border-2 flex flex-col items-center justify-center font-mono select-none shadow-lg
                ${isRed ? 'bg-gradient-to-br from-[#3a1515] to-[#1e0e0e] border-red-900/50 text-red-500' : 'bg-gradient-to-br from-[#151530] to-[#0e0e1e] border-blue-900/50 text-blue-400'}`}>
                <span className="text-3xl font-bold leading-none mb-1">{card.rank}</span>
                <span className="text-3xl leading-none">{card.suit}</span>
              </div>
            );
          };

          // Calculate used ranks to grey them out if pocket pairs are impossible
          const isUsed = (r) => {
            if (holeCardsHidden) return false; // Hide used state when cards are hidden to prevent shoulder-surfing
            if (card1 && card2 && card1.rank !== card2.rank) {
              return card1.rank === r || card2.rank === r;
            }
            return false;
          };

          const handleToggleHide = () => {
            const willHide = !holeCardsHidden;
            setHoleCardsHidden(willHide);
            if (willHide) {
              setPendingRank(null); // Clear active selection to hide the suit row and remove rank highlight
            }
          };

          return (
            <div className="flex flex-col h-full bg-neutral-950">
              {/* Header */}
              <div className="px-4 pt-12 pb-4 border-b border-neutral-800/50 flex justify-between items-center sticky top-0 bg-neutral-950 z-20">
                <button onClick={() => navigate('session')} className="p-2 -ml-2 text-neutral-400 hover:text-white transition-colors">
                  <ArrowLeft size={20} />
                </button>
                <h1 className="text-lg font-medium text-white">{initialHand ? `Edit Hand #${initialHand.num}` : `Hand #${hands.length + 1}`}</h1>
                <div className="w-8"></div> {/* Placeholder to balance header */}
              </div>

              <div className="flex-1 overflow-y-auto p-4 pb-12 space-y-4">
                {/* Card Picker */}
                <div className="bg-neutral-900 rounded-xl p-4 border border-neutral-800/50">
                  <div className="text-[11px] uppercase tracking-widest text-neutral-500 mb-4 text-center">Select your hole cards</div>
                  
                  <div className="flex justify-center gap-4 mb-4">
                    <CardLarge card={card1} placeholder="Card 1" />
                    <CardLarge card={card2} placeholder="Card 2" />
                  </div>

                  <div className="text-center text-xs text-yellow-500 font-medium mb-3 h-4">
                    {!card1 || !card2 ? `Pick rank, then suit → Card ${pickingCard}` : 'Both cards selected ✓'}
                  </div>

                  <div className="grid grid-cols-7 gap-1.5 mb-3">
                    {RANKS.map(r => (
                      <button 
                        key={r} 
                        onClick={() => handleSelectRank(r)}
                        disabled={isUsed(r)}
                        className={`py-2 rounded font-mono font-medium text-sm transition-all border
                          ${pendingRank === r ? 'bg-red-950 border-red-500 text-red-500' : 
                            isUsed(r) ? 'bg-neutral-950 border-neutral-800 text-neutral-700 opacity-30' : 
                            'bg-neutral-800 border-neutral-700 text-neutral-300 hover:bg-neutral-700'}`}
                      >
                        {r}
                      </button>
                    ))}
                  </div>

                  {pendingRank && (
                    <div className="flex justify-center gap-2 mb-2 animate-in fade-in slide-in-from-top-2 duration-200">
                      {SUITS.map(s => (
                        <button 
                          key={s.name}
                          onClick={() => handleSelectSuit(s)}
                          className={`w-14 h-12 rounded border flex items-center justify-center text-2xl active:scale-90 transition-all ${s.bg} ${s.border} ${s.color}`}
                        >
                          {s.symbol}
                        </button>
                      ))}
                    </div>
                  )}

                  <div className="flex justify-between items-center mt-6 border-t border-neutral-800 pt-4">
                    <button onClick={handleClearCards} className="text-xs text-neutral-400 hover:text-white px-2 py-1">Clear cards</button>
                    <button 
                      onClick={handleToggleHide}
                      className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded transition-colors ${holeCardsHidden ? 'bg-yellow-500/10 text-yellow-500 border border-yellow-500/30' : 'bg-neutral-800 text-neutral-400 border border-neutral-700'}`}
                    >
                      {holeCardsHidden ? <EyeOff size={14} /> : <Eye size={14} />} {holeCardsHidden ? 'Hidden' : 'Hide'}
                    </button>
                  </div>
                </div>

                {/* Betting section */}
                <div className="bg-neutral-900 rounded-xl p-4 border border-neutral-800/50 space-y-3">
                  <div className="text-[11px] uppercase tracking-widest text-neutral-500 mb-2">Chips Put In</div>
                  
                  {[
                    { id: 'preflop', label: 'Pre-flop', color: 'text-yellow-500' },
                    { id: 'flop', label: 'Flop', color: 'text-cyan-400' },
                    { id: 'turn', label: 'Turn', color: 'text-purple-400' },
                    { id: 'river', label: 'River', color: 'text-green-500' }
                  ].map(round => (
                    <div key={round.id} className="flex items-center gap-3">
                      <div className={`w-16 text-xs font-medium ${round.color}`}>{round.label}</div>
                      <input 
                        type="number" 
                        placeholder="0"
                        value={bets[round.id]}
                        onChange={(e) => handleBetChange(round.id, e.target.value)}
                        className="flex-1 bg-neutral-950 border border-neutral-700 rounded-lg p-2 text-white font-mono focus:border-yellow-500 outline-none placeholder:text-neutral-600"
                      />
                      <button 
                        onClick={() => toggleFold(round.id)}
                        className={`w-24 flex items-center justify-center gap-1.5 px-3 py-2 rounded border text-xs font-medium transition-colors
                          ${folds[round.id] ? 'bg-red-500/10 border-red-500/30 text-red-500' : 'bg-neutral-800 border-neutral-700 text-neutral-400'}`}
                      >
                        <div className={`w-2 h-2 rounded-full ${folds[round.id] ? 'bg-red-500' : 'bg-neutral-600'}`}></div>
                        Folded
                      </button>
                    </div>
                  ))}

                  <div className="border-t border-neutral-800 mt-4 pt-3 flex justify-between items-center">
                    <span className="text-sm text-neutral-400">Total chips in:</span>
                    <span className="text-lg font-mono font-medium text-yellow-500">{totalIn}</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-sm text-neutral-400">Counts as VPIP?</span>
                    <span className={`text-sm font-medium ${isVPIP ? 'text-green-500' : 'text-neutral-500'}`}>{isVPIP ? 'Yes' : 'No'}</span>
                  </div>
                </div>

                {/* Result */}
                <div className="bg-neutral-900 rounded-xl p-4 border border-neutral-800/50">
                  <div className="text-[11px] uppercase tracking-widest text-neutral-500 mb-3">Outcome</div>
                  <div className="grid grid-cols-3 gap-2">
                    <button onClick={() => setResult('won')} className={`py-3 rounded-xl border text-sm font-bold transition-all ${result === 'won' ? 'bg-green-500/20 border-green-500 text-green-400 ring-2 ring-green-500 shadow-[0_0_15px_rgba(34,197,94,0.15)]' : 'bg-neutral-800 border-neutral-700 text-neutral-400 hover:bg-neutral-700'}`}>Won</button>
                    <button onClick={() => setResult('lost')} className={`py-3 rounded-xl border text-sm font-bold transition-all ${result === 'lost' ? 'bg-red-500/20 border-red-500 text-red-400 ring-2 ring-red-500 shadow-[0_0_15px_rgba(239,68,68,0.15)]' : 'bg-neutral-800 border-neutral-700 text-neutral-400 hover:bg-neutral-700'}`}>Lost</button>
                    <button onClick={() => setResult('fold')} className={`py-3 rounded-xl border text-sm font-bold transition-all ${result === 'fold' ? 'bg-neutral-700 border-neutral-400 text-white ring-2 ring-neutral-400' : 'bg-neutral-800 border-neutral-700 text-neutral-400 hover:bg-neutral-700'}`}>Folded</button>
                  </div>
                </div>
                
                {/* Actions */}
                <div className="mt-6 flex flex-col gap-3">
                  <button 
                    onClick={handleSave}
                    disabled={!result}
                    className={`w-full py-3.5 rounded-xl font-semibold text-lg flex items-center justify-center gap-2 transition-all ${!result ? 'bg-neutral-800 text-neutral-500 cursor-not-allowed' : 'bg-yellow-500 text-black active:scale-[0.98] shadow-lg shadow-yellow-500/20'}`}
                  >
                    {initialHand ? 'Update Hand' : 'Save Hand'}
                  </button>
                  {initialHand && (
                    <button 
                      onClick={handleDelete}
                      className="w-full py-3 rounded-xl font-medium text-red-500 bg-red-500/10 hover:bg-red-500/20 transition-colors"
                    >
                      Delete Hand
                    </button>
                  )}
                </div>

                {/* Bottom padding for scroll */}
                <div className="h-6"></div>
              </div>
            </div>
          );
        }

        // --- SCREEN: HISTORY (Current Session) ---
        function ScreenHistory({ hands, startTime, showToast, onEditHand }) {
          const exportSession = () => {
            if (!hands.length) { showToast('No hands to export'); return; }
            
            let csv = 'Session,Date,Hand,Card1,Card2,VPIP,Preflop,PreflopFold,Flop,FlopFold,Turn,TurnFold,River,RiverFold,TotalChips,Result\n';
            const date = new Date(startTime).toLocaleDateString();
            
            hands.forEach(h => {
              const c1 = h.card1 ? h.card1.rank + h.card1.suit : '';
              const c2 = h.card2 ? h.card2.rank + h.card2.suit : '';
              const b = h.bets;
              csv += `current,${date},${h.num},${c1},${c2},${h.isVPIP?'Y':'N'},${b.preflop.amount},${b.preflop.folded?'Y':'N'},${b.flop.amount},${b.flop.folded?'Y':'N'},${b.turn.amount},${b.turn.folded?'Y':'N'},${b.river.amount},${b.river.folded?'Y':'N'},${h.total},${h.result}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'poker_session_current.csv';
            a.click();
            showToast('Current session exported');
          };

          return (
            <div className="flex flex-col h-full overflow-hidden">
              <div className="px-5 pt-12 pb-4 border-b border-neutral-800/50 bg-neutral-950 sticky top-0 z-10 flex justify-between items-center">
                <div>
                  <h1 className="text-lg font-medium text-white">Hands Log</h1>
                  <p className="text-xs text-neutral-500 font-mono mt-0.5">{hands.length} hands this session</p>
                </div>
                <button onClick={exportSession} className="p-2 text-neutral-400 hover:text-white transition-colors bg-neutral-900 rounded border border-neutral-800">
                  <Download size={18} />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
                {hands.length === 0 ? (
                  <div className="text-center py-20 text-neutral-500">
                    <History size={40} className="mx-auto mb-4 opacity-20" />
                    <p>No hands recorded yet this session.</p>
                  </div>
                ) : (
                  hands.slice().reverse().map(h => (
                     <div key={h.id} onClick={() => onEditHand(h.id)} className="bg-neutral-900 border border-neutral-800 p-4 rounded-xl flex flex-col gap-3 cursor-pointer hover:bg-neutral-800/80 transition-colors">
                       <div className="flex justify-between items-start w-full">
                         <div className="flex items-center gap-3">
                            <span className="text-sm text-neutral-500 font-mono">#{h.num}</span>
                            <div className="flex gap-1">
                              <CardMini card={h.card1} hidden={false} />
                              <CardMini card={h.card2} hidden={false} />
                            </div>
                            <span className={`text-[10px] font-mono px-2 py-1 rounded-md ${h.isVPIP ? 'bg-yellow-500/10 text-yellow-500' : 'bg-neutral-800 text-neutral-500'}`}>
                              {h.isVPIP ? 'VPIP' : 'FOLD'}
                            </span>
                         </div>
                         <span className={`text-sm font-medium ${h.result === 'won' ? 'text-green-500' : h.result === 'lost' ? 'text-red-500' : 'text-neutral-500'}`}>
                           {h.result === 'won' ? 'Won' : h.result === 'lost' ? 'Lost' : 'Folded'}
                         </span>
                       </div>
                       
                       <div className="pl-9 flex flex-wrap gap-x-4 gap-y-1 text-xs font-mono text-neutral-400">
                         {['preflop', 'flop', 'turn', 'river'].map(r => {
                           const bet = h.bets[r];
                           if (!bet || (bet.amount === 0 && !bet.folded)) return null;
                           const color = r==='preflop'?'text-yellow-500':r==='flop'?'text-cyan-400':r==='turn'?'text-purple-400':'text-green-500';
                           return (
                             <span key={r} className="flex items-center gap-1">
                               <span className={color}>{r.substring(0,3).toUpperCase()}:</span> 
                               {bet.amount > 0 ? bet.amount : '-'} 
                               {bet.folded && <span className="text-red-500/70">(F)</span>}
                             </span>
                           );
                         })}
                       </div>
                       
                       <div className="pl-9 pt-2 border-t border-neutral-800/50 flex justify-between items-center mt-1">
                         <span className="text-xs text-neutral-500">Total Invested</span>
                         <span className="text-sm font-mono font-medium text-white">{h.total}</span>
                       </div>
                     </div>
                  ))
                )}
              </div>
            </div>
          );
        }

        // --- SCREEN: SESSIONS (Archive) ---
        function ScreenSessions({ sessions, setSessions, showToast }) {
          const [openId, setOpenId] = useState(null);

          const deleteSession = (e, sessionId) => {
            e.stopPropagation();
            if (!window.confirm('Delete this session? Data will be lost.')) return;
            setSessions(sessions.filter(s => s.id !== sessionId));
            setOpenId(null);
            showToast('Session deleted');
          };

          const getHeatmapColor = (h) => {
            if (!h.isVPIP) return 'bg-slate-900 border-slate-800'; // Pre-flop fold (blueish)
            if (h.result === 'won') return 'bg-green-950 border-green-900';
            if (h.result === 'lost') return 'bg-red-950 border-red-900';
            return 'bg-yellow-950/50 border-yellow-900/50'; // VPIP but folded later
          };

          return (
            <div className="flex flex-col h-full overflow-hidden">
              <div className="px-5 pt-12 pb-4 border-b border-neutral-800/50 bg-neutral-950 sticky top-0 z-10">
                <h1 className="text-lg font-medium text-white">Archived Sessions</h1>
                <p className="text-xs text-neutral-500 font-mono mt-0.5">{sessions.length} saved sessions</p>
              </div>

              <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
                {sessions.length === 0 ? (
                  <div className="text-center py-20 text-neutral-500">
                    <Layers size={40} className="mx-auto mb-4 opacity-20" />
                    <p>No past sessions yet.<br/>End an active session to archive it here.</p>
                  </div>
                ) : (
                  sessions.map((s, idx) => {
                    const isOpen = openId === idx;
                    const vpipColor = s.vpip <= 30 ? 'text-green-500' : s.vpip <= 50 ? 'text-yellow-500' : 'text-red-500';
                    const pnlColor = s.pnl >= 0 ? 'text-green-500' : 'text-red-500';

                    return (
                      <div key={s.id} className="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden transition-all">
                        <button 
                          onClick={() => setOpenId(isOpen ? null : idx)}
                          className="w-full p-4 flex items-center justify-between hover:bg-neutral-800/50 transition-colors text-left"
                        >
                          <div>
                            <div className="font-medium text-white">{s.date}</div>
                            <div className="text-[11px] text-neutral-500 font-mono mt-1">
                              {s.totalHands} hands · ★{s.discTokens || 0} discipline
                            </div>
                          </div>
                          <div className="flex items-center gap-4">
                            <span className={`font-mono text-xs ${vpipColor}`}>VPIP {s.vpip}%</span>
                            <span className={`font-mono text-sm font-medium w-12 text-right ${pnlColor}`}>
                              {s.pnl > 0 ? '+' : ''}{s.pnl}
                            </span>
                            {isOpen ? <ChevronUp size={16} className="text-neutral-500" /> : <ChevronDown size={16} className="text-neutral-500" />}
                          </div>
                        </button>

                        {isOpen && (
                          <div className="p-4 pt-0 border-t border-neutral-800 bg-neutral-950/50">
                            <div className="mt-4 mb-3 flex flex-wrap gap-1">
                              {(s.hands || []).map((h, i) => (
                                <div 
                                  key={i} 
                                  title={`Hand #${h.num}: ${h.isVPIP?'VPIP':'Fold'} - ${h.result}`}
                                  className={`w-[18px] h-[18px] rounded-[3px] border ${getHeatmapColor(h)}`}
                                ></div>
                              ))}
                            </div>
                            
                            <div className="flex gap-4 flex-wrap mb-4 px-1">
                              <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-sm bg-green-950 border border-green-900"></div><span className="text-[10px] text-neutral-500">VPIP Won</span></div>
                              <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-sm bg-red-950 border border-red-900"></div><span className="text-[10px] text-neutral-500">VPIP Lost</span></div>
                              <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-sm bg-yellow-950/50 border border-yellow-900/50"></div><span className="text-[10px] text-neutral-500">VPIP Fold</span></div>
                              <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 rounded-sm bg-slate-900 border border-slate-800"></div><span className="text-[10px] text-neutral-500">Pre Fold</span></div>
                            </div>

                            <button 
                              onClick={(e) => deleteSession(e, s.id)}
                              className="flex items-center gap-2 text-xs text-red-500 bg-red-500/10 border border-red-500/20 px-3 py-2 rounded hover:bg-red-500/20 transition-colors"
                            >
                              <Trash2 size={14} /> Delete
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          );
        }

        // --- SCREEN: STATS & DATA MANAGEMENT ---
        function ScreenStats({ hands, sessions, discTokens, startTime, setHands, setSessions, setDiscTokens, setStartTime, clearAllData, showToast }) {
          
          // Calculate Lifetime Stats
          const totalHands = sessions.reduce((acc, s) => acc + s.totalHands, 0) + hands.length;
          const totalPlayed = sessions.reduce((acc, s) => acc + s.played, 0) + hands.filter(h => h.isVPIP).length;
          const lifetimeVPIP = totalHands > 0 ? Math.round((totalPlayed / totalHands) * 100) : 0;
          const lifetimePnl = sessions.reduce((acc, s) => acc + s.pnl, 0);
          const lifetimeDisc = sessions.reduce((acc, s) => acc + (s.discTokens || 0), 0) + discTokens;

          const vpipColor = lifetimeVPIP <= 30 ? 'text-green-500' : lifetimeVPIP <= 50 ? 'text-yellow-500' : 'text-red-500';
          const vpipBg = lifetimeVPIP <= 30 ? 'bg-green-500' : lifetimeVPIP <= 50 ? 'bg-yellow-500' : 'bg-red-500';

          const exportJSON = () => {
            const data = {
              version: 3,
              exportedAt: new Date().toISOString(),
              sessions,
              currentSession: { startTime, hands, discTokens }
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pt_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            showToast('Backup exported');
          };

          const importJSON = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const data = JSON.parse(ev.target.result);
                if (!data.sessions) throw new Error("Invalid structure");
                
                if(window.confirm('Restore backup? ALL current data will be replaced.')) {
                  setSessions(data.sessions || []);
                  setHands(data.currentSession?.hands || []);
                  setDiscTokens(data.currentSession?.discTokens || 0);
                  setStartTime(data.currentSession?.startTime || Date.now());
                  showToast('Backup restored successfully');
                }
              } catch (err) {
                showToast('Invalid backup file format');
              }
            };
            reader.readAsText(file);
            e.target.value = null; // reset input
          };

          if (totalHands === 0) {
            return (
              <div className="flex flex-col h-full bg-neutral-950">
                 <div className="px-5 pt-12 pb-4 border-b border-neutral-800/50"><h1 className="text-lg font-medium text-white">Lifetime Stats</h1></div>
                 <div className="flex-1 flex flex-col items-center justify-center text-neutral-500 p-8 text-center">
                    <BarChart2 size={48} className="mb-4 opacity-20" />
                    <p>No data yet. Complete a session to see lifetime statistics.</p>
                 </div>
              </div>
            );
          }

          return (
            <div className="flex flex-col h-full overflow-hidden">
              <div className="px-5 pt-12 pb-4 border-b border-neutral-800/50 bg-neutral-950 sticky top-0 z-10">
                <h1 className="text-lg font-medium text-white">Lifetime Stats</h1>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-12">
                {/* KPI Grid */}
                <div className="grid grid-cols-2 gap-2">
                  <div className="bg-neutral-900 p-4 rounded-xl border border-neutral-800 text-center">
                    <div className={`text-3xl font-mono font-medium ${vpipColor}`}>{lifetimeVPIP}%</div>
                    <div className="text-[10px] text-neutral-500 uppercase tracking-widest mt-1">Total VPIP</div>
                  </div>
                  <div className="bg-neutral-900 p-4 rounded-xl border border-neutral-800 text-center">
                    <div className="text-3xl font-mono font-medium text-white">{totalHands}</div>
                    <div className="text-[10px] text-neutral-500 uppercase tracking-widest mt-1">Total Hands</div>
                  </div>
                  <div className={`bg-neutral-900 p-4 rounded-xl border border-neutral-800 text-center ${lifetimePnl >= 0 ? 'text-green-500' : 'text-red-500'}`}>
                    <div className="text-3xl font-mono font-medium">{lifetimePnl > 0 ? '+' : ''}{lifetimePnl}</div>
                    <div className="text-[10px] text-neutral-500 uppercase tracking-widest mt-1">Net P&L</div>
                  </div>
                  <div className="bg-neutral-900 p-4 rounded-xl border border-neutral-800 text-center">
                    <div className="text-3xl font-mono font-medium text-yellow-500">{lifetimeDisc}</div>
                    <div className="text-[10px] text-neutral-500 uppercase tracking-widest mt-1">★ Discipline</div>
                  </div>
                </div>

                {/* VPIP Target Bar */}
                <div className="bg-neutral-900 p-5 rounded-xl border border-neutral-800">
                  <div className="flex justify-between items-center mb-3">
                    <span className="text-xs font-medium text-white">VPIP Performance</span>
                    <span className={`text-xs ${vpipColor}`}>{lifetimeVPIP <= 30 ? 'On Target ✓' : 'Too Loose'}</span>
                  </div>
                  <div className="h-2 bg-neutral-950 rounded-full overflow-hidden mb-1 border border-neutral-800">
                    <div className={`h-full ${vpipBg} transition-all duration-500`} style={{ width: `${Math.min(lifetimeVPIP, 100)}%` }}></div>
                  </div>
                  <div className="flex justify-between text-[10px] text-neutral-500 font-mono">
                    <span>0%</span>
                    <span>Target: 30%</span>
                    <span>100%</span>
                  </div>
                </div>

                {/* Data Management */}
                <div className="bg-neutral-900 p-5 rounded-xl border border-neutral-800 mt-6">
                  <h3 className="text-[11px] font-bold uppercase tracking-widest text-neutral-500 mb-4">Data Management</h3>
                  
                  <div className="space-y-2">
                    <button onClick={exportJSON} className="w-full flex items-center gap-3 p-3 bg-neutral-950 border border-neutral-800 rounded-lg hover:border-neutral-600 transition-colors text-left">
                      <Download size={18} className="text-neutral-400" />
                      <div>
                        <div className="text-sm font-medium text-white">Export Backup (.json)</div>
                        <div className="text-[10px] text-neutral-500 mt-0.5">Save all sessions and current state</div>
                      </div>
                    </button>
                    
                    <label className="w-full flex items-center gap-3 p-3 bg-neutral-950 border border-neutral-800 rounded-lg hover:border-neutral-600 transition-colors text-left cursor-pointer">
                      <Upload size={18} className="text-neutral-400" />
                      <div>
                        <div className="text-sm font-medium text-white">Restore Backup</div>
                        <div className="text-[10px] text-neutral-500 mt-0.5">Load from a previously exported file</div>
                      </div>
                      <input type="file" accept=".json" className="hidden" onChange={importJSON} />
                    </label>
                  </div>

                  <div className="mt-8 pt-4 border-t border-red-900/30">
                    <button onClick={clearAllData} className="w-full py-3 bg-red-500/10 text-red-500 text-sm font-medium rounded-lg border border-red-500/20 hover:bg-red-500/20 transition-colors">
                      Clear All Lifetime Data
                    </button>
                  </div>
                </div>

              </div>
            </div>
          );
        }

        // --- RENDER APP ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
