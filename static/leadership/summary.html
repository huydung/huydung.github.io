{id:9,num:"Ch 9",title:"Authentic Leadership",
tagline:"Authentic leaders know themselves deeply, act on their values, build genuinely transparent relationships, and process information with disciplined balance.",
overview:`<p><strong>Emergence and Context.</strong> Authentic leadership emerged as a research area in the early 2000s — partly in response to corporate scandals (Enron, WorldCom), political distrust, and post-9/11 uncertainty. People demanded leaders they could genuinely trust. The theory builds on positive organizational psychology (Luthans & Avolio, 2003) and draws from authentic self theory in psychology. It represents a convergence of the practical leader development literature (George, 2003) and academic theory-building (Avolio, Gardner, Walumbwa and colleagues).</p>
<p><strong>Bill George's Practical Approach.</strong> Based on interviews with 125 senior leaders, Bill George (2003) identified five dimensions of authentic leaders: Purpose (they know what they are about and where they are going; driven by passion, not ego), Values (strong values about right and wrong; behave consistently with those values), Relationships (establish genuine, trusting connections; relationship quality underpins their leadership), Self-discipline (demonstrate consistency between stated values and actions over time), Heart (empathetic awareness of others' situations). George's approach is explicitly developmental — authentic leadership can be grown over a career.</p>
<p><strong>The Theoretical Model: Four Components (Walumbwa et al., 2008).</strong> The most widely cited academic framework identifies four behavioral components: (1) Self-Awareness — the ongoing process of understanding oneself, including one's strengths, weaknesses, emotions, and values, and the impact one has on others. Not a fixed state but an ongoing reflective process. (2) Internalized Moral Perspective — using internal moral standards and values to guide behavior rather than yielding to group pressures, organizational pressures, or social desirability. (3) Balanced Processing — objectively analyzing all relevant data before making decisions; soliciting views that challenge deeply held positions; reducing confirmation bias and self-serving processing. (4) Relational Transparency — presenting one's authentic self to others; openly sharing information and expressing genuine feelings appropriate to the situation; avoiding impression management and deception.</p>
<p><strong>Positive Psychological Capital (PsyCap).</strong> Luthans and Avolio's (2003) positive organizational behavior perspective adds a psychological dimension to authentic leadership. PsyCap consists of HERO: Hope (setting goals and finding pathways), Efficacy (confidence in one's ability to succeed), Resilience (bouncing back from adversity), Optimism (making positive attributions about success). Authentic leaders score high on PsyCap, and this foundation enables them to lead through uncertainty and adversity without losing their core identity.</p>
<p><strong>Critical Life Events and Development.</strong> Authentic leadership develops throughout one's life, particularly through "trigger events" — significant life experiences (facing death, major failure, ethical dilemmas, cultural dislocation) that force leaders to examine their values, confront their identity, and develop deeper self-knowledge. Shamir and Eilam (2005) argue that authentic leaders have clear life stories and can articulate how their experiences shaped their leadership identity — narrative coherence is a marker of authentic leadership development.</p>
<p><strong>Research and Critique.</strong> Research shows authentic leadership positively predicts follower trust, well-being, organizational commitment, and performance. However, critics (Avolio & Mhatre, 2012; Cooper, Scandura & Schriesheim, 2005) note that: (1) the theory's domain is not clearly differentiated from other moral leadership approaches (servant, ethical, transformational); (2) the four-component model needs more theoretical grounding; (3) "authentic" doesn't distinguish between genuine authenticity and self-serving rationalization of fixed habits.</p>`,
concepts:[{l:"George's 5 Dimensions",v:"Purpose, Values, Relationships, Self-Discipline, Heart (George, 2003)"},{l:"Self-Awareness",v:"Ongoing process; knowing values, strengths, weaknesses, emotional patterns, impact on others"},{l:"Internalized Moral Perspective",v:"Act on internal values — not external pressure, social desirability, or politics"},{l:"Balanced Processing",v:"Analyze all relevant information before deciding; actively seek disconfirming views"},{l:"Relational Transparency",v:"Present genuine self; appropriate openness; avoid impression management"},{l:"HERO PsyCap",v:"Hope, Efficacy, Resilience, Optimism — the psychological foundation (Luthans & Avolio, 2003)"}],
vn:`Authentic leadership presents both a profound opportunity and a specific cultural challenge for Vietnamese tech leaders. The opportunity: global stakeholders are hungry for leaders they can genuinely trust — and the bar is low because inauthentic leadership is so common.\n\nThe challenge: Vietnamese professional culture rewards 'face-saving' (keeping appearance of competence and confidence even when uncertain) and social harmony (not expressing views that might create discomfort). This directly conflicts with relational transparency and balanced processing as defined by the theory.\n\nFor a Vietnamese tech leader operating in an MNC: practicing relational transparency means saying 'I don't know yet, but I'll find out and get back to you by Tuesday' — which feels risky in local norms but builds enormous trust internationally. Balanced processing means presenting problems to HQ with genuinely multiple perspectives, not just the framing that makes Vietnam look best. Your unique life story — growing up independently, bridging cultures, building across contexts — is precisely the authentic foundation to build distinctive leadership from.`,
strengths:["Builds deep, durable trust — the foundation of cross-cultural leadership","Grows over lifetime — life experiences deepen authentic leadership capacity","Research-backed links to follower trust, well-being, performance, and commitment"],
weaknesses:["Conceptual overlap with servant, ethical, and transformational leadership","Hard to distinguish 'authentic' from 'authentically wrong' — doesn't guarantee good values","Self-awareness is notoriously difficult to accurately self-assess"],
tips:["Write a personal leadership credo — 1 page, what you genuinely believe about how to lead","Identify your 3 most formative 'trigger events' and articulate what they taught you","Practice balanced processing: always present at least 2 perspectives before your conclusion","Build relational transparency incrementally — appropriate vulnerability is a global leadership strength"],
sources:[
{group:"Foundational Works",items:[
{t:"Authentic Leadership: Rediscovering the Secrets to Creating Lasting Value (2003)",a:"Bill George",n:"Practical authentic leadership approach based on interviews with 125 senior leaders. Launched the field in the popular press."},
{t:"Authentic Leadership Theory and Practice: Origins, Effects and Development (2005)",a:"Gardner, Avolio & Walumbwa (Eds.)",n:"Academic volume establishing the theoretical framework; multiple seminal papers."},
{t:"Authentic Leadership Questionnaire (2008)",a:"Walumbwa, Avolio, Gardner, Wernsing & Peterson, Journal of Management",n:"Four-component model (self-awareness, moral perspective, balanced processing, relational transparency); developed and validated the ALQ instrument."}
]},
{group:"Related Foundations",items:[
{t:"Authentic Leadership: An Integrative History (2012)",a:"Avolio & Mhatre, in D. Day & J. Antonakis (Eds.) The Nature of Leadership",n:"Critical review of authentic leadership research and unresolved theoretical questions."},
{t:"Authentic Leadership Development: Getting to the Root of Positive Forms of Leadership (2003)",a:"Luthans & Avolio, The Leadership Quarterly",n:"Introduced PsyCap (HERO) as the psychological foundation of authentic leadership."}
]}
]
},
{id:10,num:"Ch 10",title:"Servant Leadership",
tagline:"Servant leaders put followers' needs first — not as weakness, but as the most powerful strategy for building extraordinary organizations.",
overview:`<p><strong>Greenleaf's Origin Story.</strong> Robert Greenleaf coined the term "servant leadership" after retiring from 40 years at AT&T and encountering Hermann Hesse's novel The Journey to the East (1956), in which a servant named Leo turns out to be the true leader of a group of travelers. Greenleaf's 1970 essay "The Servant as Leader" challenged the dominant leader-as-authority model: the best leaders begin with the desire to serve, then choose to lead in order to serve better. He founded what became the Greenleaf Center for Servant Leadership in 1964.</p>
<p><strong>The Greenleaf Test.</strong> Greenleaf posed a fundamental diagnostic question: Do those served grow as persons? Do they become healthier, wiser, freer, more autonomous, more likely themselves to become servants? And what is the effect on the least privileged — do they benefit? This test focuses servant leadership on follower development and societal impact, not just organizational performance.</p>
<p><strong>Spears' Ten Characteristics.</strong> Larry Spears (2002) systematically analyzed Greenleaf's writings and identified 10 central characteristics: (1) Listening — servant leaders listen first, understand before responding; (2) Empathy — understand and accept others' unique perspectives; (3) Healing — help followers overcome personal problems; repair damaged relationships; (4) Awareness — acutely attuned to physical, social, political environment; (5) Persuasion — influence through clear, persistent communication rather than positional authority; (6) Conceptualization — dream great dreams, think beyond day-to-day realities, see the whole; (7) Foresight — understand the past, learn from the present, anticipate likely future outcomes; (8) Stewardship — hold the organization in trust for the greater good; (9) Commitment to the Growth of People — servant leaders believe people have intrinsic value beyond their technical contribution; (10) Building Community — create belonging, connection, and local community within organizations.</p>
<p><strong>Liden et al.'s Research Model (2008).</strong> Liden, Wayne, Zhao and Henderson developed a 7-dimension research model: Emotional Healing, Creating Value for the Community, Conceptual Skills, Empowering, Helping Subordinates Grow and Succeed, Putting Subordinates First, Behaving Ethically. They validated a 28-item Servant Leadership Scale and found servant leadership predicted: team performance, organizational citizenship behavior, community citizenship behavior, and reduced turnover intentions — particularly strongly in collectivist cultures.</p>
<p><strong>Van Dierendonck's Integration (2011).</strong> Van Dierendonck synthesized servant leadership literature and identified 6 key characteristics: Empowering and Developing People, Humility, Authenticity, Interpersonal Acceptance, Providing Direction, Stewardship. He found servant leadership is most distinct from transformational and other moral leadership models in its commitment to the growth and well-being of followers and society as the primary motivation — not organizational performance as an end goal.</p>
<p><strong>Servant Leadership and Ethics.</strong> Servant leadership is explicitly a moral form of leadership. Unlike transformational leadership (which can be pseudo-transformational), servant leadership's origins in service orientation make exploitation structurally inconsistent. Ehrhart (2004) found servant leadership predicted organizational citizenship behavior above and beyond transformational leadership — particularly because of the explicit focus on follower development and community building rather than follower compliance or enthusiasm.</p>`,
concepts:[{l:"Greenleaf's Core Premise",v:"'Servant first, then leader' — service motivation precedes the will to lead"},{l:"The Greenleaf Test",v:"'Do those I serve grow as persons?' — ultimate accountability measure"},{l:"Spears' 10 Characteristics",v:"Listening, Empathy, Healing, Awareness, Persuasion, Conceptualization, Foresight, Stewardship, Growth, Community"},{l:"Liden et al.'s 7 Dimensions",v:"Emotional Healing, Community Value, Conceptual Skills, Empowering, Helping Grow, Subordinates First, Ethical Behavior"},{l:"Key Distinction",v:"Van Dierendonck: servant leadership unique in making follower well-being the primary motivation"},{l:"Collectivist Context",v:"Research shows servant leadership is particularly effective in collectivist cultures (Liden et al., 2008)"}],
vn:`Servant leadership sounds paradoxical to traditional Vietnamese management ('leaders are served, not servants') but it maps directly to what Vietnamese tech leaders DO when they're at their best: mentoring juniors, absorbing organizational disruptions so their team can focus, fighting for fair timelines, and making sure credit goes to the people who did the work.\n\nLiden et al.'s finding that servant leadership is particularly effective in collectivist cultures is directly relevant — Vietnam's collectivist orientation means team members deeply notice and respond to leaders who genuinely put the team first. The cultural resonance is potentially stronger than in individualist Western contexts.\n\nPractical application: apply the Greenleaf test annually to your team. 'Are my team members growing as people and professionals? Do they feel more capable, more confident, more autonomous than a year ago?' If the answer is no, servant leadership practice needs attention.`,
strengths:["Creates high trust, loyalty, and psychological safety — the foundation for everything","Counter-cultural and differentiating — rare leaders who serve stand out dramatically","Strong research support for team performance and organizational citizenship outcomes"],
weaknesses:["Can be perceived as weak leadership in high power-distance organizational cultures","Risk of exploitation in organizations that don't reciprocate servant behavior","Requires organizational culture support — difficult to practice alone without institutional protection"],
tips:["Ask in every 1:1: 'What can I remove from your path this week?'","Document bureaucratic obstacles you remove for your team — make the service visible","Apply the Greenleaf Test annually: have my team members grown as persons this year?","In MNCs, protect your team from organizational politics — that is servant leadership's most valuable expression"],
sources:[
{group:"Greenleaf's Foundational Essays",items:[
{t:"The Servant as Leader (1970)",a:"Robert K. Greenleaf, Greenleaf Center",n:"Original essay coining the term; still the clearest statement of servant leadership philosophy."},
{t:"Servant Leadership: A Journey into the Nature of Legitimate Power and Greatness (1977)",a:"Robert K. Greenleaf",n:"Comprehensive book-length treatment; established servant leadership as an organizational philosophy."}
]},
{group:"Research Models",items:[
{t:"Servant Leadership: Development of a Multidimensional Measure (2008)",a:"Liden, Wayne, Zhao & Henderson, The Leadership Quarterly",n:"Developed and validated the 7-dimension, 28-item Servant Leadership Scale; key empirical instrument."},
{t:"Servant Leadership: A Systematic Review and Call for Future Research (2011)",a:"van Dierendonck, Journal of Management",n:"Comprehensive literature review identifying 6 key characteristics and research gaps."},
{t:"Servant Leadership Behaviors and Subordinate Performance (2004)",a:"Ehrhart, Personnel Psychology",n:"Found servant leadership predicted organizational citizenship behavior above and beyond transformational leadership."}
]}
]
},
{id:11,num:"Ch 11",title:"Adaptive Leadership",
tagline:"Adaptive challenges require changes in values and behavior — not just technical solutions. Leaders mobilize people to do this difficult inner and outer work.",
overview:`<p><strong>Heifetz's Framework.</strong> Ronald Heifetz's framework, developed at Harvard's Kennedy School of Government (Heifetz, 1994; Heifetz & Linsky, 2002; Heifetz, Grashow & Linsky, 2009), is the seminal theory. Rather than viewing the leader as a problem-solver or savior, Heifetz conceptualizes the leader as one who mobilizes others to do the adaptive work of facing difficult problems and changes. The leader's role is not to solve the problem but to create the conditions under which others can do the hard work of change.</p>
<p><strong>Technical vs. Adaptive Challenges — The Central Distinction.</strong> The most practically important concept in adaptive leadership: Technical problems have known solutions — apply expertise, best practices, or established procedures. Adaptive challenges require changes in values, beliefs, habits, and behaviors — they cannot be solved by expertise alone. The critical diagnostic question: 'Is this a technical problem that needs better execution, or an adaptive challenge that requires people to change?' Most leadership failures result from treating adaptive challenges as technical problems — applying "best practices" to problems that require genuine human transformation.</p>
<p><strong>Key Adaptive Leadership Behaviors.</strong> Heifetz identifies several critical behaviors for adaptive leaders: (1) Get on the Balcony — step back from the "dance" to see the systemic patterns while remaining engaged in the action. The ability to maintain both a "balcony" (strategic) and "dance floor" (operational) perspective simultaneously is the core adaptive leadership skill. (2) Identify the Adaptive Challenge — distinguish technical from adaptive, and identify specifically whose values and behaviors need to change. (3) Regulate Distress — maintain productive tension; too much pressure destabilizes the system, too little creates complacency. The "productive zone of disequilibrium" is the adaptive work zone. (4) Maintain Disciplined Attention — focus the group's attention on the difficult issues rather than allowing distraction or displacement. (5) Give Work Back to People — resist the temptation to solve problems for followers; require them to develop their own solutions. (6) Protect Diverse Voices — marginalized perspectives often hold the adaptive insight that mainstream voices cannot see.</p>
<p><strong>Complexity Leadership Theory Connection.</strong> Adaptive leadership has been conceptualized as a component of complexity leadership theory (Uhl-Bien, Marion & McKelvey, 2007) — a framework designed for knowledge-era organizations. Complexity theory views organizations as dynamic, non-linear systems where leadership emerges from interactions rather than residing in individuals. Adaptive leadership enables organizations to adapt to complex environmental demands by mobilizing internal adaptive capacity rather than top-down direction.</p>
<p><strong>Biases Underlying the Framework.</strong> Heifetz acknowledges four theoretical biases: Systems bias (problems are embedded in complex interactive systems), Biological bias (adaptation enables thriving in new environments), Service orientation bias (leaders as physicians — diagnose and facilitate, not fix), Psychotherapeutic bias (adaptive change resembles the psychotherapeutic process — facing reality, distinguishing past from present, resolving internal conflict).</p>
<p><strong>Research and Application.</strong> Most adaptive leadership writing is prescriptive and based on observational case studies rather than rigorous experimental research — a limitation Heifetz acknowledges. The framework has been applied to public sector leadership, healthcare transformation, educational change, and increasingly to organizational digital transformation. Its most distinctive contribution is the technical/adaptive distinction — immediately useful in diagnostic thinking.</p>`,
concepts:[{l:"Technical Problems",v:"Known solutions exist — apply expertise, procedures, best practice"},{l:"Adaptive Challenges",v:"Require changes in values, beliefs, behaviors — expertise alone cannot solve"},{l:"Getting on the Balcony",v:"Observe system patterns while remaining engaged — dual perspective"},{l:"Productive Disequilibrium",v:"Zone of productive tension — enough discomfort to change, not so much as to destabilize"},{l:"Give Work Back",v:"Don't solve adaptive problems for people — require them to develop solutions"},{l:"Protect Diverse Voices",v:"Marginalized perspectives often hold the critical adaptive insight"}],
vn:`The technical/adaptive distinction is the most immediately useful concept for Vietnamese tech leaders navigating organizational transformation. When a game studio needs to shift from waterfall feature-factory to live-service GaaS (Game as a Service), the architecture is a technical problem. The mindset shift — 'my job is now continuous player engagement, not shipped products' — is an adaptive challenge.\n\nVietnamese tech leaders in MNC contexts face constant adaptive challenges that are systematically misdiagnosed as technical: adopting remote-first culture (can't be solved with better video call software), building genuine feedback culture in a hierarchy-respecting team (can't be solved with an anonymous survey tool), integrating after acquisition by a Western company (can't be solved with a new org chart). Recognizing 'this is adaptive, not technical' is the first step to actually solving it.\n\nThe 'balcony' metaphor is immediately practical: once per month, block 2 hours to observe your organization without being in the action. What patterns do you see? Who is doing adaptive work? Who is avoiding it? What cultural behaviors are preventing change?`,
strengths:["Explains the near-universal failure mode of treating adaptive challenges as technical","Balcony metaphor is immediately memorable and applicable","Critical for digital transformation and change management — rarely taught but widely needed"],
weaknesses:["Primarily prescriptive — limited rigorous empirical testing","Technical/adaptive distinction is clear in principle but ambiguous in practice","Requires high tolerance for ambiguity and productive discomfort in the leader"],
tips:["Before solving any problem: pause and ask 'Is this technical or adaptive?' — they require fundamentally different responses","Block monthly balcony time: 2 hours of observation without operational action","When introducing change, identify specifically WHO needs to change (what values, habits) — not just WHAT process changes","Protect the people who ask uncomfortable questions — they are often the adaptive intelligence of your system"],
sources:[
{group:"Foundational Works",items:[
{t:"Leadership Without Easy Answers (1994)",a:"Ronald Heifetz",n:"Seminal book establishing the adaptive leadership framework; technical vs. adaptive distinction is the core contribution."},
{t:"Leadership on the Line: Staying Alive Through the Dangers of Leading (2002)",a:"Heifetz & Linsky",n:"Practical extension focused on the personal challenges of adaptive work."},
{t:"The Practice of Adaptive Leadership (2009)",a:"Heifetz, Grashow & Linsky",n:"Comprehensive practitioner guide; most complete statement of the framework."}
]},
{group:"Complexity & Systems",items:[
{t:"Complexity Leadership Theory: Shifting Leadership from the Industrial Age to the Knowledge Era (2007)",a:"Uhl-Bien, Marion & McKelvey, The Leadership Quarterly",n:"Places adaptive leadership within complexity theory; argues knowledge-era organizations require adaptive not just directive leadership."}
]}
]
},
{id:12,num:"Ch 12",title:"Inclusive Leadership",
tagline:"Inclusive leaders create conditions where every member both belongs AND contributes their unique perspective — simultaneously. This is harder than it sounds.",
overview:`<p><strong>Context and Evolution.</strong> Inclusive leadership builds on decades of diversity management research but goes significantly further: diversity management focused on demographic representation; inclusion focuses on whether diverse members are actually engaged, heard, and contributing. The Workforce 2000 report (Johnston & Packer, 1987) predicted that organizations that couldn't leverage diverse workforces would lose competitive advantage. Cox and Blake (1991) built the business case for diversity management. The inclusion concept emerged in the 2000s-2010s as researchers recognized that representation without inclusion was insufficient.</p>
<p><strong>Defining Inclusion: Belonging + Uniqueness.</strong> The foundational definition comes from Shore et al. (2011): inclusion requires both Belonging (I am treated as an insider, accepted by the group) AND Uniqueness (my individual perspective and contribution are valued). These two dimensions are independent and must both be present. High belonging without uniqueness = assimilation (pressure to conform). High uniqueness without belonging = differentiation (marginalization). Low belonging and low uniqueness = exclusion. True inclusion = high belonging AND high uniqueness simultaneously. This framework makes inclusion measurable and actionable.</p>
<p><strong>Chrobot-Mason & Roberson's Inclusive Leadership Model (Chapter Authors).</strong> The chapter presents a comprehensive model identifying: Antecedent Conditions (organizational diversity, multicultural environment, relational demography), Inclusive Leader Behaviors (openness, accessibility, availability, encouragement, fairness), Mediating Processes (affective: belonging, trust, psychological safety; cognitive: innovation, information elaboration), and Outcomes (engagement, team performance, organizational effectiveness, reduced turnover).</p>
<p><strong>Key Inclusive Leader Behaviors.</strong> The model identifies five core behaviors: (1) Openness — willingness to consider diverse perspectives; receptive to new information and viewpoints; (2) Accessibility — physically and psychologically available to all followers, not just a select in-group; (3) Availability — makes time for all team members; demonstrates that their concerns matter; (4) Encouragement — actively invites participation, especially from those who may be reticent; (5) Fairness — consistent, equitable treatment in assignments, recognition, evaluation, and advancement opportunities.</p>
<p><strong>Psychological Safety as Mechanism.</strong> Amy Edmondson's (1999) concept of team psychological safety — the shared belief that team members can take interpersonal risks (speak up, disagree, ask questions, admit mistakes) without fear of negative consequences — is the proximal mechanism through which inclusive leadership produces outcomes. Inclusive leadership creates psychological safety; psychological safety enables information sharing, learning, and innovation. Edmondson's research across industries consistently shows that psychologically safe teams significantly outperform teams without it, particularly on complex, creative, non-routine work.</p>
<p><strong>Intersectionality and Complexity.</strong> Research increasingly recognizes that individuals hold multiple identities simultaneously (gender, ethnicity, nationality, function, seniority) and that inclusion must address the intersection of these identities — not just one dimension at a time. Ferdman (2014) argues that true inclusion requires systemic change in how organizations are structured and led — not just behavioral training for individual leaders.</p>`,
concepts:[{l:"Shore et al.'s Definition",v:"Inclusion = high Belonging AND high Uniqueness simultaneously"},{l:"4 Quadrants",v:"Assimilation (in, not unique) / Differentiation (unique, not in) / Exclusion / Inclusion"},{l:"5 Key Behaviors",v:"Openness, Accessibility, Availability, Encouragement, Fairness"},{l:"Psychological Safety",v:"Edmondson (1999): belief that interpersonal risk-taking is safe — the proximal mechanism"},{l:"Diversity ≠ Inclusion",v:"Having diverse members ≠ including their perspectives in actual decisions"},{l:"Business Case",v:"Cox & Blake (1991): diversity creates competitive advantage ONLY when inclusion enables its use"}],
vn:`For Vietnamese tech leaders at MNCs, inclusion has three distinct dimensions. Within Vietnam teams: junior developers' ideas must genuinely compete with senior engineers' ideas; women developers must have equal access to high-visibility projects; introverts must have structured mechanisms to contribute without verbal domination.\n\nAcross global MNC teams: Vietnamese team members in Hanoi must have equivalent influence in product decisions as colleagues in Paris or Montreal. Remote members must not default to out-group status. Decisions made 'with' the global team rather than 'for' local teams.\n\nPsychological safety application: measure it explicitly. Edmondson's 7-item scale takes 5 minutes. Low scores require specific diagnostic work: What are people afraid to say? What has happened in the past when people raised concerns? The answers usually point to specific leadership behaviors that need to change.`,
strengths:["Directly tied to innovation performance — the competitive case is compelling","Increasingly required for global MNC team effectiveness","Psychological safety framework is among the most replicable findings in organizational research"],
weaknesses:["Requires sustained behavioral change over time — awareness training alone is insufficient","Can conflict with speed and hierarchical norms in Vietnamese organizations","Measuring inclusion quality requires assessment tools beyond headcount metrics"],
tips:["In every meeting: notice who speaks and who doesn't — create entry points for quiet voices","Structure pre-meeting contribution: shared docs, written input — reduces verbal dominance","Measure psychological safety explicitly with Edmondson's 7-item scale","For global teams: rotate meeting times — don't always advantage the same time zones"],
sources:[
{group:"Foundational Theory",items:[
{t:"Inclusion and the Work Group: An Exploration of Theoretical Perspectives (2011)",a:"Shore, Randel, Chung, Dean, Holcombe-Ehrhart & Singh, Journal of Management",n:"Introduced belonging × uniqueness framework — the most widely cited definition of inclusion in leadership research."},
{t:"Psychological Safety and Learning Behavior in Work Teams (1999)",a:"Amy Edmondson, Administrative Science Quarterly",n:"Landmark study establishing psychological safety as the team mechanism for learning and innovation."}
]},
{group:"Diversity & Inclusion Context",items:[
{t:"Managing Diversity: A Strategic Imperative (1991)",a:"Cox & Blake, The Academy of Management Executive",n:"Built the business case for diversity management; showed diversity creates competitive advantage when managed effectively."},
{t:"The Inclusion Challenge: With/In (2014)",a:"Ferdman (Ed.)",n:"Comprehensive treatment of inclusion in organizations; argues structural change is required, not just individual behavior."},
{t:"Diversity and Inclusion in Organizations (2017)",a:"Chrobot-Mason & Roberson, Annual Review of Organizational Psychology",n:"Current state review by the chapter's authors."}
]}
]
},
{id:13,num:"Ch 13",title:"Followership",
tagline:"You cannot understand leadership without understanding followership. Followers actively co-create the leadership relationship — and most of your career is spent following, not leading.",
overview:`<p><strong>The Neglected Half of Leadership.</strong> Despite being the counterpart to leadership, followership has received remarkably little systematic research attention until recently. Early work by Follett (1949) and Zaleznik (1965) raised follower importance, but it wasn't until Kelley (1988), Meindl (1990), and Chaleff (1995) that followership research gained momentum. Three books transformed the field: The Art of Followership (Riggio, Chaleff & Lipman-Blumen, 2008), Followership: How Followers Are Creating Change and Changing Leaders (Kellerman, 2008), and Followership: What Is It and Why Do People Follow? (Lapierre & Carsten, 2014).</p>
<p><strong>Defining Followership.</strong> Followership is a process whereby an individual accepts the influence of others to accomplish a common goal. It involves a power differential (followers defer to leaders) and has an ethical dimension — following is not morally neutral. Followership has two broad perspectives: Role-based (what roles and behaviors followers exhibit in hierarchical systems) and Relational-based (followership as co-constructed through leader-follower communication — social constructivist view).</p>
<p><strong>Kelley's Follower Typology (1988).</strong> Based on two dimensions — Independent Thinking (passive to active) and Engagement (passive to active) — Kelley identified five follower types: (1) Passive/Sheep followers: low independent thinking, low engagement; do what they're told, require constant supervision; (2) Conformist/Yes-People: active engagement, low independent thinking; willing workers who execute without critical assessment; (3) Alienated followers: high independent thinking, low engagement; cynical, hold back effort, mentally "checked out"; (4) Pragmatic Survivors: middle range on both dimensions; organizational survivors who stay under the radar; (5) Exemplary/Star followers: high independent thinking AND high active engagement — the most valuable follower type; they think critically, take initiative, and actively support the leader.</p>
<p><strong>Chaleff's Courageous Follower Model (1995, 2009).</strong> Ira Chaleff proposed that the best followers are "courageous" — they both support AND constructively challenge their leaders. Five dimensions of courageous followership: Courage to Assume Responsibility (followers accept responsibility for their own performance and the organization's outcomes), Courage to Serve (serve the leader and organization with energy and dedication), Courage to Challenge (willing to respectfully but clearly challenge the leader when behavior or actions seem misguided), Courage to Participate in Transformation (support leader and organization through difficult changes), Courage to Take Moral Action (take appropriate action when leader behaviors cross ethical lines).</p>
<p><strong>Uhl-Bien et al.'s Followership Theory (2014).</strong> The first formal theoretical framework for followership. Identifies two types: Constructive followership (proactively contributes to positive organizational outcomes), Destructive followership (through either passivity that enables bad leadership or active opposition that derails good leadership). The theory emphasizes that followership is a co-constructed process — followers shape leaders as much as leaders shape followers. Studies of destructive leadership show that most "bad leadership" requires follower complicity or passivity to sustain.</p>
<p><strong>Destructive Followership and Bad Leadership.</strong> Kellerman (2008) analyzed how followers contribute to destructive leadership. She identifies a spectrum from bystanders (do nothing, allow bad leadership to continue) to participants (actively support bad leadership) to diehards (will do anything for the leader). Research on authoritarian regimes, corporate scandals, and cult dynamics consistently shows that destructive leadership is enabled — even co-created — by follower patterns. Developing moral courage and exemplary followership is as important as developing ethical leadership.</p>`,
concepts:[{l:"Kelley's 5 Types",v:"Passive, Conformist, Alienated, Pragmatic Survivor, Exemplary — on 2 dimensions"},{l:"Two Dimensions",v:"Independent Thinking × Engagement Level"},{l:"Exemplary Follower",v:"High independent thinking + high active engagement — most valuable type"},{l:"Chaleff's Courageous Followership",v:"Both support AND challenge — 5 courage dimensions"},{l:"Uhl-Bien et al. (2014)",v:"First formal theory; constructive vs. destructive followership; co-construction framing"},{l:"Destructive Followership",v:"Kellerman: bad leadership requires follower complicity or passivity to sustain"}],
vn:`This chapter directly challenges the Vietnamese default of pure followership — 'cấp dưới chấp hành' (subordinates comply). In game development, conformist followers are a liability: they ship features that don't serve players because no one pushed back on the design. They never raise the quality concern that would prevent a costly post-launch fix.\n\nAs a middle manager in an MNC like Gameloft, you simultaneously play BOTH roles: leader to your direct reports AND follower to HQ leadership and global product stakeholders. Developing courageous followership — the Chaleff model's 'courage to challenge' — is a career-defining skill. Western and French HQ managers trust and respect Vietnamese leaders MORE when they demonstrate independent, evidence-based pushback. 'I have data that might affect this decision' is not insubordination — it's exemplary followership.\n\nThe destructive followership insight has a practical implication for leaders: if your team defaults to conformist following, ask why. What has happened when people spoke up in the past? The answer usually reveals a psychological safety gap that the leader created — often unintentionally.`,
strengths:["Rebalances the leadership-centric field — followers have agency and responsibility","Courageous follower model is immediately practical and actionable","Destructive followership research illuminates organizational failures often attributed solely to 'bad leadership'"],
weaknesses:["Significantly under-researched compared to leadership — many propositions lack empirical validation","Cultural variation in what 'good followership' means complicates cross-cultural application","Can be uncomfortable or career-risky to practice in high power-distance organizations"],

{id:14,num:"Ch 14",title:"Gender and Leadership",
tagline:"Women face a leadership labyrinth — compounding systemic barriers across their entire career, not a single glass ceiling near the top.",
overview:`<p><strong>From Glass Ceiling to Leadership Labyrinth.</strong> The "glass ceiling" metaphor (introduced by Hymowitz & Schellhardt in the Wall Street Journal, 1986) described an invisible barrier preventing women from ascending to elite positions. Eagly and Carli (2007) reframed this as a "leadership labyrinth" — a more accurate metaphor conveying that women face obstacles at every career stage, not just near the top. The pipeline is full of women; it is leaking consistently throughout. Women earn 57% of bachelor's, 60% of master's, and 53% of doctoral degrees in the US, yet represent only 5.8% of S&P 500 CEOs and 21.2% of board seats.</p>
<p><strong>Three Explanations for the Labyrinth.</strong> Research identifies three categories of barriers: (1) Human Capital Differences — the argument that women have less education, experience, or training. Data consistently contradict this: women are equally or better educated, but take on disproportionate family responsibilities (Eagly & Carli, 2004, 2007). The COVID-19 pandemic sharply accelerated this gap as women disproportionately reduced workforce participation to manage caregiving. (2) Gender Differences in Leadership Style — some research shows women lead differently (more transformational, participative, collaborative) while men lead more transactionally and autocratically (Eagly & Johnson, 1990). Meta-analyses show women's transformational style is actually associated with higher effectiveness. (3) Prejudice and Bias — Eagly and Karau's (2002) Role Congruity Theory identifies the double bind: social expectations for women (communal: warm, nurturing, collaborative) directly conflict with expectations for leaders (agentic: assertive, decisive, dominant). Women who are assertive violate gender norms; women who are warm are seen as weak leaders. This double bind produces biased evaluation regardless of actual performance.</p>
<p><strong>Role Congruity Theory (Eagly & Karau, 2002).</strong> This is the most theoretically sophisticated explanation for women's underrepresentation. Two forms of prejudice: Descriptive prejudice (expectations about what women are like — communal) and Prescriptive prejudice (expectations about what women should be like). When a woman behaves agentically (as leaders are expected to), she violates prescriptive gender norms and faces backlash. The double bind makes women "damned if they do, damned if they don't."</p>
<p><strong>Mentoring, Sponsorship, and Networking.</strong> Mentors provide advice and guidance; sponsors actively use their organizational power to advocate for their protégés' advancement. Research consistently shows women receive more mentoring but less sponsorship than men (Hewlett et al., 2010). Sponsorship — not mentoring — drives promotion and advancement to senior roles. Additionally, women's professional networks tend to be smaller and less connected to power structures, limiting access to high-visibility opportunities and informal advocacy.</p>
<p><strong>Structural Interventions.</strong> Research-supported structural solutions: transparent promotion criteria (reduces subjective bias), formal sponsorship programs (creates institutional sponsorship obligations), paid parental leave with equal access for all genders (reduces career penalty for childbirth), flexible work arrangements (reduces career penalty for caregiving), and leadership accountability metrics for equity (makes progress visible and measurable). Sandberg's (2013) "Lean In" focused on women's individual behavior — this approach has been critiqued as placing systemic responsibility on individuals rather than institutions.</p>`,
concepts:[{l:"Leadership Labyrinth",v:"Eagly & Carli (2007): barriers at every career stage, not just near the top"},{l:"Role Congruity Theory",v:"Eagly & Karau (2002): communal expectations for women conflict with agentic expectations for leaders"},{l:"Double Bind",v:"Assertive women violate gender norms; warm women violate leader norms — no winning strategy"},{l:"Women's Leadership Style",v:"Meta-analyses show women more transformational and participative — associated with higher effectiveness"},{l:"Mentoring vs. Sponsoring",v:"Sponsors use power to advocate — this, not mentoring, drives senior promotion"},{l:"Pipeline Problem",v:"Pipeline is full of women; it is leaking systematically throughout career stages"}],
vn:`Vietnam's tech sector has a specific paradox: relatively high female participation in engineering education but significant underrepresentation in senior tech leadership. In game development, this compounds — gaming culture globally skews male, affecting hiring, team culture, and who gets tapped for leadership opportunities.\n\nFor a Vietnamese male tech leader in an MNC, this has direct, practical relevance to your talent management. Role congruity bias is culturally amplified in Vietnamese workplaces — assertive female engineers may face double judgment (violating both leadership expectations AND Vietnamese gender norms simultaneously). Knowing this bias exists is the first step to interrupting it in promotion and assignment decisions.\n\nThe mentoring vs. sponsoring distinction is immediately actionable: find 1-2 high-potential female engineers on your team and actively advocate for them in assignments, in talent reviews, in conversations with HQ leadership. That's sponsorship. It costs you nothing except attention and advocacy — but it creates outcomes that mentoring conversations never can.`,
strengths:["Addresses real systemic inequality with robust research backing across decades","Role Congruity Theory provides precise theoretical account of why bias persists","Women's transformational style is empirically superior — business case for advancement is clear"],
weaknesses:["Research predominantly US/Western-centric — cross-cultural data is less robust","Binary gender framing doesn't fully address non-binary/LGBTQ+ spectrum","Individual-behavior focused solutions (Lean In) place systemic responsibility on individuals"],
tips:["Audit project assignments by gender — are high-visibility opportunities equally distributed?","Transition from mentor to sponsor for at least one high-potential female team member","Examine promotion criteria: are they measuring results and capability or confidence and assertiveness?","In MNC contexts, align with global gender equity commitments and track/report local progress"],
sources:[
{group:"Core Theory",items:[
{t:"Through the Labyrinth: The Truth About How Women Become Leaders (2007)",a:"Eagly & Carli",n:"Most comprehensive treatment of the leadership labyrinth; reviews all major explanations with meta-analytic evidence."},
{t:"Role Congruity Theory of Prejudice Toward Female Leaders (2002)",a:"Eagly & Karau, Psychological Review",n:"Foundational theory explaining why leadership bias against women persists despite changing attitudes."}
]},
{group:"Leadership Style Research",items:[
{t:"Gender and Leadership Style: A Meta-Analysis (1990)",a:"Eagly & Johnson, Psychological Bulletin",n:"162-study meta-analysis finding women more democratic/participative; men more autocratic/directive."},
{t:"Transformational, Transactional, and Laissez-Faire Leadership Styles: A Meta-Analysis (2003)",a:"Eagly, Johannesen-Schmidt & van Engen, Psychological Bulletin",n:"Found women significantly more transformational — associated with higher effectiveness ratings."}
]},
{group:"Sponsorship Research",items:[
{t:"The Sponsor Effect: Breaking Through the Last Glass Ceiling (2010)",a:"Hewlett, Jackson & Sherbin, Harvard Business Review Research Report",n:"Identified sponsorship (vs. mentoring) as the key mechanism for women's senior advancement."}
]}
]

{id:15,num:"Ch 15",title:"Leadership Ethics",
tagline:"Ethical leadership is not about compliance — it is about virtue, purpose, and the courage to act rightly when it costs something.",
overview:`<p><strong>Ethics in Leadership — The Underdeveloped Field.</strong> Despite centuries of interest in ethical conduct, very little systematic theory on leadership ethics existed before 1996. The Kellogg Foundation convened a group of leadership scholars who produced Ethics, the Heart of Leadership (Ciulla, 1998) — one of the first systematic treatments. Interest accelerated after major corporate scandals (Enron, WorldCom, Tyco) and political failures in the early 2000s. Brown, Treviño, and Harrison's (2005) social learning model of ethical leadership — describing leaders as moral managers and moral persons — provided the most widely used empirical framework.</p>
<p><strong>Kohlberg's Stages of Moral Development.</strong> Lawrence Kohlberg (1984) provided the most widely used theory of how people reason about moral decisions. Three levels, six stages: Preconventional Morality (Stage 1: Obedience & Punishment — avoid harm to oneself; Stage 2: Individualism & Exchange — self-interest, transactional fairness); Conventional Morality (Stage 3: Interpersonal Accord — conform to social expectations, be 'nice'; Stage 4: Social Order — follow laws, maintain institutional order); Postconventional Morality (Stage 5: Social Contract — rights and democratic processes; Stage 6: Universal Principles — act on internalized universal justice principles regardless of law or convention). Most adults operate at stages 3-4. Leaders in complex organizations need to operate at stages 5-6 to make principled decisions under institutional pressure.</p>
<p><strong>Ethical Theories Applied to Leadership.</strong> Four major traditions: (1) Teleological / Consequentialism — the rightness of an action is determined by its consequences. Greatest good for the greatest number (Utilitarianism — Mill). Leaders using this framework ask: "What outcome will maximize the good?" Risk: justifies harmful means for good ends. (2) Deontological Ethics — actions are right or wrong in themselves, regardless of consequences (Kant's Categorical Imperative: "Act only according to that maxim whereby you can at the same time will that it should become a universal law"). Leaders ask: "Is this the right thing to do regardless of outcome?" (3) Virtue Ethics — focuses on the moral character of the person rather than rules or consequences (Aristotle). The central question is: "What kind of person do I want to be?" Virtues: honesty, courage, justice, temperance, compassion. (4) Altruism — places others' welfare at the center of ethical decision-making. Contrasted with ethical egoism — the view that self-interest is a legitimate ethical foundation.</p>
<p><strong>Burns' Ethical Dimension of Transforming Leadership.</strong> Burns (1978) argued that authentic transformational leadership is inherently ethical because it raises the morality of both leaders and followers. The ethical leader: has a strong sense of purpose, demonstrates value for others, is honest and straightforward, builds trust, shares power, and acts as a moral compass for the organization. Leaders who lack this ethical dimension may be transforming (changing things) but they are not transformational in the full moral sense Burns intended.</p>
<p><strong>The Leader's Unique Ethical Obligations.</strong> Leadership creates power asymmetry, which generates unique ethical responsibilities. Ciulla (2014) argues leaders have special ethical obligations because: their decisions affect many people who did not consent to those decisions, they hold power others do not have, and followers often trust and are influenced by them in ways that require special care. Northouse identifies 5 principles of ethical leadership: respect (treat others as ends in themselves), service (place followers' welfare first), justice (treat all followers fairly and consistently), honesty (do not deceive, inform fully), community (promote community and mutual benefit over self-interest).</p>`,
concepts:[{l:"Kohlberg's 6 Stages",v:"Preconventional (1-2) → Conventional (3-4) → Postconventional (5-6) moral reasoning"},{l:"Consequentialism / Utilitarianism",v:"Rightness = outcomes; greatest good for greatest number"},{l:"Deontological Ethics",v:"Rightness = duties/rules regardless of consequences; Kant's categorical imperative"},{l:"Virtue Ethics",v:"Rightness = character; 'What kind of person do I want to be?' — Aristotle"},{l:"5 Ethical Leader Principles",v:"Respect, Service, Justice, Honesty, Community (Northouse)"},{l:"Burns' Ethical Dimension",v:"Authentic transformational leadership inherently raises the morality of leader and follower"}],
vn:`Ethics in Vietnamese business gets complicated by cultural obligation structures (nể nang — being soft on people you know), hierarchical compliance norms, and the pragmatic navigation of organizational politics. For a leader in a global MNC, additional layers apply: global compliance requirements, anti-corruption standards (FCPA, UK Bribery Act), and accountability to international stakeholders with different ethical frameworks.\n\nA concrete ethical scenario relevant to game development: discovering a monetization mechanic that's technically legal but exploits vulnerable players (children's impulsive spending, gambling psychology). Consequentialist analysis: what revenue vs. reputational risk? Deontological analysis: is this treating players as ends in themselves or as means to revenue? Virtue analysis: is this the studio you want to be? The Kohlberg stage 5-6 leader escalates this concern even when it's organizationally uncomfortable — and frames it as a risk management conversation to HQ.\n\nBuilding an ethical team culture requires psychological safety for ethical challenge. If the first time someone raised an ethics concern they were dismissed or punished, no one else will raise one. The leader's response to the first ethical challenge is the most powerful cultural signal they will ever send.`,
strengths:["Multiple frameworks provide rich toolkit for genuinely complex decisions","Integrates ethics into leadership identity, not just policy compliance","Burns' ethical dimension grounds transformational leadership in moral purpose"],
weaknesses:["Ethical frameworks often conflict — consequentialism vs. deontology in hard cases","Cultural relativity creates genuine complexity in applying 'universal' principles","Field remains theoretically underdeveloped relative to its importance"],
tips:["Develop a 1-page personal ethics statement — what are your non-negotiables as a leader?","Apply multiple frameworks to hard decisions — don't just use the one that confirms your preference","Create genuine psychological safety for ethics challenges: respond with curiosity, not defensiveness","In MNC contexts: know both local cultural norms AND global ethics standards — articulate where they diverge"],
sources:[
{group:"Foundational Theory",items:[
{t:"Ethics, the Heart of Leadership (1998)",a:"Ciulla (Ed.)",n:"First systematic academic treatment of leadership ethics; output of the Kellogg Foundation scholars' working group."},
{t:"Ethical Leadership: A Social Learning Perspective (2005)",a:"Brown, Treviño & Harrison, Organizational Behavior and Human Decision Processes",n:"Most widely cited empirical leadership ethics paper; moral manager × moral person framework."}
]},
{group:"Moral Development",items:[
{t:"Essays on Moral Development, Vol. 2: The Psychology of Moral Development (1984)",a:"Lawrence Kohlberg",n:"Definitive statement of 6-stage moral development theory; foundational to leadership ethics."},
{t:"Leadership Ethics: An Introduction (2018, 3rd ed.)",a:"Terry Price",n:"Philosophical treatment of leadership ethics; examines why leaders rationalize unethical behavior."}
]},
{group:"Applied Ethics",items:[
{t:"Meeting the Ethical Challenges of Leadership (2018, 6th ed.)",a:"Craig Johnson",n:"Comprehensive applied leadership ethics text; covers shadow side of leadership and multiple ethical frameworks."}
]}
]
},
{id:16,num:"Ch 16",title:"Team Leadership",
tagline:"Effective team leadership means monitoring team effectiveness continuously and taking precisely the right actions — internally and externally — when and only when needed.",
overview:`<p><strong>Why Teams Matter.</strong> Teams are the fundamental unit of modern organization, particularly in knowledge-intensive industries. Reliance on teams has grown due to: increasingly complex tasks that exceed individual capacity, globalization requiring coordination across geography, and flattening of organizational hierarchies (Porter & Beyerlein, 2000). Work teams are defined by: interdependence (members depend on each other), shared goals, coordination requirements, and collective accountability. Effective teams consistently produce: greater productivity, better resource use, better decisions, higher quality outputs, and greater innovation (Parker, 1990).</p>
<p><strong>Hill's Team Leadership Model.</strong> Susan Hill's (2008) model is the chapter's primary framework. It identifies leadership as a process of monitoring team functioning and taking precise action when needed. The leader's first decision: Should I intervene, or is the team functioning adequately without intervention? The second decision: Is the issue internal (within the team) or external (in the team's environment)? Internal team leadership actions divide into task (goals, structure, decisions, training, standards), relational (trust, collaboration, conflict management, modeling, satisfaction), and process domains. External leadership actions include environmental scanning (monitoring threats and opportunities), networking (building relationships with key stakeholders), advocating (lobbying for team resources and protection), and negotiating (securing resources from the external environment on behalf of the team).</p>
<p><strong>Team Excellence Criteria.</strong> Hackman (2002) and LaFasto and Larson (2001) identified characteristics of high-performing teams that inform the diagnostic framework: Clear, elevating goal (members know and care about the team's purpose), Results-driven structure (appropriate for the team's task), Competent members (right skills and knowledge), Unified commitment (shared dedication to the team's mission), Collaborative climate (support, trust, mutual accountability), Standards of excellence (commitment to quality), External support and recognition (organizational resources and rewards), Principled leadership (builds trust, creates a collaborative climate, leads by example, manages performance).</p>
<p><strong>Virtual and Distributed Teams.</strong> The chapter explicitly addresses virtual teams — particularly relevant post-COVID. Research from the Center for Creative Leadership (Leslie & Hoole, 2018) found three key success factors: (1) Technology — use video conferencing and collaboration tools to create face-to-face-like connection quality; (2) Managing distance — equitably distribute the burden of timezone accommodation; avoid always disadvantaging the same team members; (3) Team structure — ensure committed members, clarify roles and norms explicitly at formation. Breuer et al. (2016) found trust is more critical for virtual teams than face-to-face teams — and more difficult to establish. Invest disproportionately in early trust-building.</p>
<p><strong>Shared and Distributed Leadership.</strong> Modern team research increasingly recognizes that effective teams distribute leadership functions across members rather than centering all leadership in a formal leader. Shared leadership (Pearce & Conger, 2003) involves team members leading each other laterally — particularly valuable for complex, creative, knowledge-intensive work. The formal leader's role evolves toward creating the conditions for shared leadership: selecting appropriate team members, structuring the work, building norms of mutual accountability, and managing external relationships.</p>
<p><strong>Psychologically Safe Teams.</strong> Edmondson's (2012) research on teaming — the dynamic activity of leading and following in teams — shows that team learning (essential for innovation and adaptation) requires psychological safety. Teams that feel safe to take interpersonal risks — raising difficult questions, admitting mistakes, challenging assumptions — consistently outperform those that don't on complex tasks. Team leaders create psychological safety through demonstrated curiosity, non-punitive responses to mistakes, and modeling vulnerability.</p>`,
concepts:[{l:"Hill's Model Core Decision",v:"Monitor → Intervene? → Internal or External? → Task, Relational, or Process?"},{l:"Internal Task Actions",v:"Goal focus, role clarity, decision systems, training, standards"},{l:"Internal Relational Actions",v:"Trust-building, collaboration, conflict management, modeling, satisfaction"},{l:"External Actions",v:"Environmental scanning, networking, advocating, negotiating for resources"},{l:"Team Excellence Factors",v:"Clear goal, right structure, competent members, unified commitment, collaborative climate, standards, support, principled leadership"},{l:"Virtual Teams",v:"Trust more critical, harder to build; technology, distance management, and structure are key success factors"}],
vn:`Game development teams are the perfect stress test for Hill's model. A Gameloft mobile title is made by 50-150+ people across design, art, programming, QA, product, analytics — multiple disciplines, often multiple geographies (Vietnam, France, Philippines), under intense deadline and quality pressure.\n\nA Vietnamese Studio Head must simultaneously work internally (ensure cross-discipline team has clear goals and psychological safety, resolve endemic conflicts between design vision and engineering constraints, maintain standards under crunch) AND externally (advocate with Paris HQ for adequate budget, shield the team from scope creep mid-sprint, scan the competitive market for threats like competing title launches, network with global studio leads for technical knowledge).\n\nThe model's critical insight: neglecting external leadership — spending all time on internal team management — is as dangerous as neglecting internal work. The team needs its leader fighting for them externally (resources, recognition, protection from organizational turbulence) as much as they need facilitation internally. Many Vietnamese tech leaders are excellent internal leaders but underinvest in external advocacy.`,
strengths:["Most comprehensive team leadership framework — covers internal AND external dimensions","Explicitly addresses virtual teams — essential for global MNC distributed work","Shared leadership model fits modern Agile and cross-functional squad structures"],
weaknesses:["Complex diagnostic model is difficult to apply in real-time fast-moving situations","Less specific guidance on team composition, selection, and onboarding","Virtual team research continues to rapidly evolve with new technology"],
tips:["Assess your team quarterly against team excellence criteria — which are genuinely weakest?","Ensure 25-30% of leadership time is external: stakeholder management, advocacy, scanning","For virtual teams: invest disproportionately in the first 60 days of team formation for trust and norms","Run quarterly team health checks on BOTH task effectiveness AND relational climate — not just delivery metrics"],
sources:[
{group:"Team Leadership Models",items:[
{t:"Team Leadership (2008, in P. Northouse Ed.)",a:"Susan Hill",n:"The Team Leadership Model — primary framework in this chapter; monitoring and intervention decision model."},
{t:"Leading Teams: Setting the Stage for Great Performances (2002)",a:"J. Richard Hackman",n:"Definitive empirical treatment of team performance conditions; identified 5 essential enabling conditions."}
]},
{group:"Team Excellence & Virtual Teams",items:[
{t:"When Teams Work Best (2001)",a:"LaFasto & Larson",n:"Research-based identification of team excellence factors from 6,000+ team members."},
{t:"Teaming: How Organizations Learn, Innovate, and Compete (2012)",a:"Amy Edmondson",n:"Dynamic teaming framework; psychological safety as the mechanism for team learning and adaptation."},
{t:"Trust in Virtual Teams: A Meta-Analysis (2016)",a:"Breuer, Hüffmeier & Hertel, Journal of Applied Psychology",n:"Meta-analysis confirming trust is more critical in virtual than face-to-face teams."}
]},
{group:"Shared Leadership",items:[
{t:"Shared Leadership: Reframing the Hows and Whys of Leadership (2003)",a:"Pearce & Conger (Eds.)",n:"Comprehensive treatment of distributed leadership in teams; reframes leadership as a collective rather than individual property."}
]}
]
}
];

let currentCh=1;

function renderSidebar(){
  document.getElementById('sidebar').innerHTML=CH.map(c=>`
    <div class="sidebar-item ${currentCh===c.id?'active':''}" onclick="showChapter(${c.id})">
      <div class="ch-num">${c.num}</div>${c.title}
    </div>`).join('');
}

function showChapter(id){
  currentCh=id;
  document.getElementById('searchInput').value='';
  renderSidebar();
  const c=CH.find(x=>x.id===id);
  const mc=document.getElementById('mainContent');
  mc.innerHTML=`
<div>
  <div class="chapter-header">
    <div class="badge">${c.num} of 16</div>
    <h2>${c.title}</h2>
    <div class="tagline">${c.tagline}</div>
  </div>
  <div class="tabs" id="tabs-${id}">
    <div class="tab active" onclick="switchTab(${id},'overview',this)">Overview</div>
    <div class="tab" onclick="switchTab(${id},'vn',this)">🇻🇳 VN Context</div>
    <div class="tab" onclick="switchTab(${id},'apply',this)">Apply It</div>
    <div class="tab" onclick="switchTab(${id},'sources',this)">Key Sources</div>
  </div>
  <div id="tc-${id}-overview" class="tab-content active">
    <div class="section">${c.overview}</div>
    <div class="divider"></div>
    <div class="section">
      <h3>Key Concepts</h3>
      <div class="key-concepts">${c.concepts.map(k=>`<div class="concept-card"><div class="label">${k.l}</div><div class="value">${k.v}</div></div>`).join('')}</div>
    </div>
    <div class="section">
      <h3>Strengths &amp; Limitations</h3>
      <div class="sw-grid">
        <div class="sw-card s"><h4>Strengths</h4><ul>${c.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div>
        <div class="sw-card w"><h4>Limitations</h4><ul>${c.weaknesses.map(s=>`<li>${s}</li>`).join('')}</ul></div>
      </div>
    </div>
  </div>
  <div id="tc-${id}-vn" class="tab-content">
    <div class="vn-example">
      <div class="vn-ex-label">VIETNAMESE TECH LEADER CONTEXT — Gameloft / MNC</div>
      ${c.vn.split('\n\n').map(p=>`<p>${p.replace(/\n/g,' ')}</p>`).join('')}
    </div>
  </div>
  <div id="tc-${id}-apply" class="tab-content">
    <div class="section">
      <h3>Practical Applications</h3>
      <ol class="tip-list">${c.tips.map(t=>`<li>${t}</li>`).join('')}</ol>
    </div>
  </div>
  <div id="tc-${id}-sources" class="tab-content">
    <div class="sources-section">
      ${c.sources.map(g=>`
        <div class="source-group">
          <div class="source-group-label">${g.group}</div>
          ${g.items.map(s=>`
            <div class="source-item">
              <div class="src-title">${s.t}</div>
              <div class="src-author">${s.a}</div>
              <div class="src-note">${s.n}</div>
            </div>`).join('')}
        </div>`).join('')}
    </div>
  </div>
</div>`;
  mc.scrollTop=0;
}

function switchTab(id,name,el){
  document.getElementById('tabs-'+id).querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  ['overview','vn','apply','sources'].forEach(n=>{
    const e=document.getElementById(`tc-${id}-${n}`);
    if(e) e.classList[n===name?'add':'remove']('active');
  });
}

function doSearch(q){
  if(!q.trim()){showChapter(currentCh);return;}
  const ql=q.toLowerCase();
  const results=CH.filter(c=>{
    const allText=[c.title,c.tagline,c.overview,c.vn,...c.concepts.map(k=>k.l+' '+k.v),...c.tips,...c.sources.flatMap(g=>g.items.map(s=>s.t+' '+s.a+' '+s.n))].join(' ');
    return allText.toLowerCase().includes(ql);
  });
  const mc=document.getElementById('mainContent');
  if(!results.length){
    mc.innerHTML=`<div class="no-results">No results for "<strong>${q}</strong>" — try different keywords.</div>`;
    return;
  }
  mc.innerHTML=`<div class="search-results">
    <div style="font-size:13px;color:#888;margin-bottom:14px">${results.length} result${results.length>1?'s':''} for "<strong>${q}</strong>"</div>
    ${results.map(c=>{
      const texts=[c.tagline,c.overview,...c.concepts.map(k=>k.v),...c.tips,c.vn];
      const matchText=texts.find(t=>t.toLowerCase().includes(ql))||c.overview;
      const idx=matchText.toLowerCase().indexOf(ql);
      const plain=matchText.replace(/<[^>]*>/g,'');
      const pidx=plain.toLowerCase().indexOf(ql);
      const excerpt=pidx>-1?'…'+plain.substring(Math.max(0,pidx-50),Math.min(plain.length,pidx+130))+'…':plain.substring(0,170)+'…';
      const safeQ=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const highlighted=excerpt.replace(new RegExp(safeQ,'gi'),m=>`<span class="highlight">${m}</span>`);
      return `<div class="result-item" onclick="showChapter(${c.id})"><h4>${c.num}: ${c.title}</h4><p>${highlighted}</p></div>`;
    }).join('')}
  </div>`;
}

renderSidebar();
showChapter(1);
</script>
