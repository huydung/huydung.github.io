    ["Calendar year, e.g. 2026",2,"A trap. Years have equal intervals and an arbitrary origin, so differences are meaningful and ratios are not. Year 2000 is not twice year 1000."],
    ["Reaction time in milliseconds",3,"Ratio: absolute zero, ratios meaningful. One of the few genuinely ratio-scaled variables in behavioural work."]];
  const names=["Nominal","Ordinal","Interval","Ratio"];
  n.innerHTML=`<h3>Classify the scale type</h3>
   <div class="labhint">Three of these are traps that appear in real dashboards. Choose before you read the feedback.</div>
   <div id="sq"></div><div class="readout"><div class="ro"><div class="k">Correct</div><div class="v" id="scr">0 / 8</div></div></div>`;
  $('#sq').innerHTML=items.map((it,ii)=>`<div class="q" data-i="${ii}"><div class="qt">${it[0]}</div>
    <div class="row">${names.map((nm,k)=>`<button class="btn sm" data-k="${k}">${nm}</button>`).join('')}</div>
    <div class="why" style="display:none">${it[2]}</div></div>`).join('');
  let sc=0,ansd=0;
  $('#sq').onclick=e=>{
    const b=e.target.closest('button[data-k]'); if(!b)return;
    const q=b.closest('.q'),ii=+q.dataset.i,k=+b.dataset.k,ok=items[ii][1];
    q.querySelectorAll('button').forEach(x=>x.disabled=true);
    q.querySelectorAll('button')[ok].style.borderColor='var(--ok)';
    q.querySelectorAll('button')[ok].style.background='#f2f8ef';
    if(k!==ok){b.style.borderColor='var(--red-bright)';b.style.textDecoration='line-through'}else sc++;
    ansd++;q.querySelector('.why').style.display='block';
    $('#scr').textContent=sc+' / 8';
  };
};

/* --- 2. cancellation axioms --- */
LABS.cancel=(n)=>{
  const A=[[1,2,3],[4,5,6],[7,8,9]];
  const B=[[1,2,6],[3,5,7],[4,8,9]];
  let cur='B';
  n.innerHTML=`<h3>Test the cancellation axioms</h3>
   <div class="labhint">Rows are levels of attribute A (a1&lt;a2&lt;a3). Columns are levels of attribute P (p1&lt;p2&lt;p3).
   Cells give the <b>rank order</b> of the joint outcome only — 1 is lowest, 9 is highest. No interval information is used anywhere.
   One matrix admits an additive representation. The other does not. Work it out by hand first.</div>
   <div class="row" style="margin-bottom:12px">
     <button class="btn sm" id="mA">Matrix A</button><button class="btn sm solid" id="mB">Matrix B</button></div>
   <div id="mtx"></div>
   <div class="row"><button class="btn sm" id="c1">Check single cancellation</button>
     <button class="btn sm" id="c2">Check double cancellation</button></div>
   <div id="cv"></div>`;
  const draw=(hi)=>{
    const M=cur==='A'?A:B;
    const H=hi||[];
    $('#mtx').innerHTML=`<table class="mx"><tr><th></th><th>p1</th><th>p2</th><th>p3</th></tr>`+
    M.map((r,i)=>`<tr><th>a${i+1}</th>`+r.map((v,j)=>
      `<td class="${H.some(x=>x[0]===i&&x[1]===j)?'hi':''}">${v}</td>`).join('')+`</tr>`).join('')+`</table>`;
  };
  const verdict=(cls,txt)=>$('#cv').innerHTML=`<div class="verdict ${cls}">${txt}</div>`;
  const pick=(k)=>{cur=k;$('#mA').className='btn sm'+(k==='A'?' solid':'');$('#mB').className='btn sm'+(k==='B'?' solid':'');draw();$('#cv').innerHTML=''};
  $('#mA').onclick=()=>pick('A'); $('#mB').onclick=()=>pick('B');
  $('#c1').onclick=()=>{
    const M=cur==='A'?A:B;let bad=null;
    for(let i=0;i<3;i++)for(let j=0;j<2;j++) if(M[i][j]>=M[i][j+1]) bad=[[i,j],[i,j+1]];
    for(let j=0;j<3;j++)for(let i=0;i<2;i++) if(M[i][j]>=M[i+1][j]) bad=[[i,j],[i+1,j]];
    if(bad){draw(bad);verdict('bad','Single cancellation fails. The ordering across one attribute reverses at some level of the other, so independence does not hold.');}
    else{draw();verdict('good','Single cancellation holds. Every row increases left to right and every column increases top to bottom, so the two attributes act independently on the outcome.');}
  };
  $('#c2').onclick=()=>{
    const M=cur==='A'?A:B;
    const p1=M[1][0]>M[0][1], p2=M[2][1]>M[1][2], concl=M[2][0]>M[0][2];
    const hi=[[1,0],[0,1],[2,1],[1,2],[2,0],[0,2]];
    if(p1&&p2&&!concl){draw(hi);
      verdict('bad',`Double cancellation is violated. (a2,p1)=${M[1][0]} &gt; (a1,p2)=${M[0][1]} and (a3,p2)=${M[2][1]} &gt; (a2,p3)=${M[1][2]},
      so an additive representation requires (a3,p1) &gt; (a1,p3). But ${M[2][0]} &lt; ${M[0][2]}.
      The trade-offs are inconsistent, so no additive representation exists — established from rank order alone, with no assumption of interval scaling.`);}
    else if(p1&&p2&&concl){draw(hi);
      verdict('good',`Double cancellation holds here: ${M[1][0]}&gt;${M[0][1]} and ${M[2][1]}&gt;${M[1][2]}, and the required ${M[2][0]}&gt;${M[0][2]} is satisfied. Consistent with additivity so far.`);}
    else{draw(hi);verdict('good','The premises of double cancellation are not both satisfied in this matrix, so the axiom imposes no constraint here. Nothing is violated, and nothing is confirmed.');}
  };
  pick('B');
};

/* --- 3. ordinal sign reversal --- */
LABS.reversal=(n)=>{
  n.innerHTML=`<h3>Make the mean lie</h3>
   <div class="labhint">Two groups have a continuous latent attribute. A 5-point item collapses it through four thresholds.
   Move the sliders until the group with the <b>higher latent mean</b> shows the <b>lower observed mean</b>.</div>
   ${slider('t1','Lowest threshold',-3,1,0.1,-2.5,v=>(+v).toFixed(1))}
   ${slider('gp','Gap between thresholds',0.2,1.5,0.1,0.3,v=>(+v).toFixed(1))}
   ${slider('mA','Group A latent mean',-1,2,0.1,0,v=>(+v).toFixed(1))}
   ${slider('sA','Group A latent SD',0.5,4,0.1,1,v=>(+v).toFixed(1))}
   ${slider('mB','Group B latent mean',-1,2,0.1,0.3,v=>(+v).toFixed(1))}
   ${slider('sB','Group B latent SD',0.5,4,0.1,4,v=>(+v).toFixed(1))}
   <div class="row" style="margin:10px 0"><button class="btn sm" id="pre">Load a reversal</button></div>
   <div class="row" style="align-items:flex-start;gap:26px">
     <div style="flex:1"><div class="blab">Group A responses 1→5</div><div class="bars" id="bA"></div></div>
     <div style="flex:1"><div class="blab">Group B responses 1→5</div><div class="bars" id="bB"></div></div></div>
   <div class="readout">
     <div class="ro"><div class="k">Latent B − A</div><div class="v" id="ld">–</div></div>
     <div class="ro"><div class="k">Observed B − A</div><div class="v" id="od">–</div></div>
     <div class="ro"><div class="k">A observed mean</div><div class="v" id="oa">–</div></div>
     <div class="ro"><div class="k">B observed mean</div><div class="v" id="ob">–</div></div></div>
   <div id="rv"></div>`;
  const ids=['t1','gp','mA','sA','mB','sB'];
  const upd=()=>{
    const g={};ids.forEach(k=>{g[k]=+$('#'+k).value;$('#'+k+'o').textContent=g[k].toFixed(1)});
    const th=[0,1,2,3].map(i=>g.t1+i*g.gp);
    const pA=catProbs(g.mA,g.sA,th), pB=catProbs(g.mB,g.sB,th);
    const oA=omean(pA), oB=omean(pB), ld=g.mB-g.mA, od=oB-oA;
    $('#bA').innerHTML=bars(pA); $('#bB').innerHTML=bars(pB,'b2');
    $('#ld').textContent=(ld>0?'+':'')+ld.toFixed(2);
    $('#od').textContent=(od>0?'+':'')+od.toFixed(2);
    $('#oa').textContent=oA.toFixed(2); $('#ob').textContent=oB.toFixed(2);
    let v='';
    if(Math.abs(ld)>0.05&&Math.sign(ld)!==Math.sign(od)&&Math.abs(od)>0.05)
      v=`<div class="verdict bad"><b>Sign reversal.</b> Group B's latent mean is ${ld>0?'higher':'lower'} by ${Math.abs(ld).toFixed(2)},
        yet its observed mean is ${od>0?'higher':'lower'} by ${Math.abs(od).toFixed(2)}. A t-test on these responses returns a confident answer in the wrong direction. More respondents would only sharpen it.</div>`;
    else if(Math.abs(ld)<0.05&&Math.abs(od)>0.1)
      v=`<div class="verdict bad"><b>Gap from nothing.</b> The latent means are equal, and the observed means differ by ${Math.abs(od).toFixed(2)} because the groups differ in spread.</div>`;
    else if(Math.abs(od)<Math.abs(ld)*0.5&&Math.abs(ld)>0.2)
      v=`<div class="verdict bad"><b>Compression.</b> A latent difference of ${ld.toFixed(2)} shows up as only ${od.toFixed(2)} — the effect size is understated, not just noisy.</div>`;
    else v=`<div class="verdict good">Direction preserved here. Now raise one group's SD and push the thresholds toward a floor or ceiling.</div>`;
    $('#rv').innerHTML=v;
  };
  ids.forEach(k=>$('#'+k).oninput=upd);
  $('#pre').onclick=()=>{const v={t1:-2.5,gp:0.3,mA:0,sA:1,mB:0.3,sB:4};ids.forEach(k=>$('#'+k).value=v[k]);upd()};
  upd();
};

/* --- 4. alpha inflation --- */
LABS.alpha=(n)=>{
  n.innerHTML=`<h3>How high can alpha go on nothing?</h3>
   <div class="labhint">Alpha is a function of item count and average inter-item correlation, nothing else.
   Switch on two orthogonal factors to see a scale that measures two different things and still reports respectably.</div>
   ${slider('k','Number of items',3,60,1,10)}
   ${slider('r','Correlation between items',0.02,0.7,0.01,0.15,v=>(+v).toFixed(2))}
   <div class="row" style="margin:8px 0 4px">
     <button class="btn sm" id="tf">Two orthogonal factors: off</button>
     <button class="btn sm" id="p1">Junk preset</button></div>
   <div class="readout">
     <div class="ro"><div class="k">Cronbach's alpha</div><div class="v" id="al">–</div></div>
     <div class="ro"><div class="k">Average inter-item r</div><div class="v" id="rb">–</div></div>
     <div class="ro"><div class="k">Shared variance per pair</div><div class="v" id="sv2">–</div></div></div>
   <div id="av"></div>`;
  let two=false;
  const upd=()=>{
    const k=+$('#k').value, r=+$('#r').value;
    $('#ko').textContent=k; $('#ro').textContent=r.toFixed(2);
    let rbar=r, note='';
    if(two){ const h=Math.floor(k/2); const pairs=k*(k-1)/2; const within=h*(h-1)/2+(k-h)*(k-h-1)/2;
      rbar=r*within/pairs; note=`Items split into two uncorrelated halves. Within a half the correlation is ${r.toFixed(2)}; across halves it is zero.`; }
    const a=k*rbar/(1+(k-1)*rbar);
    $('#al').textContent=a.toFixed(3); $('#rb').textContent=rbar.toFixed(3);
    $('#sv2').textContent=(rbar*rbar*100).toFixed(1)+'%';
    let v;
    if(two&&a>=0.7) v=`<div class="verdict bad"><b>Alpha ${a.toFixed(2)} on a two-dimensional scale.</b> ${note}
      Alpha passes every conventional threshold while the scale measures two unrelated things. This is why alpha is not evidence of unidimensionality.</div>`;
    else if(a>=0.8&&rbar<0.2) v=`<div class="verdict bad"><b>Alpha ${a.toFixed(2)} from items sharing ${(rbar*rbar*100).toFixed(1)}% of their variance.</b>
      Item count is doing the work, not item quality. Most journals would print this without comment.</div>`;
    else if(a>=0.9) v=`<div class="verdict bad"><b>Alpha ${a.toFixed(2)}.</b> With an average correlation of ${rbar.toFixed(2)} the items are near-paraphrases.
      Reliability rose, the construct narrowed — the attenuation paradox.</div>`;
    else v=`<div class="verdict good">Alpha ${a.toFixed(2)}. Now hold the correlation still and drag the item count upward.</div>`;
    $('#av').innerHTML=v;
  };
  $('#k').oninput=upd; $('#r').oninput=upd;
  $('#tf').onclick=()=>{two=!two;$('#tf').textContent='Two orthogonal factors: '+(two?'on':'off');$('#tf').className='btn sm'+(two?' solid':'');upd()};
  $('#p1').onclick=()=>{$('#k').value=40;$('#r').value=0.12;upd()};
  upd();
};

/* --- 5. ICC playground --- */
LABS.icc=(n)=>{
  n.innerHTML=`<h3>Item characteristic curves, and where invariance breaks</h3>
   <div class="labhint">Two items. Give them equal difficulty and different discrimination, then find the ability at which the curves cross.
   Above the crossing the items rank one way; below it, the other way.</div>
   ${slider('a1','Item 1 discrimination a',0.2,3,0.1,1,v=>(+v).toFixed(1))}
   ${slider('b1','Item 1 difficulty b',-3,3,0.1,0,v=>(+v).toFixed(1))}
   ${slider('a2','Item 2 discrimination a',0.2,3,0.1,1,v=>(+v).toFixed(1))}
   ${slider('b2','Item 2 difficulty b',-3,3,0.1,1,v=>(+v).toFixed(1))}
   ${slider('cg','Guessing c (both items)',0,0.4,0.01,0,v=>(+v).toFixed(2))}
   <canvas id="cv2" width="700" height="300"></canvas>
   <div id="iv"></div>`;
  const ids=['a1','b1','a2','b2','cg'];
  const P=(th,a,b,c)=>c+(1-c)/(1+Math.exp(-a*(th-b)));
  const upd=()=>{
    const g={};ids.forEach(k=>{g[k]=+$('#'+k).value;$('#'+k+'o').textContent=g[k].toFixed(k==='cg'?2:1)});
    const cv=$('#cv2'),x=cv.getContext('2d'),W=700,H=300,L=44,R=14,T=12,B=30;
    x.clearRect(0,0,W,H);
    const px=t=>L+(t+4)/8*(W-L-R), py=p=>H-B-p*(H-T-B);
    x.strokeStyle='#e8e8e8';x.lineWidth=1;x.font='11px sans-serif';x.fillStyle='#4a4a4a';
    [0,0.25,0.5,0.75,1].forEach(p=>{x.beginPath();x.moveTo(L,py(p));x.lineTo(W-R,py(p));x.stroke();
      x.fillText(p.toFixed(2),8,py(p)+4)});
    [-4,-2,0,2,4].forEach(t=>{x.beginPath();x.moveTo(px(t),T);x.lineTo(px(t),H-B);x.stroke();
      x.fillText(t,px(t)-4,H-10)});
    x.fillText('ability θ',W-70,H-10);
    const curve=(a,b,col)=>{x.beginPath();x.strokeStyle=col;x.lineWidth=2.5;
      for(let i=0;i<=280;i++){const t=-4+8*i/280,p=P(t,a,b,g.cg);i?x.lineTo(px(t),py(p)):x.moveTo(px(t),py(p))}x.stroke();};
    curve(g.a1,g.b1,'#8e011f'); curve(g.a2,g.b2,'#bd0129');
    x.fillStyle='#8e011f';x.fillText('item 1',L+8,T+14);x.fillStyle='#bd0129';x.fillText('item 2',L+58,T+14);
    let cross=null;let prev=P(-4,g.a1,g.b1,g.cg)-P(-4,g.a2,g.b2,g.cg);
    for(let i=1;i<=800;i++){const t=-4+8*i/800,d=P(t,g.a1,g.b1,g.cg)-P(t,g.a2,g.b2,g.cg);
      if(prev*d<0&&Math.abs(d)<0.5){cross=t;break} prev=d;}
    if(cross!==null&&Math.abs(g.a1-g.a2)>0.05){
      x.strokeStyle='#4a4a4a';x.setLineDash([4,4]);x.beginPath();x.moveTo(px(cross),T);x.lineTo(px(cross),H-B);x.stroke();x.setLineDash([]);
      $('#iv').innerHTML=`<div class="verdict bad"><b>The curves cross at θ = ${cross.toFixed(2)}.</b>
        Which item is harder depends on who is answering, so item comparisons are no longer invariant across persons.
        This is exactly what the Rasch model gives up when discriminations are allowed to differ, and what it protects when they are held equal.</div>`;
    } else if(Math.abs(g.a1-g.a2)<=0.05){
      $('#iv').innerHTML=`<div class="verdict good"><b>Equal discriminations: Rasch conditions.</b> The curves never cross, so item difficulty order is the same for every person and person order is the same for every item. That is specific objectivity.</div>`;
    } else $('#iv').innerHTML=`<div class="verdict good">Discriminations differ, but the crossing falls outside the plotted ability range. Move the difficulties closer together.</div>`;
  };
  ids.forEach(k=>$('#'+k).oninput=upd); upd();
};

/* --- 6. invariance --- */
LABS.invar=(n)=>{
  n.innerHTML=`<h3>A gap that is not there</h3>
   <div class="labhint">Two studios with the <b>same</b> latent engagement. Only their response thresholds differ —
   one group avoids the extreme categories, or reads "agree" as a stronger claim. Watch the observed gap appear.</div>
   ${slider('mu','Latent mean, both groups',-1,1,0.1,0,v=>(+v).toFixed(1))}
   ${slider('sh','Threshold shift, studio B',-1.5,1.5,0.1,0.6,v=>(+v).toFixed(1))}
   ${slider('sq','Threshold squeeze, studio B',0.4,1.8,0.1,1,v=>(+v).toFixed(1))}
   <div class="row" style="align-items:flex-start;gap:26px;margin-top:12px">
     <div style="flex:1"><div class="blab">Studio A responses 1→5</div><div class="bars" id="iA"></div></div>
     <div style="flex:1"><div class="blab">Studio B responses 1→5</div><div class="bars" id="iB"></div></div></div>
   <div class="readout">
     <div class="ro"><div class="k">True difference</div><div class="v">0.00</div></div>
     <div class="ro"><div class="k">Reported gap</div><div class="v" id="gp2">–</div></div>
     <div class="ro"><div class="k">A mean</div><div class="v" id="ma">–</div></div>
     <div class="ro"><div class="k">B mean</div><div class="v" id="mb">–</div></div></div>
   <div id="nv"></div>`;
  const ids=['mu','sh','sq'];
  const upd=()=>{
    const g={};ids.forEach(k=>{g[k]=+$('#'+k).value;$('#'+k+'o').textContent=g[k].toFixed(1)});
    const tA=[-1.5,-0.5,0.5,1.5];
    const tB=tA.map(t=>t*g.sq+g.sh);
    const pA=catProbs(g.mu,1,tA), pB=catProbs(g.mu,1,tB);
    const oA=omean(pA),oB=omean(pB),d=oB-oA;
    $('#iA').innerHTML=bars(pA);$('#iB').innerHTML=bars(pB,'b2');
    $('#ma').textContent=oA.toFixed(2);$('#mb').textContent=oB.toFixed(2);
    $('#gp2').textContent=(d>0?'+':'')+d.toFixed(2);
    $('#nv').innerHTML=Math.abs(d)>0.1
      ? `<div class="verdict bad"><b>A reported gap of ${d.toFixed(2)} points from an attribute difference of exactly zero.</b>
         Scalar invariance fails, so the gap is a fact about the response scale, not about engagement.
         On a 1–5 item this is the size of gap that triggers action plans and quarterly reviews.</div>`
      : `<div class="verdict good">Thresholds are close enough that the reported gap is small. This is the condition scalar invariance testing is designed to check — and it is rarely checked.</div>`;
  };
  ids.forEach(k=>$('#'+k).oninput=upd); upd();
};

/* ================= flashcards ================= */
function deck(){
  const d=[];
  S.forEach((s,i)=>s.cards.forEach((c,j)=>{
    const id=i+':'+j;
    if(ST.done[i]||ST.box[id]) d.push({id,f:c[0],b:c[1],box:ST.box[id]||1,si:i});
  }));
  return d.sort((a,b)=>a.box-b.box||Math.random()-0.5);
}
function cards(){
  let d=deck(),k=0,shown=false;
  if(!d.length){
    $('#pane').innerHTML=`<div class="ptop"><span class="eyebrow">Review</span><h1>No cards yet</h1></div>
    <p>Cards unlock as you mark sessions done. Finish Session 01 and come back.</p>
    <button class="btn solid" id="bk">Back to Session 01</button>`;
    $('#bk').onclick=()=>go(0);return;
  }
  const render=()=>{
    if(k>=d.length){
      $('#pane').innerHTML=`<div class="ptop"><span class="eyebrow">Review</span><h1>Deck finished</h1>
        <div class="meta">${d.length} cards reviewed. Cards you missed come back in box 1.</div></div>
        <div class="row"><button class="btn solid" id="ag">Review again</button>
        <button class="btn" id="bk">Back to sessions</button></div>`;
      $('#ag').onclick=cards; $('#bk').onclick=()=>go(ST.last);return;
    }
    const c=d[k];
    $('#pane').innerHTML=`<div class="ptop"><span class="eyebrow">Review · card ${k+1} of ${d.length} · box ${c.box}</span>
      <h1>Recall</h1><div class="meta">From session ${String(c.si+1).padStart(2,'0')} · ${S[c.si].t}</div></div>
      <div class="card"><div class="f">${c.f}</div>
        <div class="b" id="bk2" style="display:${shown?'block':'none'}">${c.b}</div></div>
      <div class="row" style="margin-top:16px">
        ${shown?`<button class="btn" id="ag">Again</button><button class="btn solid" id="ok">Got it</button>`
                :`<button class="btn solid" id="sh">Show answer</button>`}
        <button class="btn" id="ex" style="margin-left:auto">Exit review</button></div>`;
    $('#ex').onclick=()=>go(ST.last);
    if(shown){
      $('#ag').onclick=()=>{ST.box[c.id]=1;save();shown=false;k++;render()};
      $('#ok').onclick=()=>{ST.box[c.id]=Math.min(4,c.box+1);save();shown=false;k++;render()};
    } else $('#sh').onclick=()=>{shown=true;render()};
  };
  render();
}

/* ================= backup ================= */
function backup(){
  $('#pane').innerHTML=`<div class="ptop"><span class="eyebrow">Backup</span><h1>Save or restore progress</h1>
    <div class="meta">Progress is stored automatically. Copy this text somewhere safe if you want a hard backup, or paste an old backup in and restore.</div></div>
    <textarea id="js" style="min-height:200px;font-size:12.5px">${JSON.stringify(ST)}</textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="cp">Copy</button>
      <button class="btn" id="rs">Restore from this text</button>
      <button class="btn" id="bk" style="margin-left:auto">Back to sessions</button></div><div id="msg"></div>`;
  $('#cp').onclick=()=>{$('#js').select();document.execCommand('copy');$('#msg').innerHTML='<div class="verdict good">Copied.</div>'};
  $('#rs').onclick=()=>{try{ST=Object.assign({done:{},notes:{},ans:{},box:{},last:0},JSON.parse($('#js').value));save();chrome();rail();
    $('#msg').innerHTML='<div class="verdict good">Restored.</div>'}catch(e){$('#msg').innerHTML='<div class="verdict bad">That is not valid backup text.</div>'}};
  $('#bk').onclick=()=>go(ST.last);
}

/* ================= boot ================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t)go(+t.dataset.go)});
$('#btnCards').onclick=cards;
$('#btnData').onclick=backup;
(async()=>{await load();chrome();rail();view(ST.last||0);})();
</script>
