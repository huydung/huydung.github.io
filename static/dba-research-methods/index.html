  @media (min-width: 900px)  { .card-grid { grid-template-columns: repeat(3, 1fr); } }

/* Markdown → HTML (simple inline, for desc blocks) */
function md(text) {
  if (!text) return "";
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#fff">$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code style="background:rgba(255,255,255,.07);padding:2px 6px;border-radius:4px;font-size:.88em;color:#ccc">$1</code>')
    .replace(/\n\n/g, '</p><p style="margin-top:.6em">')
    .replace(/\n/g, '<br>');
}

/* Rich markdown → HTML (for modal body: paragraphs, bullets, bold, etc.) */
function richMd(text) {
  if (!text) return "";
  const lines = text.split('\n');
  let html = '';
  let inUl = false, inOl = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    // Inline formatting
    line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    line = line.replace(/\*(.+?)\*/g, '<em>$1</em>');
    line = line.replace(/`(.+?)`/g, '<code>$1</code>');

    // ### Subheading
    if (line.match(/^### /)) {
      if (inUl) { html += '</ul>'; inUl = false; }
      if (inOl) { html += '</ol>'; inOl = false; }
      html += '<h3>' + line.slice(4) + '</h3>';
      continue;
    }

    // Unordered list
    if (line.match(/^[-*] /)) {
      if (!inUl) { html += '<ul>'; inUl = true; }
      html += '<li>' + line.slice(2) + '</li>';
      continue;
    }

    // Numbered list
    if (line.match(/^\d+\.\s/)) {
      if (!inOl) { html += '<ol>'; inOl = true; }
      html += '<li>' + line.replace(/^\d+\.\s/, '') + '</li>';
      continue;
    }

    // Close lists if we hit a non-list line
    if (inUl) { html += '</ul>'; inUl = false; }
    if (inOl) { html += '</ol>'; inOl = false; }

    // Empty line = paragraph break
    if (line.trim() === '') {
      continue;
    }

    // Regular paragraph
    html += '<p>' + line + '</p>';
  }

  if (inUl) html += '</ul>';
  if (inOl) html += '</ol>';
  return html;
}

function parseMd(raw) {
  const lines = raw.split('\n');
  let intro=[], sections=[], current=null, pastTitle=false;
  for (const line of lines) {
    if (!pastTitle && line.startsWith('# ') && !line.startsWith('## ')) { pastTitle=true; continue; }
    pastTitle=true;
    if (line.startsWith('## ')) {
      if (current) sections.push(current);
      current = { title: line.slice(3).trim(), body: [] };
    } else if (current) { current.body.push(line); }
    else { intro.push(line); }
  }
  if (current) sections.push(current);
  return { intro: intro.join('\n').trim(), sections: sections.map(s=>({title:s.title, body:s.body.join('\n').trim()})) };
}

function parseDesc(raw) {
  const lines = raw.split('\n'), out=[]; let past=false;
  for (const l of lines) { if(!past&&l.startsWith('# ')){past=true;continue;} past=true; out.push(l); }
  return out.join('\n').trim();
}

const contentCache = {};
async function fetchContent(id) {
  if (contentCache[id]) return contentCache[id];
  const path = CONTENT_MAP[id];
  if (!path) return null;
  try { const r=await fetch(path); if(!r.ok) return null; const t=await r.text(); contentCache[id]=t; return t; } catch { return null; }
}

  const bg = isQ ? "linear-gradient(135deg,rgba(91,175,214,.06),rgba(91,175,214,.015))"
    : isL ? "linear-gradient(135deg,rgba(80,184,122,.06),rgba(80,184,122,.015))"
    : `linear-gradient(135deg,${color}0a,${color}03)`;

  return <button className="nav-card" onClick={onClick} style={{
    border:`1px solid ${border}`, borderRadius:16, padding:0, cursor:'pointer',
    textAlign:'left', fontFamily:'inherit', background:bg,
    animation:`cardPop .3s ease ${index*.04}s both`, minHeight:80,
    display:'flex', alignItems:'stretch', width:'100%',
  }}>
    <div style={{display:'flex',alignItems:'center',gap:14,padding:'18px 22px',width:'100%'}}>
      <div style={{fontSize:30,flexShrink:0,width:44,textAlign:'center',color}}>{child.icon||"◆"}</div>
      <div style={{flex:1}}>
        <div style={{fontSize:'1.05rem',fontWeight:600,lineHeight:1.35,
          color:isQ?"#8ad4f8":isL?"#7ee8b0":"#fff"}}>{child.label}</div>
        {hasKids && <div style={{fontSize:'.8rem',color:'rgba(255,255,255,.35)',marginTop:3}}>
          {child.children.length} subtopics</div>}
        {child.leaf && <div style={{fontSize:'.8rem',color:'rgba(255,255,255,.35)',marginTop:3}}>
          tap to explore</div>}
      </div>
      <div style={{fontSize:'.85rem',color:'rgba(255,255,255,.25)',flexShrink:0}}>→</div>
    </div>
  </button>;
}

/* Sub-card (leaf ## section — title-only, click opens modal) */
function SubCard({title, color, index, onClick}) {
  return <div className="sub-card" onClick={onClick} style={{
    border:`1px solid ${color}25`, borderRadius:14, padding:'16px 20px',
    background:`linear-gradient(145deg,${color}06,${color}02)`,
    animation:`cardPop .3s ease ${index*.025}s both`,
    display:'flex', alignItems:'center', gap:10,
  }}>
    <div style={{width:7,height:7,borderRadius:'50%',background:color,opacity:.6,flexShrink:0}} />
    <div style={{fontSize:'1rem',fontWeight:600,color:'#fff',lineHeight:1.35,flex:1}}>{title}</div>
    <div style={{fontSize:'.8rem',color:'rgba(255,255,255,.2)',flexShrink:0}}>↗</div>
  </div>;
}

/* Modal popup for sub-card content */
function Modal({title, body, color, onClose}) {
  const overlayRef = useRef(null);

  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', handler); document.body.style.overflow = ''; };
  }, [onClose]);

  return <div className="modal-overlay" ref={overlayRef}
    onClick={(e) => { if (e.target === overlayRef.current) onClose(); }}>
    <div className="modal-box">
      {/* Header */}
      <div style={{
        position:'sticky', top:0, zIndex:1,
        background:'linear-gradient(180deg,#13151e 80%,transparent)',
        padding:'24px 28px 16px', display:'flex', alignItems:'flex-start', gap:12,
      }}>
        <div style={{width:10,height:10,borderRadius:'50%',background:color,opacity:.7,flexShrink:0,marginTop:7}} />
        <div style={{fontSize:'1.25rem',fontWeight:700,color:'#fff',lineHeight:1.35,flex:1}}>{title}</div>
        <button onClick={onClose} style={{
          background:'rgba(255,255,255,.08)',border:'none',color:'rgba(255,255,255,.5)',
          width:32,height:32,borderRadius:8,cursor:'pointer',fontSize:16,flexShrink:0,
          display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit',
          transition:'.15s',
        }}>✕</button>
      </div>
      {/* Body */}
      <div className="rich-md" style={{padding:'0 28px 28px'}}
        dangerouslySetInnerHTML={{__html: richMd(body)}} />
    </div>
  </div>;
}

/* ─── MAIN APP ─── */
function App() {
  const [currentId, setCurrentId] = useState("root");
  const [animDir, setAnimDir] = useState("in");
  const [animKey, setAnimKey] = useState(0);
  const [descContent, setDescContent] = useState(null);
  const [leafContent, setLeafContent] = useState(null);
  const [loading, setLoading] = useState(false);
  const [modal, setModal] = useState(null); // {title, body, color}

  const nav = useCallback((id, dir="in") => {
    setAnimDir(dir); setAnimKey(k=>k+1); setCurrentId(id);
    setDescContent(null); setLeafContent(null); setModal(null);
    window.scrollTo({top:0,behavior:'smooth'});
  }, []);

  useEffect(() => {
    const node = findNode(currentId);
    if (!node || currentId==="root") return;
    const hasChildren = node.children && node.children.length>0;
    const isLeaf = node.leaf===true;
    setLoading(true);
    if (hasChildren) {
      fetchContent(currentId).then(raw => { if(raw) setDescContent(parseDesc(raw)); setLoading(false); });
    } else if (isLeaf) {
      fetchContent(currentId).then(raw => { if(raw) setLeafContent(parseMd(raw)); setLoading(false); });
    } else { setLoading(false); }
  }, [currentId]);

  const node = findNode(currentId);
  const path = buildPath(currentId)||[DATA];
  const isRoot = currentId==="root";
  const hasChildren = node && node.children && node.children.length>0;
  const isLeaf = node && node.leaf===true;
  const color = getColor(currentId);

  return <div style={{maxWidth:1100,margin:'0 auto',padding:'0 20px 60px'}}>

    {/* ─── Breadcrumb ─── */}
    <div style={{display:'flex',alignItems:'center',gap:3,padding:'14px 0',flexWrap:'wrap',
      borderBottom:'1px solid rgba(255,255,255,.06)',marginBottom:8}}>
      {path.map((p,i) => <span key={p.id} style={{display:'flex',alignItems:'center',gap:4}}>
        {i>0 && <span style={{color:'rgba(255,255,255,.18)',fontSize:14,margin:'0 2px'}}>›</span>}
        <button onClick={()=>i<path.length-1 && nav(p.id,"out")} style={{
          background:'none',border:'none',fontFamily:'inherit',fontSize:14,padding:'3px 5px',borderRadius:5,
          color:i===path.length-1?'#fff':'rgba(255,255,255,.45)',
          cursor:i<path.length-1?'pointer':'default',
          fontWeight:i===path.length-1?700:400,
          transition:'.15s',
        }}>{p.id==="root"?"🏠":(p.icon||"")+" "+p.label}</button>
      </span>)}
    </div>

    {/* ─── Title ─── */}
    {!isRoot && <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 0 12px'}}>
      <button onClick={()=>{
        const parent=path.length>=2?path[path.length-2]:DATA; nav(parent.id,"out");
      }} style={{
        background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.1)',
        color:'rgba(255,255,255,.65)',fontFamily:'inherit',fontSize:14,padding:'8px 18px',
        borderRadius:22,cursor:'pointer',transition:'.15s',flexShrink:0,
      }}>← Back</button>
      <div style={{fontSize:'1.5rem',fontWeight:700,textAlign:'center',color,letterSpacing:-.3,flex:1}}>
        {node?.icon && <span style={{marginRight:10}}>{node.icon}</span>}{node?.label}
      </div>
      <div style={{width:80}} />
    </div>}

    {isRoot && <div style={{textAlign:'center',padding:'36px 0 16px'}}>
      <div style={{fontSize:'2.2rem',fontWeight:700,letterSpacing:-.5,
        background:'linear-gradient(135deg,#f59e42,#e05a8a,#7c6df0,#3daadb,#50b87a)',
        WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>DBA Knowledge Map</div>
      <div style={{fontSize:15,color:'rgba(255,255,255,.4)',marginTop:6}}>10 unified sections · Click to explore</div>
      <div style={{display:'flex',justifyContent:'center',gap:20,marginTop:12,fontSize:12,color:'rgba(255,255,255,.35)'}}>
        <span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:9,height:9,borderRadius:'50%',background:'#fff'}}/> Shared</span>
        <span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:9,height:9,borderRadius:'50%',background:'#5bafd6'}}/> ⚡ Quant</span>
        <span style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:9,height:9,borderRadius:'50%',background:'#50b87a'}}/> 🌿 Qual</span>
      </div>
    </div>}

    {/* ─── Content ─── */}
    <div key={animKey} style={{animation:`${animDir==="in"?"slideIn":"slideOut"} .28s ease`,marginTop:8}}>

      {loading && <LoadingDots />}

      {/* Description for mid-level */}
      {!loading && hasChildren && descContent && <DescBlock text={descContent} color={color} />}

      {/* Child nav-cards */}
      {hasChildren && <div className="card-grid">
        {node.children.map((child,i) =>
          <NavCard key={child.id} child={child} color={child.color||getColor(child.id)} index={i}
            onClick={()=>nav(child.id,"in")} />
        )}
      </div>}

      {/* Leaf content — intro + title-only sub-cards in grid */}
      {!loading && isLeaf && leafContent && <div>
        {leafContent.intro && <DescBlock text={leafContent.intro} color={color} />}
        <div className="subcard-grid">
          {leafContent.sections.map((sec,i) =>
            <SubCard key={i} title={sec.title} color={color} index={i}
              onClick={() => setModal({title:sec.title, body:sec.body, color})} />
          )}
        </div>
      </div>}

      {!loading && isLeaf && !leafContent && <div style={{
        padding:30,color:'rgba(255,255,255,.35)',fontSize:15,textAlign:'center',
      }}>Content not available. Run <code style={{background:'rgba(255,255,255,.07)',padding:'3px 8px',borderRadius:5}}>python serve.py</code> to load content files.</div>}
    </div>

    {/* Modal */}
    {modal && <Modal title={modal.title} body={modal.body} color={modal.color}
      onClose={() => setModal(null)} />}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
