{id:"q1q1",emoji:"🔍",label:"Qual Q1: Criteria (20m)",group:"part1qual",marks:"20",
direct:`${cq('"What are the criteria for doing a qualitative study? Under what conditions would you instead suggest a mixed method or quantitative method?" — 20 marks, at least 200 words, provide relevant examples.')}

<h2>Criteria for Choosing Qualitative Methods</h2>
<p>Qualitative research is the appropriate choice when several key criteria about the nature of the research problem, the state of existing knowledge, and the goals of the inquiry are met.</p>

<p>The first criterion is that <b>the phenomenon is not well understood and requires exploration</b>. When a topic has limited prior research or no established theoretical framework, qualitative methods allow the researcher to discover patterns, generate insights, and build understanding from the ground up rather than testing pre-defined variables. For example, when studying psychological safety in Vietnamese technology teams — a topic with extensive Western research but very limited investigation in Southeast Asian contexts — a qualitative approach is appropriate because the researcher does not yet know which cultural factors (face-saving norms, hierarchical dynamics, collectivist values) are most relevant or how they interact with the Western construct of psychological safety.</p>

<p>The second criterion is that <b>the research question asks "how" or "why" rather than "how much"</b>. Qualitative research is designed to understand processes, experiences, perceptions, and meaning-making from the participants' own perspectives. For instance, "How do Vietnamese software developers experience psychological safety differently in multinational versus local studios?" is a qualitative question because it seeks to understand lived experience and contextual meaning, not to measure or quantify a relationship.</p>

<p>The third criterion is that <b>rich, contextual depth is needed</b>. When the topic involves complex social interactions, cultural dynamics, or subjective experiences that cannot be adequately captured through standardized survey instruments, qualitative methods — such as interviews, focus groups, and observation — provide the depth required. A researcher studying how face-saving culture creates different public versus private expressions of psychological safety (as I found in my DBA802 study, Theme 7) could not have discovered this nuance through a Likert-scale survey.</p>

<p>The fourth criterion is that <b>the key variables are not yet well-defined</b>. When it is unclear which constructs matter or how to measure them, qualitative inquiry helps identify and define the relevant variables before they can be operationalized for quantitative measurement. The fifth criterion is that <b>small, purposive samples are appropriate</b> — the research prioritizes depth over breadth. The sixth criterion is that <b>context is essential</b> — the phenomenon is shaped by its specific social, cultural, or organizational setting.</p>

<h2>When to Suggest Quantitative Methods Instead</h2>
<p>Quantitative methods should be recommended when the research conditions are essentially the opposite of the qualitative criteria above. Specifically, quantitative methods are appropriate when the variables are already well-defined with validated measurement instruments, when the goal is to test specific pre-defined hypotheses rather than explore, when statistically generalizable results from a large representative sample are needed, and when the research question asks "how much" or "what is the relationship between X and Y." For example, when studying the relationship between Power Distance, Psychological Safety, and Job Performance among Vietnamese technology professionals — where all three constructs have validated Likert-scale instruments — a quantitative approach using PLS-SEM is appropriate because the goal is to test hypothesized relationships across a larger sample (as I did with 146 respondents in my DBA801 study).</p>

<h2>When to Suggest Mixed Methods Instead</h2>
<p>Mixed methods are recommended when neither qualitative nor quantitative methods alone can provide a complete picture of the research problem. This occurs when quantitative data can show WHAT relationships exist but qualitative data is needed to explain WHY and HOW those relationships operate. Mixed methods are also appropriate when the researcher wants to validate findings from one paradigm with the other, or when developing a new measurement instrument (qualitative exploration first to discover constructs, then quantitative testing to validate at scale). For example, an explanatory sequential mixed methods design would be ideal for the Globex Corporation case: Phase 1 uses a quantitative survey to measure the statistical relationship between ESG certification and investor confidence, then Phase 2 uses qualitative interviews with investors to explore why they weight third-party certification so heavily in their decision-making — providing both the statistical evidence and the explanatory narrative that Globex's board needs.</p>`,
deep:`
<h2>Trustworthiness Criteria for Evaluating Qualitative Quality</h2>
<p>While the question focuses on when to choose qualitative methods, it is also valuable to know how to evaluate the quality of a qualitative study once undertaken. Lincoln and Guba's trustworthiness criteria are the gold standard:</p>
${bb("Credibility (≈ Internal Validity)","Findings are believable. Achieved via triangulation, member checking, prolonged engagement, peer debriefing.")}
${bb("Transferability (≈ Generalizability)","Findings apply to other contexts. Achieved via thick description enabling readers to judge applicability.")}
${bb("Dependability (≈ Reliability)","Findings are consistent over time. Achieved via audit trails documenting all decisions.")}
${bb("Confirmability (≈ Objectivity)","Findings are free from bias. Achieved via reflexivity and transparent documentation.")}
${tbl(["Qualitative","Quantitative"],[["Credibility","Internal Validity"],["Transferability","Generalizability"],["Dependability","Reliability"],["Confirmability","Objectivity"]])}
<h2>Five Components of Robust Qualitative Design</h2>
<p>Research Question, Propositions, Boundedness (sample & setting), Logic Model (linking data to propositions), and Rival Explanations.</p>
<h2>Mixed Methods Designs</h2>
${bb("Convergent Parallel","Qual + quant simultaneously, compare side-by-side.")}
${bb("Explanatory Sequential","Quant first → qual to explain. Use when constructs are well-established.")}
${bb("Exploratory Sequential","Qual first → quant to test. Use when phenomenon is novel.")}
${bb("Embedded","One method nested within the other.")}
${bb("Transformative","Social justice framework.")}
${bb("Multiphase","Three+ phases.")}
${tip("The question asks for examples — always illustrate each criterion with a concrete research scenario. Using your own DBA projects (psychological safety, Gameloft, Vietnamese tech) makes examples authentic and memorable.")}`},

{id:"q1q2",emoji:"💡",label:"Qual Q2: Propositions (15m)",group:"part1qual",marks:"15",
direct:`${cq('"Should one ALWAYS have propositions/hypotheses for a qualitative study? Explain with an example." — 15 marks, at least 150 words, provide relevant examples.')}
<p><b>Not always — but in most cases, yes.</b> The key word in this question is "always." While propositions are valuable and recommended for the majority of qualitative research designs, there are legitimate methodological approaches where propositions are intentionally omitted. The answer depends on the researcher's relationship to theory and the study's epistemological orientation.</p>

<h2>What Propositions Are and Why They Usually Matter</h2>
<p>A <b>proposition</b> in qualitative research is a conditional if-then statement that provides flexible, theory-informed direction for data collection and analysis. Unlike quantitative hypotheses — which are fixed before data collection and tested statistically — propositions can evolve as new data emerges and are assessed through thematic analysis, pattern matching, and explanation building. Propositions are one of the five essential components of research design (alongside the research question, boundedness, logic model, and rival explanations). They connect the study to existing theory, provide analytical focus, and help organize findings systematically through a Table of Propositions — while still preserving the openness to discover unexpected patterns.</p>

<h2>Worked Example: When Propositions ARE Used</h2>
<p>In my DBA802 qualitative study on psychological safety in Vietnamese technology professionals, I developed three propositions grounded in the existing literature before beginning data collection. Proposition 1 stated: "If a technology professional perceives a strong dyadic relationship with their direct supervisor, then they will attribute their sense of psychological safety primarily to that supervisory relationship." This proposition guided my interview protocol — I included specific questions about supervisor dynamics — and focused my initial coding around relational themes. During analysis, Proposition 1 was <b>supported</b> by Theme 1 in my findings: participants consistently described their direct manager as the single most influential factor in their willingness to speak up. However, Theme 3 — individual maturity and personality as moderators of PS perception — was entirely <b>emergent</b>, not predicted by any proposition. I discovered that more experienced developers reported higher psychological safety regardless of their supervisor relationship, a finding that would not have surfaced in a purely deductive study. This demonstrates the dual value of propositions: they provide focus and theoretical grounding while still allowing the flexibility to discover unexpected patterns.</p>

<h2>When Propositions Are NOT Required</h2>
<p>A qualitative study can legitimately proceed without propositions in specific methodological traditions. In a <b>pure grounded theory</b> approach (sometimes called tabula rasa), the researcher intentionally begins with no preconceived theoretical framework, allowing all theory to emerge inductively from the data through iterative coding and constant comparison. The philosophical rationale is that preconceived propositions could bias the researcher's perception and constrain their ability to see what the data is truly revealing. For example, a researcher studying an entirely new organizational phenomenon — such as how remote-first software teams develop trust in the absence of any face-to-face interaction — might choose grounded theory precisely because there is no existing theoretical basis from which to derive meaningful propositions.</p>

<p>However, for most qualitative designs — particularly case studies, phenomenological research, and ethnographies — having propositions provides essential direction. Without them, the study risks becoming unfocused, collecting irrelevant data, and failing to connect its findings back to existing knowledge. The recommendation is therefore: <b>use propositions by default, and omit them only when you have a clear epistemological justification for doing so</b> (such as grounded theory).</p>

<h2>How Propositions Differ from Hypotheses</h2>
<p>It is important to distinguish propositions from quantitative hypotheses. A hypothesis such as "H1: Power Distance positively predicts Psychological Safety (β > 0.30, p < 0.05)" is fixed, tested with statistical methods like SEM, and reported as supported or not supported. A proposition such as "If leaders model vulnerability, team members will report greater willingness to voice concerns" is flexible, tested through thematic evidence, and can be refined during analysis. An assertion, by contrast, is simply a statement of observed fact: "Five of six participants reported discomfort raising technical concerns publicly." These are three distinct tools for three distinct purposes.</p>`,
deep:`${tbl(["Propositions (Qual)","Hypotheses (Quant)"],[["Conditional if-then statements that guide inquiry","Testable statistical statements about IV-DV relationships"],["Flexible — can evolve as data emerges during analysis","Fixed before data collection, not revised during the study"],["Guide exploratory inquiry and pattern discovery","Drive confirmatory testing of pre-specified relationships"],["Tested through pattern matching, thematic analysis, explanation building","Tested through t-test, ANOVA, regression, SEM"],["Can include descriptions, interpretations, and inferences","Specify precise directional relationships between measurable variables"]])}
<h3>Approaches to Theory in Qualitative Research</h3>
${bb("Tabula Rasa","Blank slate, pure induction. No preconceptions. Most extreme form — rare in practice.")}
${bb("Grounded Theory","Theory emerges from data through iterative coding. No starting hypotheses, but systematic method.")}
${bb("Proposition-guided (most common)","Start with theory-informed propositions, remain open to revision. Balances grounding with flexibility.")}
${tip("The question says 'always' — this is the trap. Answer: 'Not always, because grounded theory works without them. But usually yes.' Then give your DBA802 example showing both the confirmed proposition AND the emergent finding. This demonstrates you understand both sides.")}`},

{id:"q1q3",emoji:"⚡",label:"Qual Q3: Key Issues (3/4)",group:"part1qual",marks:"",
direct:`${cq('"Discuss key issues in qualitative research (choose 3 of 4): triangulation & credibility, generalizability, active interviewing & researcher-participant interaction, qualitative software."')}
<p>Prepare all four. The question specifically links triangulation to <b>credibility</b> and active interviewing to <b>researcher-participant interaction</b> — tailor your answers to these specific angles.</p>

<h2>1. Triangulation & Credibility</h2>
<p>Triangulation means cross-validating findings through multiple independent sources. It directly improves <b>credibility</b> — the qualitative parallel to internal validity — because if multiple sources converge on the same conclusion, the finding is more believable than one supported by a single source alone. It reduces the risk that findings are artifacts of a single method's bias or a single participant's perspective. There are four main types of triangulation:</p>
${bb("Data Triangulation","Using multiple data sources such as interviews from different organizational roles, archival documents, and observation notes to verify findings across contexts.")}
${bb("Investigator Triangulation","Having multiple researchers independently analyse the same dataset, reducing the influence of any single researcher's interpretation.")}
${bb("Theory Triangulation","Applying multiple theoretical frameworks to the same data to examine whether different lenses yield consistent or complementary insights.")}
${bb("Method Triangulation","Using multiple research methods such as interviews, surveys, and observation to study the same phenomenon from different angles.")}
<p>Triangulation is considered more important in qualitative research than in quantitative research because qualitative data collection is inherently less structured and more subjective. Quantitative research establishes validity through standardized instruments and statistical tests; qualitative research compensates for its subjectivity through triangulation across multiple angles.</p>
<p><b>Example:</b> In my DBA802 study on psychological safety in Vietnamese tech teams, I employed both data triangulation and method triangulation. For data triangulation, I interviewed participants from both a multinational company (Gameloft) and local Vietnamese studios, ensuring findings were not artifacts of a single organizational culture. For method triangulation, I combined semi-structured interviews with contact summary sheets and a think display matrix. Theme 7 — that face-saving culture creates a differential between public silence and private openness about safety concerns — was validated across multiple participants from different organizational contexts, significantly strengthening the credibility of this finding. Had I relied on a single data source or a single method, this cross-contextual pattern might have been dismissed as an individual quirk rather than a culturally embedded phenomenon.</p>

<h2>2. Limits of Generalizability</h2>
<p>Generalizability — the extent to which findings can be applied to a broader population beyond the sample studied — is a persistent and inherent challenge in qualitative research. This difficulty arises from several characteristics of the qualitative approach. Studies typically use small, purposive samples selected for depth rather than statistical representativeness. Sampling is non-random, meaning participants are chosen based on specific criteria rather than chance. Findings tend to be context-specific, shaped by the unique demographic, cultural, and organizational characteristics of the setting. Additionally, researcher subjectivity in data interpretation introduces personal bias that can limit the universality of conclusions.</p>
<p>Rather than claiming generalizability in the statistical sense, qualitative researchers should aim for <b>transferability</b> by providing thick descriptions of the research context — detailed enough that readers in other settings can judge whether the findings might apply to their own situations. Comprehensive sampling from varied sub-groups and explicit acknowledgment of contextual boundaries also strengthen the study's contribution.</p>
<p><b>Example:</b> My DBA802 study interviewed only 6 participants — clearly insufficient for statistical generalization to all technology companies or all Vietnamese professionals. However, I provided thick descriptions of Vietnamese hierarchical workplace culture, Confucian-influenced face-saving norms, the specific dynamics of game development teams, and the organizational structures of both multinational and local studios. A reader working in, say, a Vietnamese fintech startup could use these descriptions to judge whether the face-saving dynamics I observed might also operate in their own context — even though I cannot statistically claim my findings apply to their setting. This is the essence of transferability: not claiming universality, but providing enough context for informed judgment.</p>

<h2>3. Active Interviewing & Researcher-Participant Interaction</h2>
<p>Active interviewing is an approach that emphasizes engaging the interviewee in genuine, dynamic conversation rather than mechanically asking a fixed set of predetermined questions. The interviewer uses open-ended questions, follow-up probes, and authentic curiosity to encourage participants to share deeper thoughts, reflections, and experiences. This involves both <b>actively probing</b> — asking spontaneous follow-up questions that explore unexpected or rich responses — and <b>passively asking</b> predetermined questions that ensure consistency across interviews.</p>
<p>Active interviewing produces more honest, detailed, and nuanced responses than structured interviews. By demonstrating genuine interest, the interviewer builds rapport and trust, creating a psychologically safe environment where participants feel comfortable sharing openly. This captures richness and complexity that standardized instruments miss — participants reveal not just what they think, but why they think it and how their understanding has evolved.</p>
<p>However, active interviewing introduces challenges. There is a risk of inadvertently leading the interviewee toward particular responses through suggestive follow-ups. The approach requires strong interviewing skills not all researchers possess. It is harder to standardize across multiple interviews, potentially introducing inconsistencies in data collection. The interviewer's own biases and assumptions can influence the direction of the conversation. Finally, active interviews are significantly more time-consuming to conduct and analyse than structured alternatives.</p>
<p><b>Example:</b> In my DBA802 interviews, one participant initially responded to a question about feeling safe to speak up with a generic positive answer: "Yes, I feel comfortable sharing my ideas." Through active probing — asking "Can you describe a specific recent situation where you chose to speak up, and one where you chose not to?" — the participant revealed a much more nuanced reality: they freely raised technical issues in one-on-one meetings with their manager but deliberately avoided voicing the same concerns in team meetings where senior leaders were present. This private-public differential became Theme 7 in my study and was arguably the most significant finding — yet it would never have emerged from a standardized survey question or a rigid interview protocol. The active probing transformed a superficial "yes" into a rich, contextualized insight about how face-saving culture shapes the expression of psychological safety.</p>

<h2>4. Qualitative Data Software</h2>
<p>Qualitative research software such as NVivo assists researchers in managing and analysing large volumes of qualitative data that would be unwieldy to handle manually. These tools offer several important benefits: they allow efficient organization of transcripts, documents, and field notes in a structured, searchable database; they support systematic coding by providing tools to tag data segments, group codes into categories, and visualize relationships between themes; they enable collaboration by allowing multiple researchers to work on the same project simultaneously, which is particularly valuable for investigator triangulation; and they automate repetitive analytical tasks such as coding frequency counts, word frequency analysis, and cross-case pattern searches. Additional tools mentioned in the curriculum include Word Cloud for visual text summaries, Text Analytics for AI-powered pattern detection, and Computer Vision and Video Analyzer for non-text data sources.</p>
<p><b>Example:</b> In a study of psychological safety across multiple Gameloft studios, a researcher managing interview transcripts from 15+ participants across three countries would benefit enormously from NVivo. Without software, tracking which codes appear across which participants, identifying patterns like "face-saving behaviour is mentioned by 12 of 15 participants but only in the Vietnamese sub-sample," and generating visual code maps would be extremely labor-intensive and error-prone. NVivo's matrix coding query could instantly cross-reference codes by participant demographics, revealing culturally specific patterns that manual analysis might miss.</p>`,
deep:`<h2>When Triangulation Reveals Contradictions</h2>
<p>Contradictions across sources are not a failure — they are analytically valuable. When two data sources or methods yield conflicting findings, the researcher should report this transparently, explore the reasons behind the divergence (power dynamics, different perspectives, contextual differences), and discuss the implications. This demonstrates analytical sophistication. For example, if interview data suggests high psychological safety but observational data shows participants remain silent in meetings, the contradiction itself is a finding — it reveals a gap between stated beliefs and actual behavior that is deeply informative.</p>
<h2>Active Interviewing: The Three Phases</h2>
${bb("Building Rapport","Establish genuine connection. Put participant at ease. Share the study's purpose and ethical safeguards.")}
${bb("Main Questions","Core inquiry with active probing. Follow unexpected responses. Balance spontaneous follow-ups with predetermined questions for consistency.")}
${bb("Closing","Conclude positively. Allow final thoughts. Leave a good impression for potential follow-up contact.")}
${tip("Each issue should include: (1) definition, (2) why it matters specifically in qualitative research, (3) types or components, (4) challenges or limitations, (5) a concrete example from your own research. This structure demonstrates both conceptual understanding and practical application.")}`},

{id:"q1q4",emoji:"📊",label:"Quant Q1: RQ + Design",group:"part1quant",marks:"",
direct:`${cq('"Set up a research question for this study. Give a rationale for it. How would you design the study? Specify the details."')}
<h2>Research Question</h2>
<p>The main research question is: <em>"To what extent do social media marketing dimensions — specifically interaction, customisation, and trendiness — influence consumers' repurchase intention toward high-tech brands?"</em></p>

<p>This is supported by sub-questions: (1) What is the unique effect of social media interaction on repurchase intention? (2) To what extent does customisation of social media content predict repurchase intention? (3) What role does perceived trendiness play in driving repurchase intention? (4) Do demographic factors (gender, age, education, income, prior social media use) significantly affect repurchase intention or moderate the above relationships?</p>

<h2>Rationale</h2>
<p>From a practical standpoint, high-tech brands invest heavily in social media marketing but lack evidence on which specific dimensions most effectively drive repeat purchasing. Understanding the relative contribution of interaction (the ability for users to exchange opinions and share content), customisation (personalized information feeds and customized service), and trendiness (newest information, association with being current) would allow marketing managers to allocate budgets based on evidence. From an academic perspective, the study decomposes the broad "social media marketing" construct into three measurable dimensions, testing them in the high-tech context where purchase decisions are higher-involvement. From a methodological standpoint, the dataset uses validated multi-item Likert scales for each construct, enabling rigorous measurement validation.</p>

<h2>Study Design</h2>
<p>This is a <b>quantitative, cross-sectional, survey-based study</b> using secondary data collected by a reputable non-partisan organization. The dataset contains multi-item Likert-scale measures (1 = Strongly Disagree to 5 = Strongly Agree) for four constructs: repurchase intention (4 items: consider brand first, comfortable shopping, continue using, buy new products), interaction (5 items: deliver opinion, exchange opinions, share info, update content, brand interacts with followers), customisation (4 items: customized service, search customized info, lively feed, easy to use), and trendiness (4 items: newest info, trendy to use, anything trendy, express individuality). Five demographic variables are included: prior social media use (binary: 1=No, 2=Yes), gender (nominal: 1=Female, 2=Male, 3=Others), age (continuous: actual years), education (continuous: years of education), and income (continuous: actual income). Because each construct is measured by multiple items, the appropriate analytical framework is <b>Structural Equation Modeling (SEM) via SmartPLS</b>.</p>`,
deep:`
<h2>The Dataset Items in Detail</h2>
${tbl(["Construct","# Items","Sample Items","Scale"],[
["Repurchase Intention (DV)","4","Consider brand first; comfortable shopping; continue using; buy new products","1-5 Likert"],
["Interaction (IV)","5","Deliver opinion; exchange with users; share info; update content; brand interacts with followers","1-5 Likert"],
["Customisation (IV)","4","Customized service; search customized info; lively feed; easy to use","1-5 Likert"],
["Trendiness (IV)","4","Newest info; trendy to use; anything trendy; express individuality","1-5 Likert"],
["Prior SM use","1","Binary (1=No, 2=Yes)","Nominal"],
["Gender","1","1=Female, 2=Male, 3=Others","Nominal"],
["Age","1","Actual years","Continuous"],
["Education","1","Years of education","Continuous"],
["Income","1","Actual income in local currency","Continuous"],

{id:"q1q5",emoji:"🔬",label:"Quant Q2: SEM Analysis",group:"part1quant",marks:"",
direct:`${cq('"How would you analyze the relationship between interaction, customization, and trendiness on repurchase intention? What methods would you use? Please be specific."')}

<h2>Recommended Method: SEM via SmartPLS (PLS-SEM)</h2>
<p>Because each construct in this dataset is measured by <b>multiple Likert-scale items</b> — repurchase intention has 4 items, interaction has 5, customisation has 4, and trendiness has 4 — the most appropriate method is <b>Structural Equation Modeling (SEM)</b> using SmartPLS. SEM is superior to alternatives for three reasons. First, it simultaneously validates the <b>measurement model</b> (do the items actually represent their intended constructs?) and tests the <b>structural model</b> (the hypothesized paths between constructs). Second, it explicitly handles <b>measurement error</b> — individual items are imperfect, and SEM accounts for this rather than assuming perfect measurement as regression does. Third, it tests all three relationships (interaction→RI, customisation→RI, trendiness→RI) simultaneously, revealing each construct's unique contribution.</p>

<h2>Step 1: Data Preparation</h2>
<p>Check for missing values and decide on handling (listwise deletion or imputation). Screen for outliers. Assess item distributions — PLS-SEM is relatively robust to non-normality but extreme skewness should be noted. Verify sample size exceeds the minimum: at least 10 times the number of arrows pointing to the most complex construct (interaction has 5 items + 1 structural path = 6 arrows, so minimum ~60 cases; 100+ is recommended for stability).</p>

<h2>Step 2: Measurement Model (Outer Model)</h2>
<p>Four criteria confirm the survey items validly and reliably represent their constructs:</p>
<ul>
<li><b>Factor Loadings ≥ 0.707:</b> Each item should load at 0.707+ on its construct, meaning at least 50% shared variance. For example, "I intend to continue using this brand in future" should load ≥ 0.707 on Repurchase Intention. Items below threshold should be considered for removal.</li>
<li><b>Cronbach's Alpha ≥ 0.707:</b> Each construct's internal consistency must reach this threshold. The 4 RI items should collectively demonstrate α ≥ 0.707.</li>
<li><b>AVE ≥ 0.50:</b> Average Variance Extracted confirms each construct explains at least half the variance in its indicators (convergent validity).</li>
<li><b>Fornell-Larcker Criterion:</b> The square root of each construct's AVE must exceed its correlations with all other constructs — confirming interaction, customisation, trendiness, and RI are genuinely distinct, not overlapping measures.</li>
</ul>

<h2>Step 3: Structural Model (Inner Model)</h2>
<ul>
<li><b>Collinearity (VIF < 3):</b> Checks whether the three SM constructs are too correlated to isolate individual effects.</li>
<li><b>Path Coefficients (β):</b> Standardized coefficients for each relationship. Larger |β| = stronger effect. Sign indicates direction.</li>
<li><b>Bootstrapping (5,000 subsamples):</b> Generates p-values and 95% confidence intervals for each path. Significant if p < 0.05 and CI excludes zero.</li>
<li><b>R-squared:</b> Proportion of variance in RI explained collectively by the three SM dimensions.</li>
</ul>

<h2>Step 4: Hypotheses and Interpretation</h2>
<p><b>H1:</b> Social media interaction has a positive effect on repurchase intention. <b>H2:</b> Customisation has a positive effect. <b>H3:</b> Trendiness has a positive effect.</p>
<p>For each: "The path from [IV] to RI has β = [value], which is [significant/not] (p = [value]). The 95% bootstrapped CI is [lower, upper], [excluding/including] zero. H[n] is [supported/not supported]."</p>
<p>Discuss <b>all three paths</b> — including non-significant ones: "Trendiness shows β = 0.08, p = 0.21. The effect is not significant; we cannot conclude trendiness uniquely drives repurchase when interaction and customisation are accounted for."</p>`,
deep:`
<h2>Why SEM Over Multiple Regression?</h2>
<p>Multiple regression would require averaging items into single composite scores (e.g., mean of 5 interaction items → one number). This discards measurement quality information and assumes perfect measurement — unrealistic for Likert data. SEM preserves the multi-item structure, validates the instrument, handles measurement error, and tests paths simultaneously. For a dataset with 4-5 items per construct, SEM is unambiguously superior.</p>
<p>However, if an exam gives variables as single scores (no multiple items), regression becomes appropriate: RI = β₀ + β₁(Int) + β₂(Cust) + β₃(Trend) + ε, with VIF < 10, and the standard "one-unit increase" interpretation.</p>
${tip("The case lists specific items per construct (RI: 4, Interaction: 5, Customisation: 4, Trendiness: 4). This is the definitive cue for SEM. If items were not specified, regression would be the safe default.")}

<h2>Full Method Reference</h2>
${tbl(["Scenario","Method","When"],[
["Multi-item constructs","SEM (SmartPLS)","This case — primary"],
["Single-score IVs → continuous DV","Multiple Regression","Fallback"],
["2 group means","t-test","e.g., gender → RI"],
["3+ group means","ANOVA","e.g., education groups → RI"],
["2+ categorical IVs","Factorial ANOVA","e.g., gender × SM use → RI"],
["Binary DV","Logistic Regression","e.g., repurchase yes/no"],
["2 categoricals associated?","Chi-Square","e.g., gender × prior SM use"],
["Multiple DVs","MANOVA","e.g., gender → RI + loyalty"],
])}
<h2>DBA801 Thresholds</h2>
${bb("Factor Loading","≥ 0.707")}${bb("Cronbach's α","≥ 0.707")}${bb("VIF","< 3 (SEM)")}${bb("AVE","≥ 0.50")}${bb("Fornell-Larcker","√AVE > inter-construct correlations")}
`},

{id:"q1q6",emoji:"👫",label:"Quant Q3: Gender Impact",group:"part1quant",marks:"",
direct:`${cq('"If you were to analyze repurchase intention and wanted to understand if gender had any impact, what steps would you take? What variables? Explain the best statistical technique with sufficient substantiation."')}

<h2>Variables</h2>
<p>The dependent variable is <b>repurchase intention</b>, operationalized as the mean of the four RI Likert items (consider brand first, comfortable shopping, continue using, buy new products), producing a continuous composite on a 1-5 scale. The independent variable is <b>gender</b>, coded as nominal (1=Female, 2=Male, 3=Others). The primary comparison is Female vs. Male; the "Others" category should be reported descriptively but may have insufficient sample size for statistical testing.</p>

<h2>Best Technique: Independent Samples t-test</h2>
<p>The independent samples t-test is the best technique because we are comparing the <b>means of a continuous DV</b> (RI composite) across <b>two groups</b> of a categorical IV (Female vs. Male). The t-test directly answers whether the observed difference in group means is statistically significant or due to chance. It is preferred over ANOVA (which gives identical results for 2 groups but is less parsimonious), over chi-square (which requires both variables to be categorical — RI is continuous), and over regression (which models predictive relationships rather than simply testing group differences).</p>

<h2>Steps</h2>
<p><b>Step 1:</b> Compute the RI composite score by averaging the four items for each respondent.</p>
<p><b>Step 2:</b> State hypotheses. H0: No significant difference in mean RI between males and females (μ_male = μ_female). H1: A significant difference exists (μ_male ≠ μ_female).</p>
<p><b>Step 3:</b> Check assumptions. Normality of RI within each group (Shapiro-Wilk test or histograms). Homogeneity of variances (Levene's test). If violated → use Mann-Whitney U test (non-parametric alternative).</p>
<p><b>Step 4:</b> Run t-test. Report: mean RI for each group, t-statistic, degrees of freedom, p-value. If p < 0.05, reject H0 — gender significantly impacts RI. If p ≥ 0.05, retain H0.</p>
<p><b>Step 5 (Advanced):</b> To test gender's effect while controlling for SM dimensions, include gender as a dummy variable in the SEM model or supplementary regression: RI = β₀ + β₁(Int) + β₂(Cust) + β₃(Trend) + β₄(Gender) + ε. Alternatively, run <b>multi-group SEM analysis</b> in SmartPLS — estimating the full model separately for males and females to test whether path coefficients differ significantly between groups. This tests gender as a <b>moderator</b> of the SM→RI relationships.</p>`,
deep:`
<h2>Why t-test Over Alternatives?</h2>
<p><b>vs. ANOVA:</b> Mathematically identical for 2 groups, but t-test is more parsimonious. If gender had 3+ meaningful categories with sufficient sample sizes, one-way ANOVA would be appropriate.</p>
<p><b>vs. Chi-Square:</b> Incorrect — chi-square requires both variables to be categorical. RI is a continuous composite. Using chi-square wastes information by ignoring the scale's ordered nature.</p>
<p><b>vs. Regression:</b> Regression tests a predictive model; t-test answers "is there a group difference?" For this specific question, t-test is the most direct answer. Regression is the extension for controlling covariates.</p>
<h2>Handling "Others" Gender Category</h2>
<p>With 3 gender categories (F/M/Others), "Others" likely has a small n. Report descriptives for all three, but run t-test on Male vs. Female only. Note this as a limitation. If "Others" is large enough, use one-way ANOVA across all three.</p>
${tip("Question asks for 'steps' AND 'best technique with substantiation.' Number the steps AND explain why t-test beats alternatives — both are required for full marks.")}`},

{id:"q1q7",emoji:"⚠️",label:"Quant Q4: Limitations (5m)",group:"part1quant",marks:"5",
direct:`${cq('"What limitations to keep in mind? List and justify. Examples from the scenario. At least 50 words." — 5 marks')}
<p>Several limitations should be considered when interpreting the results of this analysis.</p>

<p>First, this is a <b>cross-sectional survey design</b>, meaning we observe correlations, not causation. We cannot say that high interaction <em>causes</em> higher repurchase intention — it is equally possible that consumers who already intend to repurchase are more active on the brand's social media. For example, a consumer who rates "I intend to continue using this brand in future" as 5 (strongly agree) may also rate "It is easy to deliver my opinion through high-tech brand social media" highly simply because they are already an engaged customer, not because the interaction feature drove their repurchase decision.</p>

<p>Second, <b>self-report bias</b> is inherent in all Likert-scale survey data. Respondents may overstate their agreement with positive statements about the brand's social media or their future purchase intentions due to social desirability. For instance, rating "I would like to buy new products from this brand" as a 4 or 5 may reflect what the respondent thinks is the "right" answer rather than their genuine behavioral intention.</p>

<p>Third, <b>common method bias</b> is a risk because all constructs are measured using the same self-report Likert instrument in the same survey. This shared method variance can inflate correlations between interaction, customisation, trendiness, and repurchase intention, making relationships appear stronger than they are.</p>

<p>Fourth, the three SM dimensions may exhibit <b>multicollinearity</b>. Items like "It is possible to share information with other users" (interaction) and "It is possible to provide lively feed information" (customisation) are conceptually overlapping, and high correlations between constructs would make it difficult to isolate each dimension's unique contribution. VIF should be checked and discriminant validity confirmed via Fornell-Larcker.</p>

<p>Fifth, the <b>trendiness construct</b> includes an item ("High-tech products are one of the most important ways to express my individuality") that measures personal identity expression rather than the brand's social media trendiness per se. This item may not load cleanly on the trendiness factor during measurement model assessment, potentially requiring removal — which would reduce the construct to 3 items.</p>

<p>Sixth, <b>sample representativeness</b> is unknown. As we are analyzing an existing dataset collected by a third-party organization, we do not know the full sampling methodology. If the sample over-represents younger or more tech-savvy consumers, findings may not generalize to the broader population of high-tech brand consumers.</p>`,
deep:`
${tip("Only 5 marks, minimum 50 words. Don't over-invest time. The direct answer above is comprehensive; in a time crunch, the top 4 limitations (cross-sectional, self-report, common method, multicollinearity) are sufficient.")}
${bb("Mitigation: Cross-sectional","Frame as associational. Recommend longitudinal follow-up.")}
${bb("Mitigation: Self-report","Acknowledge. Triangulate with behavioral data if available.")}
${bb("Mitigation: Common method","Harman's single-factor test.")}
${bb("Mitigation: Multicollinearity","VIF < 3 in SEM. Fornell-Larcker for discriminant validity.")}
${bb("Mitigation: Trendiness item","Check loadings. Remove item if < 0.707.")}
${bb("Mitigation: Sample","Report demographics. Acknowledge unknown sampling details.")}
`},


{id:"p2q1",emoji:"🏢",label:"P2 Q1: Significance",group:"part2",marks:"10",
direct:`${cq("Significance of the study — company, industry, public. (10 marks)")}
<h2>Significance for Globex Corporation</h2>
<p>This study holds immediate strategic value for Globex Corporation. The company's Silicon Valley fabrication plant has incurred over USD 1.75 million in EPA fines in the past fiscal year alone, with private litigation adding roughly twice that amount — meaning environmental non-compliance is already costing the company over USD 5 million annually. Simultaneously, investors are migrating away from corporations lacking environmental and social principles, and Globex's stock value has declined over the past three years while competitors with visible sustainability programs have experienced investment growth. CEO Damian Wong has articulated the ambition to "broaden Globex's green influence and drive the industry towards low-carbon sustainability," but the company currently lacks empirical evidence about which specific sustainability initiatives — whether developing a sustainability plan, communicating goals to stakeholders, or pursuing costly third-party ESG certification — would most effectively reverse these trends. This study provides that evidence, enabling Globex's leadership to make data-driven decisions about where to invest its sustainability resources for maximum impact on investor confidence and regulatory risk reduction.</p>

<h2>Significance for the Semiconductor Industry</h2>
<p>The semiconductor industry is under increasing scrutiny because of its enormous environmental footprint — fabrication plants consume millions of gallons of water daily and produce hazardous waste. As demand for silicon chips surges (embedded in everything from smartphones to wind turbines), the industry faces a fundamental tension between growth and sustainability. Globex's situation is not unique; semiconductor firms globally face similar pressures from regulators, investors, and downstream customers keen to report clean supply chains. This study establishes industry-specific benchmarks for evaluating the effectiveness of different sustainability approaches, providing a evidence-based framework that other semiconductor manufacturers can adapt to their own contexts.</p>

<h2>Significance for the Academic and Public Community</h2>
<p>From an academic perspective, most existing research on CSR and investor behavior has focused on service industries or general corporate settings. This study extends that knowledge to capital-intensive, high-carbon-footprint manufacturing, where the stakes are qualitatively different — environmental liabilities run into millions of dollars, and the cost of ESG certification (up to 25% of annual net profits, per the case) represents a substantial resource commitment that demands rigorous evaluation. The study also contributes to policy discussions about the effectiveness of EPA enforcement as a driver of corporate sustainability and whether market-based mechanisms (investor pressure) or regulatory mechanisms (fines) are more powerful motivators for environmental responsibility.</p>`,
deep:`${tip("Always address all three audiences — company, industry, academic/public. Use specific case numbers ($1.75M fine, 25% net profit for ESG) to show you read the case carefully.")}`},

{id:"p2q2",emoji:"🎯",label:"P2 Q2: RQ + Variables",group:"part2",marks:"20",
direct:`${cq("Research problem, research question — variables included. (20 marks)")}
<h2>Research Problem</h2>
<p>Globex Corporation, a global leader in silicon-encapsulated microcircuits and semiconductors based in Silicon Valley, faces a compounding strategic crisis driven by two converging forces. On the regulatory front, the company's fabrication plant — which consumes millions of gallons of water daily and generates hazardous waste — has incurred USD 1.75 million in EPA fines in the past fiscal year, with private litigation adding approximately USD 3.5 million more. On the investor relations front, stock values have declined over the past three years as investors increasingly divest from companies lacking environmental and social commitments, while competitors with visible CSR programs have captured investment growth. CEO Damian Wong has commissioned this research to evaluate potential courses of action aimed at reducing the risk of continued profit loss from shrinking investments and rising EPA penalties.</p>

<p>The case identifies two specific courses of action to evaluate. First, the development of a sustainability plan and set of goals, with research into the impact of communicating these goals to stakeholders on investment behavior and regulatory exposure. Second, the pursuit of third-party ESG certification, which would validate the organization's commitment to sustainable and ethical practices but represents a significant resource commitment — up to 25% of annual net profits. The core research problem is that Globex currently lacks empirical evidence about whether and how these sustainability initiatives translate into measurable improvements in investor confidence and regulatory risk reduction, making it impossible to conduct a rational cost-benefit analysis of these investments.</p>

<h2>Research Questions</h2>
<p>The main research question is: <em>"To what extent do sustainability initiatives — specifically sustainability goal communication and third-party ESG certification — influence investor confidence and reduce regulatory risk for semiconductor manufacturers?"</em></p>

<p>This is supported by the following sub-questions: (1) What is the relationship between communicating sustainability goals to stakeholders and changes in investor confidence and investment behavior? (2) Does third-party ESG certification have a measurable effect on perceived regulatory risk and investor willingness to invest? (3) Do the potential benefits of ESG certification outweigh the substantial costs (up to 25% of net profits) in terms of reduced penalties and restored investment? (4) How do firm-level characteristics (size, regulatory history, current ESG standing) moderate the effectiveness of these initiatives?</p>

<h2>Variables</h2>
${tbl(["Variable","Type","Role","Measurement"],[
["Sustainability goal communication","Likert scale","IV","Perceived clarity, ambition, and visibility of communicated sustainability goals"],
["ESG certification status","Binary / ordinal","IV","Whether the firm holds third-party ESG certification, and at what level"],
["Investor confidence","Likert scale","DV","Investment willingness, perceived trustworthiness, forward-looking stock sentiment"],
["Perceived regulatory risk","Likert scale","DV","Anticipated EPA penalties, compliance burden, litigation risk exposure"],
["Investment behavior change","Ordinal","DV","Reported changes in portfolio allocation toward/away from the firm"],
["ESG certification cost","Continuous","Context variable","Percentage of net profits allocated to certification (up to 25%)"],
["Firm size","Continuous","Moderator","Revenue or market capitalization"],
["Regulatory penalty history","Continuous","Control","Total EPA fines + litigation costs in past 3 years"],
["Competitor ESG standing","Ordinal","Control","Relative ESG positioning vs. industry peers"]])}

<h2>Hypotheses</h2>
<p>H1: Communication of a clear sustainability plan and goals has a positive effect on investor confidence. H2: Third-party ESG certification reduces perceived regulatory risk among institutional investors. H3: The positive effect of ESG certification on investor confidence is moderated by firm size, such that larger firms benefit more from the signaling effect. H4: For firms with high recent regulatory penalties (like Globex), the effect of sustainability initiatives on investor confidence is stronger than for firms with clean compliance records, because the perceived improvement signal is more dramatic.</p>`,
deep:`${tip("Use specific case details in your answer: $1.75M EPA fines, $3.5M litigation, 25% net profit cost for ESG, CEO Damian Wong. Shows you read the case thoroughly and are tailoring your design to the actual problem, not giving a generic template.")}`},

{id:"p2q3",emoji:"📚",label:"P2 Q3: Literature",group:"part2",marks:"20",
direct:`${cq("Potential sources of relevant literature — sub-topics to organise the review. (20 marks)")}
<p>The literature review should be organized around six key sub-topics, each contributing a distinct theoretical and empirical layer to the research design. Together, these sub-topics ground the conceptual model, inform variable operationalization, and identify the gaps that justify this study's contribution.</p>

<h2>Sub-Topic 1: Corporate Social Responsibility and Stakeholder Communication</h2>
<p>This section reviews the theoretical foundations of CSR, drawing on Carroll's CSR pyramid and stakeholder theory to frame why and how corporations communicate sustainability commitments. Given that one of Globex's courses of action is developing and communicating a sustainability plan, the review should examine the literature on CSR signaling — how stakeholders perceive and respond to public sustainability commitments. Do communicated goals change investor behavior, or are they dismissed as "greenwashing" without substantive action? The section should also examine the conditions under which CSR communication is most credible — for instance, whether specificity and measurability of goals matters more than aspirational language.</p>

<h2>Sub-Topic 2: ESG Certification and Third-Party Validation</h2>
<p>This section covers the rapidly growing field of ESG certification — the standards, processes, costs, and benefits of third-party environmental, social, and governance validation. The case specifies that ESG certification could cost Globex up to 25% of its annual net profits, making this a high-stakes investment decision. The review should examine whether ESG certification provides a credible signal that goes beyond self-reported CSR claims, how institutional investors weight certified versus self-declared ESG commitments, and what the empirical evidence says about the financial returns on ESG certification investment in manufacturing sectors.</p>

<h2>Sub-Topic 3: Investor Confidence and ESG-Driven Investment Behavior</h2>
<p>This section examines what drives investor confidence, how investors incorporate ESG information into their decision-making, and the growing trend of ESG-motivated divestment. The case notes that investors are already moving away from corporations without environmental principles, and competitors with CSR programs have seen investment growth. The literature should cover the mechanisms through which ESG information affects portfolio allocation, whether ESG creates a valuation premium or reduces perceived risk, and how the strength of the effect varies by investor type (institutional vs. retail, ESG-mandated vs. discretionary).</p>

<h2>Sub-Topic 4: Regulatory Risk, EPA Enforcement, and Compliance Costs</h2>
<p>This section reviews the regulatory landscape specific to semiconductor manufacturing in the United States, including EPA enforcement mechanisms, fine structures, and private litigation costs. Globex has faced $1.75M in EPA fines and approximately $3.5M in private litigation — the review should contextualize whether these amounts are typical for the industry, whether they are escalating, and how firms that have successfully reduced their regulatory burden did so. The literature on regulatory risk perception among investors is also relevant — do investors treat EPA fines as one-time events or as signals of systemic governance failure?</p>

<h2>Sub-Topic 5: Sustainability in Semiconductor Manufacturing</h2>
<p>This section provides operational context specific to the semiconductor industry. Fabrication plants consume enormous quantities of water and energy while producing hazardous chemical waste. The review should cover existing sustainability strategies in semiconductor manufacturing — water recycling, renewable energy adoption, chemical waste reduction, and carbon offset programs. Understanding what practical sustainability looks like in this context is essential for designing realistic survey instruments and interview questions that resonate with both industry executives and investors familiar with the sector.</p>

<h2>Sub-Topic 6: Cost-Benefit Analysis of Sustainability Investments</h2>
<p>Given that the case explicitly frames ESG certification as costing up to 25% of net profits and asks whether benefits outweigh costs, the review should examine the literature on return on sustainability investment (ROSI). This includes studies that quantify the financial returns from reduced regulatory penalties, lower cost of capital, improved brand value, and increased investor willingness to pay a premium for sustainable firms. The review should also cover frameworks for evaluating sustainability investments under uncertainty, since the benefits are probabilistic rather than guaranteed.</p>

<h2>What the Literature Review Informs</h2>
<p>The literature review directly informs the conceptual model by identifying which variables to include and what relationships to hypothesize. It guides the operationalization of each construct by pointing to validated measurement instruments. It grounds the hypotheses in existing empirical evidence. It identifies control variables and moderators. And critically, it reveals the gap that this study fills: limited empirical research on the effectiveness of sustainability initiatives specifically in high-carbon semiconductor manufacturing, where both the environmental footprint and the investment costs are qualitatively different from other sectors.</p>`,
deep:`${tip("Reference case-specific details in your lit review framing: the $1.75M EPA fines, the 25% net profit ESG cost, the water/waste challenges unique to semiconductor fabrication. This shows you are tailoring the review to the actual problem, not giving generic sub-topics.")}`},

{id:"p2q4",emoji:"🧪",label:"P2 Q4: Research Design",group:"part2",marks:"20",
direct:`${cq("Structure your research process — which approach and why. (20 marks)")}
<h2>Recommended: Explanatory Sequential Mixed Methods Design</h2>
<p>This study should employ an explanatory sequential mixed methods design consisting of two phases. Given that CEO Damian Wong needs actionable evidence to decide between costly sustainability initiatives, the design must produce both statistically rigorous findings and contextual understanding of the mechanisms driving investor behavior.</p>

<h2>Phase 1: Quantitative Data Collection and Analysis</h2>
<p>The first phase involves administering a structured survey to institutional investors, financial analysts, and fund managers who currently hold or evaluate semiconductor industry stocks. The survey will use validated Likert-scale instruments to measure respondents' perceptions of sustainability goal communication effectiveness, attitudes toward third-party ESG certification, current and prospective investment confidence in firms like Globex, and perceived regulatory risk. The instrument will include scenario-based questions — for example, presenting investors with Globex's actual situation (EPA fines, declining stock) and asking them to rate how specific sustainability actions would affect their investment decisions. This approach reduces social desirability bias compared to asking direct questions about ESG importance. Demographic and portfolio variables (fund type, AUM, ESG mandate status, investment horizon) serve as controls. The target sample is 200 to 300 respondents recruited through stratified random sampling across fund types to ensure representation.</p>

<h2>Phase 2: Qualitative Follow-Up</h2>
<p>The second phase involves semi-structured interviews with 15 to 20 purposively selected participants from two groups: investors who participated in the Phase 1 survey and were identified as information-rich cases (those with strong or divergent views on ESG), and Globex executives including members of the sustainability strategy team and investor relations. The interviews explore the mechanisms behind the quantitative findings — for example, if Phase 1 reveals that ESG certification has a stronger effect on investor confidence than sustainability goal communication alone, Phase 2 probes why: Is it the third-party credibility? The standardized benchmarking? The signal of resource commitment? The interviews also explore Globex's internal perspective on the feasibility and trade-offs of the 25% net profit investment in ESG certification.</p>

<h2>Why Explanatory Sequential (Not Exploratory)?</h2>
<p>The constructs in this study — CSR, ESG certification, investor confidence, regulatory risk — are all well-established in existing academic literature with validated measurement instruments available. There is no need to "discover" what the relevant variables are through qualitative exploration first. What Globex needs is to first MEASURE the relationships at scale using quantitative methods (how much do investors actually care about ESG certification versus communicated goals?), and then EXPLAIN the underlying mechanisms through qualitative follow-up (why do they care, and what would change their behavior?). If the case instead involved a completely novel sustainability practice with no prior research, an exploratory sequential design — qualitative first to identify constructs, then quantitative to test them — would be more appropriate.</p>

<h2>Justification for Mixed Methods Over Single-Method</h2>
<p>A purely quantitative approach would tell CEO Wong whether ESG certification statistically predicts higher investor confidence, but not why investors value it or what specific aspects of certification matter most. A purely qualitative approach would provide rich investor perspectives but lack the statistical generalizability needed to justify a commitment of 25% of net profits. The mixed methods design produces both: generalizable quantitative evidence that ESG certification (or goal communication) has a significant effect, plus qualitative depth explaining the mechanisms and conditions under which it works. This combination gives Globex's board the statistical confidence and the strategic narrative needed to make a multi-million dollar decision.</p>`,
deep:`${tip("Decision rule: well-known constructs with existing scales → Explanatory Sequential (quant first). Novel phenomenon → Exploratory Sequential (qual first). The Globex case involves well-established constructs, so Explanatory is correct.")}<h2>Alternative: Quantitative Only</h2><p>Defensible if time and resources are severely constrained. Use SEM to test the full model. Acknowledge the limitation that you cannot explain WHY relationships exist. Recommend qualitative follow-up as future research. This is a weaker design but still passes.</p><h2>Alternative: Convergent Parallel</h2><p>Collect qual and quant simultaneously. Faster overall timeline. But Phase 2 cannot build on Phase 1 findings because they are collected in parallel. Less strategically useful for Globex because the qualitative questions cannot be targeted to the most surprising quant results.</p>`},

{id:"p2q5",emoji:"👥",label:"P2 Q5: Data + Sampling",group:"part2",marks:"10",
direct:`${cq("Source of primary data including population sampling strategy. (10 marks)")}
<h2>Quantitative Primary Data</h2>
<p>The primary quantitative data will be collected through a structured survey questionnaire using validated Likert-scale instruments adapted to the semiconductor sustainability context. The instrument will measure four core constructs — perceived effectiveness of sustainability goal communication, attitudes toward ESG certification, investor confidence, and perceived regulatory risk — along with scenario-based items presenting Globex's specific situation (EPA fines, stock decline, competitor positioning). Demographic and portfolio variables (fund type, assets under management, ESG mandate status, years of semiconductor sector experience) will be captured as controls.</p>

<h2>Quantitative Sampling Strategy</h2>
<p>The target population consists of institutional investors, financial analysts, and fund managers who currently hold or evaluate semiconductor industry stocks — these are the decision-makers whose behavior directly affects Globex's stock value and capital access. A stratified random sampling approach will ensure representation across investor types: mutual funds, pension funds, hedge funds, and ESG-focused funds. Each stratum may have different ESG priorities and risk tolerances, so proportional representation is critical. The target sample is 200 to 300 respondents, providing sufficient statistical power for SEM analysis. Access could be facilitated through investor conferences, financial industry associations, and Globex's own investor relations contacts.</p>

<h2>Qualitative Primary Data</h2>
<p>Semi-structured interviews will be conducted using an interview guide developed after Phase 1 analysis, allowing questions to be tailored to the most significant or unexpected quantitative findings. The guide will include open-ended questions exploring investors' reasoning processes around ESG, their perceptions of Globex's specific challenges, and the conditions under which they would increase or decrease investment.</p>

<h2>Qualitative Sampling</h2>
<p>Purposive sampling of 15 to 20 participants drawn from two groups: investors who participated in Phase 1 and represent information-rich cases (those with particularly strong, divergent, or unexpected responses), and Globex executives involved in sustainability strategy and investor relations — including individuals who can speak to the feasibility and internal trade-offs of the 25% net profit ESG certification investment.</p>

<h2>Secondary Data</h2>
<p>Secondary sources include Globex's EPA penalty records and compliance history, annual financial statements showing stock performance trends over the past three years, competitor sustainability reports and ESG ratings for benchmarking, industry reports on semiconductor environmental practices, and publicly available ESG rating agency assessments of Globex and its peers.</p>`,
deep:`<p><b>Why stratified random for quant?</b> Different investor types (pension funds vs. hedge funds vs. ESG-mandated funds) may respond very differently to sustainability initiatives. Stratified sampling ensures each type is represented rather than being dominated by whichever type is easiest to recruit.</p><p><b>Why purposive for qual?</b> Selects information-rich cases — participants most likely to provide deep insight into the mechanisms behind the quantitative patterns. Not random, but intentionally chosen for analytical value.</p>`},

{id:"p2q6",emoji:"📈",label:"P2 Q6: Data Analysis",group:"part2",marks:"10",
direct:`${cq("How you will analyse the data. (10 marks)")}
<h2>Quantitative Data Analysis</h2>
<p>The quantitative analysis proceeds in a systematic sequence designed to validate the measurement instruments before testing the hypothesized relationships. First, descriptive statistics — means, standard deviations, and a full correlation matrix — provide an overview of data distributions and initial relationships across all variables. Second, the reliability of each multi-item construct is assessed using Cronbach's alpha, with a threshold of 0.707 or higher confirming acceptable internal consistency. Third, confirmatory factor analysis validates the measurement model: factor loadings of 0.707 or higher confirm that each survey item adequately represents its intended construct, AVE (Average Variance Extracted) assesses convergent validity, and the Fornell-Larcker criterion confirms discriminant validity between constructs.</p>

<p>Fourth, the full structural model is tested using Structural Equation Modeling (SEM) via SmartPLS. The VIF (Variance Inflation Factor) is checked to remain below 3 to rule out collinearity issues. Bootstrapping with 5,000 subsamples tests the statistical significance of each path coefficient. Each hypothesis is evaluated based on the path coefficient (β), its p-value, and whether the 95% confidence interval excludes zero. Key paths include: sustainability goal communication → investor confidence, ESG certification → perceived regulatory risk, ESG certification → investor confidence, and the moderating effect of firm size. As supplementary analysis, multiple regression confirms key relationships, and t-tests compare investor confidence scores between respondents who view ESG certification favorably versus unfavorably.</p>

<h2>Qualitative Data Analysis</h2>
<p>All interviews are fully transcribed and imported into NVivo for systematic analysis. A thematic analysis approach proceeds through three stages: initial open coding to identify meaningful data segments, axial coding to group related codes into categories, and theme development to identify overarching patterns across participants. Special attention is given to themes that explain or contradict the quantitative findings — for example, if the SEM shows ESG certification has a stronger path to investor confidence than goal communication, the qualitative analysis explores why investors value certification more and what specific aspects of third-party validation matter most. Triangulation with quantitative findings and member checking with a subset of participants ensure credibility.</p>

<h2>Data Integration</h2>
<p>The integration of quantitative and qualitative findings is presented through a joint display matrix that maps qualitative themes onto the quantitative path relationships. For example, the matrix might show that the statistically significant ESG certification → investor confidence path (β = 0.45, p < 0.001) is explained by three qualitative themes: "third-party credibility removes greenwashing suspicion," "certification provides standardized benchmarking against competitors," and "the resource commitment signals long-term strategic seriousness." This integrated presentation gives CEO Wong both the statistical evidence and the strategic narrative needed to justify the investment decision to Globex's board.</p>`,
deep:`${tip("Name specific thresholds and tools throughout: Cronbach's α ≥ 0.707, factor loading ≥ 0.707, VIF < 3, SmartPLS, bootstrapping (5,000 subsamples), NVivo, joint display matrix. This demonstrates mastery of DBA801 and DBA802 course material and shows you can apply them to a real case.")}`},

{id:"p2q7",emoji:"⚖️",label:"P2 Q7: Strengths + Limits",group:"part2",marks:"10",
direct:`${cq("Strengths and limitations of your proposed approach. (10 marks)")}
<h2>Strengths</h2>
<p>The explanatory sequential mixed methods design offers several significant strengths for the Globex case specifically. First, it combines the breadth of quantitative survey research (200-300 investors) with the depth of qualitative interviews (15-20 key informants), providing CEO Wong with both statistical confidence and strategic narrative for a decision that involves committing up to 25% of net profits. Second, the sequential structure means Phase 2 interviews can be targeted to the most surprising or important findings from Phase 1 — if the quantitative data reveals that ESG certification matters far more than goal communication, the interviews dig into why, rather than exploring both equally. Third, multiple data sources — surveys, interviews, and secondary archival data (EPA records, stock data, competitor ESG ratings) — enable triangulation, strengthening the overall validity and credibility of the findings. Fourth, the use of SEM via SmartPLS tests all hypothesized relationships simultaneously, revealing the relative importance of sustainability goal communication versus ESG certification in a single integrated analysis rather than piecemeal tests.</p>

<h2>Limitations and Mitigation Strategies</h2>
<p>The first limitation is <b>generalizability</b>: because this study focuses on the semiconductor industry and specifically on Globex's situation (a firm under active EPA enforcement), findings may not directly transfer to other sectors or firms without regulatory pressure. This can be mitigated by providing thick descriptions of the semiconductor context and Globex's specific circumstances, enabling readers to judge transferability, and by recommending future replication studies in other high-carbon industries such as steel, petrochemicals, or automotive manufacturing.</p>

<p>The second limitation is <b>social desirability bias</b>: investors may overstate the importance they place on ESG factors, especially given the growing social expectation of responsible investing. This can be mitigated by using scenario-based questions (presenting Globex's actual situation and asking respondents to predict their investment behavior) rather than direct attitude questions ("How important is ESG to you?"), and by triangulating stated intentions with secondary data on actual portfolio behavior.</p>

<p>The third limitation is <b>self-report data</b>: survey responses about investment intentions may not reflect actual investment behavior. An investor who says they would increase allocation to an ESG-certified Globex may not follow through. This can be mitigated by supplementing survey data with archival data such as Globex's actual stock trading volumes and price movements around ESG-related announcements, and by comparing self-reported intentions with observable market behavior.</p>

<p>The fourth limitation is the <b>cross-sectional design</b> of Phase 1, which captures investor perceptions at a single point in time and cannot establish causation. We can observe that investors with higher ESG awareness report higher confidence, but cannot prove that ESG caused the confidence. This can be mitigated by framing findings explicitly as associational, using SEM path analysis to strengthen (though not prove) directional inference, and recommending a longitudinal follow-up study that tracks investor confidence before and after Globex implements specific sustainability milestones.</p>

<p>The fifth limitation is <b>selection bias</b>: investors who choose to participate may be systematically more ESG-engaged than non-participants, potentially inflating the apparent importance of sustainability initiatives. This can be mitigated by using stratified random sampling, tracking non-response rates and comparing respondent demographics against industry benchmarks, and applying statistical weighting if meaningful differences are detected.</p>

<p>Finally, the proposed research is <b>resource-intensive</b>, requiring expertise in both quantitative (SEM) and qualitative (thematic analysis) methods, plus significant time for two sequential phases. This can be mitigated by using a phased timeline with clear milestones, leveraging existing validated survey instruments rather than developing new ones, and conducting a small pilot study to refine the survey instrument before full deployment.</p>`,
deep:`${tip('The template for every limitation: "While [limitation] may affect [what], we mitigate this by [specific action]." Listing limitations WITHOUT mitigations is confirmed as a common weak answer — the mitigation is what demonstrates methodological maturity and earns marks.')}<p>If short on time, prioritize: at least 3 strengths and at least 4 limitations with mitigations. The mitigation is what scores — an unmitigated limitation is only half an answer.</p>`},
