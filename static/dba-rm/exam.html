{id:"q1q1",emoji:"🔍",label:"Qual: Criteria + When NOT",group:"part1qual",marks:"",
direct:`${cq('"What criteria for doing a qualitative study? When to suggest mixed/quant instead?"')}<p>This question is <b>ambiguous</b> — "criteria for doing a qualitative study" can mean (A) when should you choose qualitative methods, or (B) what makes a qualitative study good. <b>Cover both to score high</b>, plus the second part about when to use other methods instead.</p>

<h2>A. Criteria FOR Choosing Qualitative Methods</h2>
<p>Qualitative methods are the appropriate choice when specific conditions about the research problem, the state of knowledge, and the research goals are met:</p>
<ul>
<li><b>The phenomenon is not well understood</b> — the topic is exploratory, with limited prior research or no established theory to test. Qualitative methods allow the researcher to discover patterns and build understanding from the ground up.</li>
<li><b>The research question asks "how" or "why"</b> — the goal is to understand processes, experiences, perceptions, or meaning-making, not to measure "how much" or test statistical relationships.</li>
<li><b>Rich, contextual depth is needed</b> — the topic involves complex social interactions, cultural dynamics, or subjective experiences that cannot be captured through standardized instruments. The researcher needs data from participants' own words and perspectives.</li>
<li><b>The variables are not yet well-defined</b> — when it is unclear which constructs matter or how to measure them, qualitative inquiry helps identify and define the relevant variables before they can be quantified.</li>
<li><b>Small, purposive samples are appropriate</b> — the research prioritizes depth over breadth, studying a few information-rich cases in detail rather than surveying a large representative population.</li>
<li><b>The context matters</b> — the phenomenon is shaped by its specific social, cultural, organizational, or historical setting, and understanding that context is essential to understanding the findings.</li>
</ul>

<h2>B. Criteria OF a Good Qualitative Study (Trustworthiness)</h2>
<p>Once you have chosen qualitative methods, the quality of the study is evaluated through <b>trustworthiness criteria</b> (Lincoln & Guba), which parallel but differ from quantitative quality standards:</p>
${bb("Credibility (≈ Internal Validity)","The degree to which findings are believable and plausible based on the data collected. Achieved through triangulation (multiple sources/methods), member checking (verifying findings with participants), prolonged engagement in the research setting, and peer debriefing.")}
${bb("Transferability (≈ Generalizability)","The degree to which findings can be applied to other contexts. Achieved not by statistical generalization, but by providing thick description of the research context — detailed enough that readers can judge whether findings apply to their own settings.")}
${bb("Dependability (≈ Reliability)","The degree to which findings are consistent and stable over time and across conditions. Achieved through audit trails that document all research decisions, procedures, and analytical choices so the process can be traced and reviewed.")}
${bb("Confirmability (≈ Objectivity)","The degree to which findings are supported by data and free from researcher bias. Achieved through reflexivity (the researcher examining their own assumptions), transparent documentation, and triangulation.")}
${bb("Relevance","The degree to which the findings address a meaningful research question and contribute to the existing body of knowledge.")}
<p>A robust qualitative study also requires five design components: a focused <b>Research Question</b>, guiding <b>Propositions</b>, clear <b>Boundedness</b> (sample and setting), a <b>Logic Model</b> linking data to propositions, and consideration of <b>Rival Explanations</b>.</p>

<h2>C. When to Suggest Quantitative Instead</h2>
<ul>
<li>The research question asks "how much," "how many," or "what is the statistical relationship between X and Y" — these are measurement questions that require quantitative methods.</li>
<li>The variables are already well-defined with validated measurement instruments available in the literature.</li>
<li>The goal is to produce statistically generalizable results from a large, representative sample.</li>
<li>The researcher wants to test a specific, pre-defined hypothesis (confirmatory research).</li>
<li>The goal is to establish cause-and-effect through experimental design with control groups and random assignment.</li>
</ul>

<h2>D. When to Suggest Mixed Methods Instead</h2>
<ul>
<li>Neither qualitative nor quantitative alone provides a complete picture of the research problem.</li>
<li>Quantitative data shows WHAT is happening, but qualitative data is needed to explain WHY.</li>
<li>The researcher wants to validate or corroborate findings from one method with another (cross-paradigm triangulation).</li>
<li>A new measurement instrument needs to be developed — qualitative exploration discovers the constructs, then quantitative testing validates them at scale.</li>
</ul>`,
deep:`${tbl(["If you need...","Choose...","Because..."],[["Depth, context, 'how/why'","Qualitative","Explores perceptions & meaning"],["Breadth, measurement, 'how much'","Quantitative","Tests hypotheses with stats"],["Both depth AND breadth","Mixed Methods","Comprehensive understanding"],["Explore THEN test","Exploratory Sequential MM","Qual discovers, quant confirms"],["Measure THEN explain","Explanatory Sequential MM","Quant patterns, qual explains"]])}
${tbl(["Qualitative Criteria","Quantitative Criteria"],[["Credibility","Internal Validity"],["Transferability","Generalizability"],["Dependability","Reliability"],["Confirmability","Objectivity"],["Trustworthiness focus","Precision & significance focus"]])}
<h2>Mixed Methods Designs (Know by Name)</h2>
${bb("Convergent Parallel","Collect qual + quant simultaneously, compare side-by-side. Equal weight to both.")}
${bb("Explanatory Sequential","Phase 1: Quant data collection. Phase 2: Qual follow-up to explain quant results.")}
${bb("Exploratory Sequential","Phase 1: Qual exploration. Phase 2: Quant testing of discovered constructs.")}
${bb("Embedded","One method nested within a larger study of the other type.")}
${bb("Transformative","Driven by a social justice or advocacy framework.")}
${bb("Multiphase","Three or more phases combining qual and quant in sequence or concurrently.")}
${ex("In my DBA801 project, I chose quantitative methods (PLS-SEM) because the constructs — Power Distance, Psychological Safety, Job Performance — already had validated scales in the literature, and my goal was to TEST specific hypothesized relationships among 146 respondents. However, the surprising finding that PD positively predicted PS (contradicting Western theory) suggested qualitative follow-up was needed to explain WHY — which led directly to my DBA802 qualitative study. This illustrates when a single method is insufficient.")}
${tip("Structure your answer in the A-B-C-D order above: (A) when to choose qual, (B) what makes a qual study good, (C) when quant instead, (D) when mixed instead. This covers both possible interpretations of the question and shows comprehensive understanding.")}`},

{id:"q1q2",emoji:"💡",label:"Qual: Propositions",group:"part1qual",marks:"",
direct:`${cq('"Should we have propositions/hypotheses for qualitative study? Explain with examples."')}
<p><b>Yes, qualitative studies should include propositions — but they function very differently from hypotheses in quantitative research.</b> Propositions serve as flexible, theory-informed guides that focus the researcher's data collection and analysis without constraining their ability to discover unexpected findings. They provide direction and theoretical grounding while preserving the openness that makes qualitative inquiry valuable.</p>

<h2>The Key Distinction</h2>
<p>A <b>proposition</b> in qualitative research is a conditional statement based on the if-then principle, established before or during the data analysis process. Unlike quantitative hypotheses, propositions are flexible and can evolve as new data emerges. They are tested through thematic analysis, pattern matching, and explanation building rather than statistical methods. For example, a proposition might state: "If team leaders at Gameloft regularly acknowledge their own mistakes in team meetings, then team members will report greater willingness to voice disagreements and raise concerns." This guides the interview protocol and analytical focus, but the researcher remains open to discovering that entirely different factors — such as organizational structure or individual personality — play a more important role.</p>

<p>A <b>hypothesis</b> in quantitative research, by contrast, is a testable statement about the expected relationship between an independent variable and a dependent variable. It is formulated before data collection and remains fixed throughout the study. It is tested using statistical methods such as t-tests, ANOVA, or SEM, and the researcher reports whether the data supports or rejects it. For example: "H1: Leader vulnerability behavior positively predicts team psychological safety (β > 0.30, p < 0.05)." There is no room for revision during data collection — the hypothesis stands or falls based on the statistical evidence.</p>

<p>An <b>assertion</b> is different from both: it is a statement of fact based on evidence established during data collection. Assertions include only facts and contain no predictions or conditional logic. For example: "Five out of six interviewed developers reported feeling uncomfortable raising technical concerns in front of their direct manager."</p>

<h2>Why Propositions Matter in Qualitative Research</h2>
<p>Propositions play several important roles in a well-designed qualitative study. First, they are one of the five essential components of research design, alongside the research question, boundedness (sample and setting), a logic model linking data to propositions, and consideration of rival explanations. Second, they connect the study to existing theory through the logic model, ensuring that the research builds on prior knowledge rather than starting from scratch. Third, they provide analytical focus by directing the researcher's attention toward specific patterns and relationships in the data, while still allowing space for emergent findings that were not anticipated. Fourth, organizing propositions into a Table of Propositions helps systematically map the expected relationships between variables, creating a structured starting point for analysis.</p>

<p>It is worth noting that a qualitative study can proceed without propositions — for instance, in a pure grounded theory approach (tabula rasa), the researcher begins with no preconceived theoretical framework and allows all theory to emerge from the data. However, for most qualitative designs, particularly case studies, having propositions provides essential direction. Without them, the study risks becoming unfocused, collecting irrelevant data, and failing to contribute meaningfully to existing knowledge.</p>`,
deep:`${tbl(["Propositions (Qual)","Hypotheses (Quant)"],[["Conditional if-then statements that guide inquiry","Testable statistical statements about IV-DV relationships"],["Flexible — can evolve as data emerges during analysis","Fixed before data collection, not revised during the study"],["Guide exploratory inquiry and pattern discovery","Drive confirmatory testing of pre-specified relationships"],["Tested through pattern matching, thematic analysis, explanation building","Tested through t-test, ANOVA, regression, SEM"],["Can include descriptions, interpretations, and inferences","Specify precise directional relationships between measurable variables"]])}
<h2>How to Structure This Answer in the Exam</h2>
<p>Open with a clear position: "Yes, qualitative studies should include propositions — but not rigid hypotheses in the quantitative sense." Then explain the distinction between propositions, hypotheses, and assertions using definitions and examples. Give one example of each type using your own research context. Then address the "without propositions" scenario: acknowledge that pure grounded theory can work without them, but explain that for most designs, propositions keep the study focused and theoretically grounded.</p>
${ex("In my DBA802 qualitative study on psychological safety in Vietnamese tech teams, I used propositions to guide my semi-structured interviews. Proposition 1 suggested that dyadic relationships with direct supervisors would be the primary source of psychological safety attribution. This was SUPPORTED by Theme 1 in my findings. However, Theme 3 — individual maturity and personality as moderators of PS perception — was entirely EMERGENT and was not predicted by any proposition. This demonstrates the dual value of propositions: they provide focus and theoretical grounding while still allowing the flexibility to discover unexpected patterns that enrich the study's contribution.")}
<h3>Approaches to Theory in Qualitative Research</h3>
${bb("Tabula Rasa","The researcher begins with a completely blank slate and no preconceived theoretical assumptions. All understanding emerges purely from the data through induction. This is the most extreme form of theory-free qualitative inquiry.")}
${bb("Grounded Theory","Theory is developed systematically from the data through iterative observation, coding, and categorization. The researcher does not start with hypotheses but develops theoretical constructs as patterns emerge from the data.")}
${bb("Proposition-guided (most common in case studies)","The researcher starts with theoretically informed propositions that guide data collection and analysis, but remains open to revising or abandoning them as the data demands. This balances theoretical grounding with empirical flexibility.")}`},

{id:"q1q3",emoji:"⚡",label:"Qual: Key Issues (3/4)",group:"part1qual",marks:"",
direct:`${cq('"Key issues (choose 3/4): triangulation & credibility, generalizability, active interviewing, software."')}<p>Prepare all 4. Note specific angles: triangulation→<b>credibility</b>, interviewing→<b>researcher-participant interaction</b>.</p><h2>1. Triangulation & Credibility</h2><p>Triangulation means cross-validating findings through multiple independent sources. It directly improves <b>credibility</b> — the qualitative parallel to internal validity — because if multiple sources converge on the same conclusion, the finding is more believable than one supported by a single source. It reduces the risk that findings are artifacts of a single method's bias or a single participant's perspective.</p>${bb("Data Triangulation","Using multiple data sources such as interviews from different organizational roles, archival documents, and observation notes to verify findings across contexts.")}${bb("Investigator Triangulation","Having multiple researchers independently analyse the same dataset, reducing the influence of any single researcher's interpretation.")}${bb("Theory Triangulation","Applying multiple theoretical frameworks to the same data to examine whether different lenses yield consistent or complementary insights.")}${bb("Method Triangulation","Using multiple research methods such as interviews, surveys, and observation to study the same phenomenon from different angles.")}<p>Triangulation is considered more important in qualitative research than quantitative research because qualitative data collection methods are inherently less structured and more subjective. In quantitative research, standardized instruments and statistical tests establish validity. In qualitative research, triangulation compensates for this subjectivity by cross-validating through multiple angles.</p><h2>2. Limits of Generalizability</h2><p>Generalizability — the extent to which findings can be applied to a larger population beyond the sample studied — is a persistent challenge in qualitative research. This difficulty arises from several inherent characteristics. Qualitative studies typically use small, purposive samples selected for depth rather than representativeness, which limits statistical generalization. The sampling is non-random, meaning participants are chosen based on specific criteria rather than chance. Findings tend to be context-specific, shaped by the unique demographic, cultural, and organizational characteristics of the setting. Additionally, researcher subjectivity in interpretation introduces personal bias that can limit universality.</p><p>Rather than claiming generalizability, qualitative researchers should aim for <b>transferability</b> by providing thick descriptions of the research context, enabling readers to judge whether findings apply to their own settings. Comprehensive sampling from varied groups and explicit acknowledgment of limitations also strengthen the study's contribution.</p><h2>3. Active Interviewing & Researcher-Participant Interaction</h2><p>Active interviewing is an approach that emphasizes engaging the interviewee in genuine, dynamic conversation rather than mechanically asking a fixed set of predetermined questions. The interviewer uses open-ended questions, follow-up probes, and authentic curiosity to encourage participants to share deeper thoughts, reflections, and experiences. This involves both actively probing — asking spontaneous follow-up questions — and passively asking predetermined questions for consistency.</p><p>Active interviewing is helpful because it produces more honest, detailed, and nuanced responses than structured interviews. By demonstrating genuine interest, the interviewer builds rapport and trust, creating a psychologically safe environment where participants feel comfortable sharing openly. This captures richness and complexity that standardized instruments miss.</p><p>However, active interviewing introduces several challenges. There is a risk of inadvertently leading the interviewee toward particular responses. The approach requires strong interviewing skills not all researchers possess. It is harder to standardize across multiple interviews, which can introduce inconsistencies. The interviewer's own biases can influence the conversation direction. Finally, active interviews are significantly more time-consuming to conduct and analyse.</p><h2>4. Qualitative Data Software</h2><p>Qualitative research software such as NVivo assists researchers in managing and analysing large volumes of qualitative data that would be unwieldy to handle manually. These tools allow researchers to organize data efficiently by inputting, categorizing, searching, and retrieving transcripts and documents in a structured database. They support systematic analysis by providing tools for coding data segments, identifying patterns and themes, and visualizing relationships between codes. They enable collaboration by allowing multiple researchers to work simultaneously, which is particularly valuable for investigator triangulation. They save time by automating repetitive tasks such as coding frequency counts and categorization. Other tools include Word Cloud for visual text summaries, Text Analytics for AI-powered pattern detection, and Computer Vision and Video Analyzer for non-text data sources.</p>`,
deep:`${ex("In my DBA802 study, I used data triangulation (participants from multinational Gameloft and local studios) and method triangulation (semi-structured interviews combined with contact sheets and a think display matrix). Theme 7 — face-saving creating a private-public safety differential — was validated across multiple participants from different organizational contexts, strengthening its credibility.")}${ex("My DBA802 study had 6 participants — clearly not generalizable to all tech companies. However, the thick descriptions of Vietnamese hierarchical culture, face-saving norms, and game development workflows enable readers in similar settings to judge transferability to their own contexts.")}<h2>When Triangulation Reveals Contradictions</h2><p>Contradictions across sources are not a failure — they are analytically valuable. Report them transparently, explore the reasons (power dynamics, different perspectives, contextual differences), and discuss implications. This shows analytical sophistication rather than a methodological flaw.</p><h2>Active Interviewing: The Three Phases</h2>${bb("Building Rapport","Establish a genuine connection and put the participant at ease before diving into substantive questions.")}${bb("Main Questions","Conduct the core inquiry with active probing, following up on unexpected or rich responses to explore them in depth.")}${bb("Closing","Conclude positively, allow the participant to share any final thoughts, and leave a good impression for potential follow-up.")}${tip("The confirmed question links triangulation to 'credibility' and active interviewing to 'researcher-participant interaction' — tailor your answers specifically to these angles rather than giving generic definitions.")}`},

{id:"q1q4",emoji:"📊",label:"Quant: RQ + Rationale",group:"part1quant",marks:"",
direct:`${cq('"Set up the research question and rationale."')}
<h2>Research Question</h2>
<p>The main research question for this study is: <em>"How do social media marketing dimensions — specifically interaction, customisation, and trendiness — influence consumers' repurchase intention toward high-tech brands?"</em></p>

<p>This main question is supported by several sub-questions that decompose the overall relationship into testable components. First, to what extent does the level of social media interaction between brands and consumers predict consumers' repurchase intention? Second, how does the degree of customisation in social media content relate to consumers' willingness to repurchase? Third, what role does the perceived trendiness of a brand's social media presence play in driving repurchase intention? Fourth, do demographic factors such as gender, age, education level, income, and prior social media use moderate these relationships?</p>

<h2>Rationale</h2>
<p>This study is justified on practical, academic, and methodological grounds. From a practical perspective, high-tech brands invest significant marketing budgets in social media, yet most lack evidence-based guidance on which specific dimensions of social media marketing are most effective at driving repeat purchases. Understanding the relative contribution of interaction versus customisation versus trendiness would allow marketing managers to allocate resources more efficiently, focusing investment on the dimensions that demonstrably influence consumer behavior rather than spreading budgets evenly across all social media activities.</p>

<p>From an academic perspective, the study extends existing social media marketing literature in two important ways. First, it decomposes the broad concept of "social media marketing" into three specific, measurable dimensions rather than treating social media as a monolithic construct. This granularity provides a more nuanced understanding of which aspects of social media actually matter for consumer behavior. Second, it tests these relationships specifically in the high-tech brand context, where purchase decisions tend to be higher-involvement and more information-driven than in other consumer categories, potentially yielding different dynamics.</p>

<p>From a methodological perspective, the study uses validated Likert-scale measures for all key constructs and includes demographic variables as controls, enabling a rigorous quantitative analysis that accounts for potential confounding factors. This design supports both hypothesis testing and practical recommendations.</p>`,
deep:`<h2>Characteristics of a Good Research Question</h2>
<p>A well-formulated research question should meet five criteria. It should be <b>feasible</b> — answerable within the available time, resources, and data. It should be <b>interesting</b> — addressing a question that stakeholders and the academic community genuinely care about. It should be <b>novel</b> — contributing something new rather than replicating existing findings without extension. It should be <b>ethical</b> — investigable without causing harm to participants. And it should be <b>relevant</b> — having practical implications for the industry or field being studied.</p>
${tip("The framing of the RQ matters. 'How do [IVs] influence [DV]' signals quantitative methods because it asks about measurable relationships. If the question were instead 'How do consumers experience social media marketing from high-tech brands,' the 'experience' framing would signal qualitative methods. Pay attention to this distinction in the exam.")}`},

{id:"q1q5",emoji:"🔬",label:"Quant: Analysis Method",group:"part1quant",marks:"",
direct:`${cq('"How to analyse the relationship between interaction, customisation and trendiness on repurchase intention? What method?"')}

<h2>Step 1: Classify the Variables</h2>
<p>Before selecting a method, we must first classify each variable in the dataset. The dependent variable is repurchase intention, measured on a Likert scale and treated as continuous. The three independent variables — interaction, customisation, and trendiness — are each measured as Likert-scale scores and treated as continuous. The dataset also contains demographic variables: gender (binary categorical), age (continuous or grouped), education (ordinal categorical), income (continuous), and prior social media use (binary or continuous). This classification drives the choice of analytical method.</p>

<h2>Step 2: Primary Analysis — Multiple Regression (All Three IVs Simultaneously)</h2>
<p>The most appropriate primary method is <b>multiple regression</b>, because we have one continuous dependent variable (repurchase intention) and three continuous independent variables (interaction, customisation, trendiness) that we want to test simultaneously. Multiple regression is the correct choice here because it reveals each variable's <b>unique contribution</b> to repurchase intention while controlling for the effects of the other two predictors. This is critical — if we tested each variable separately, the coefficients would be inflated by shared variance between the correlated predictors, leading to misleading conclusions about which dimensions actually matter.</p>

<p>The regression model takes the form:</p>
<p><b>Repurchase Intention = β₀ + β₁(Interaction) + β₂(Customisation) + β₃(Trendiness) + ε</b></p>

<p>Before running the model, four key assumptions must be checked. First, <b>linearity</b> — the relationship between each IV and the DV should be approximately linear, assessed through scatterplots. Second, <b>normality of residuals</b> — the errors should be approximately normally distributed, checked via a histogram or Q-Q plot of residuals. Third, <b>homoscedasticity</b> — the variance of residuals should be constant across predicted values, assessed through a residuals-versus-fitted plot. Fourth, <b>absence of multicollinearity</b> — the three IVs should not be too highly correlated with each other, checked using the Variance Inflation Factor (VIF), which should remain below 10 for each predictor.</p>

<p>After running the model, the output is interpreted as follows. The <b>R-squared</b> value indicates the proportion of variance in repurchase intention that is collectively explained by the three social media dimensions — for example, an R² of 0.42 would mean the three dimensions explain 42% of the variation in repurchase intention. Each <b>coefficient B</b> is interpreted using the standard template: "For every one-unit increase in interaction, repurchase intention increases by [B] units, holding customisation and trendiness constant." The <b>p-value</b> for each coefficient indicates whether the relationship is statistically significant at the 0.05 level. The <b>95% confidence interval</b> should be examined — if it includes zero, the variable is not significant. Crucially, all three variables must be discussed in the output, including any that are not statistically significant. For a non-significant variable, explicitly state: "Trendiness is NOT statistically significant (p = 0.14 > 0.05). We cannot conclude that trendiness has a meaningful unique effect on repurchase intention in this model. The 95% confidence interval includes zero, confirming the lack of significance."</p>

<p>The three hypotheses to be tested are: <b>H1:</b> Social media interaction has a positive effect on consumers' repurchase intention. <b>H2:</b> Social media customisation has a positive effect on repurchase intention. <b>H3:</b> Social media trendiness has a positive effect on repurchase intention.</p>

<h2>Step 3: Supplementary Analysis — Testing Individual Variables</h2>
<p>In addition to the simultaneous model, individual analyses can be conducted to examine each variable's total (unadjusted) effect and to test demographic variables that are not continuous.</p>

<h3>Individual Effects of Each SM Dimension → Simple Regression</h3>
<p>Each social media dimension can be tested individually using simple linear regression — for example, RI = β₀ + β₁(Interaction) + ε. The coefficient β₁ here represents the <b>total bivariate effect</b> of interaction on repurchase intention, which may be larger than the multiple regression coefficient because it includes shared variance with the other predictors. Comparing the simple regression coefficient with the multiple regression coefficient for the same variable is analytically useful: if the simple regression β is much larger than the multiple regression β, it suggests that part of the variable's apparent effect is actually explained by its correlation with the other predictors. This comparison helps distinguish direct effects from confounded effects. The same simple regression procedure would be repeated separately for customisation and trendiness.</p>

<h3>Gender (Binary) → Independent Samples t-test</h3>
<p>To test whether repurchase intention differs between male and female consumers, an independent samples t-test is the appropriate method because gender is a binary categorical variable and the DV is continuous. The null hypothesis states no significant difference in mean repurchase intention between genders. Check normality (Shapiro-Wilk) and homogeneity of variances (Levene's test); if assumptions are violated, use the non-parametric Mann-Whitney U test. This is covered in more detail in the Gender Impact card.</p>

<h3>Education or Age Group (3+ Categories) → One-way ANOVA</h3>
<p>For demographic variables with three or more categories — such as education level (high school / some college / college graduate) or age group — a one-way ANOVA compares mean repurchase intention across the groups. If the ANOVA F-test is significant (p < 0.05), post-hoc tests such as Tukey's HSD identify which specific pairs of groups differ significantly from each other. Assumptions of normality and homogeneity of variances should be checked; if violated, the Kruskal-Wallis non-parametric test is the alternative.</p>

<h2>Step 4: Extended Model — Adding Demographic Controls</h2>
<p>For a more rigorous analysis, the multiple regression model can be extended to include demographic variables as control variables, isolating the effect of the social media dimensions after accounting for demographic differences:</p>
<p><b>RI = β₀ + β₁(Interaction) + β₂(Customisation) + β₃(Trendiness) + β₄(Gender) + β₅(Age) + β₆(Income) + β₇(Education) + β₈(Prior SM Use) + ε</b></p>
<p>Gender and prior SM use would be entered as dummy-coded variables (0/1). Education could be entered as dummy variables for each level or as an ordinal numeric variable. This extended model reveals whether the social media dimensions remain significant after controlling for demographics, which strengthens the validity of the findings. If, for example, interaction is significant in the simple model but loses significance after adding demographic controls, it suggests the effect was partially confounded by demographic differences rather than being a true direct effect of interaction.</p>`,

deep:`
<h2>What If the Variables Have Multiple Items? → SEM (SmartPLS)</h2>
<p>If the case description indicates that each construct is measured by multiple Likert items (e.g., "interaction is captured through four survey questions"), then Structural Equation Modeling via SmartPLS becomes the superior method over multiple regression. SEM is preferred in this scenario because it simultaneously validates the measurement model (confirming items represent their intended constructs) and tests the structural model (the hypothesized paths between constructs). The analysis involves assessing factor loadings (≥ 0.707), Cronbach's alpha (≥ 0.707), AVE for convergent validity, and the Fornell-Larcker criterion for discriminant validity in the outer model, then examining path coefficients, VIF (< 3), and bootstrapped p-values in the inner model. SEM also handles measurement error explicitly — it accounts for the fact that individual survey items are imperfect measures of the underlying construct, whereas regression assumes composite scores are measured without error.</p>
${tip("Read the case carefully for cues. If it says 'interaction is measured by 4 items' or 'each construct has multiple indicators' → SEM. If it gives a single score per variable or does not specify multiple items → multiple regression is the safe default. When in doubt, recommend multiple regression as primary and mention SEM as the stronger alternative if multiple items are available.")}

<h2>Why Multiple Regression Over Individual Regressions?</h2>
<p>Running three separate simple regressions (one per IV) is the weakest analytical choice because it does NOT control for shared variance between the predictors. If interaction and customisation are correlated (which they almost certainly are), the simple regression coefficient for interaction includes the portion of its effect that overlaps with customisation — producing an inflated and misleading estimate. Multiple regression solves this by estimating each variable's unique effect after partialling out the others. Additionally, running three separate tests inflates the Type I error rate (more tests = more chances of false positives). The simultaneous model is always preferable as the primary analysis; individual regressions are useful only as supplementary exploration to compare total vs. unique effects.</p>

<h2>Full Method Reference with Worked Examples</h2>
${tbl(["Scenario","Method","When to Use"],[
["Compare 2 group means","Independent t-test","Binary IV, continuous DV"],
["Compare 3+ group means on 1 IV","One-way ANOVA","Categorical IV (3+), continuous DV"],
["Compare groups on 2+ IVs simultaneously","Factorial ANOVA","2+ categorical IVs, continuous DV"],
["Predict DV from 1 continuous IV","Simple Regression","1 continuous IV, continuous DV"],
["Predict DV from multiple IVs","Multiple Regression","Multiple continuous IVs, continuous DV"],
["Test constructs with multiple indicators","SEM (SmartPLS)","Latent constructs, multiple items per construct"],
["Predict binary outcome","Logistic Regression","Binary DV, mixed IVs"],
["Compare groups on multiple DVs","MANOVA","Categorical IV, multiple continuous DVs"],
["Test association between 2 categoricals","Chi-Square","Both variables truly categorical"],
["Reduce many variables to fewer constructs","Factor Analysis","Many observed variables → latent factors"]])}

<h2>Factorial ANOVA</h2>
<p>Factorial ANOVA extends one-way ANOVA by testing the effects of two or more categorical independent variables on a continuous dependent variable simultaneously, including their interaction effects. For this case study, suppose the researcher wants to examine whether repurchase intention differs by both gender (male/female) and education level (high school / some college / college graduate) and whether these two factors interact. A 2×3 factorial ANOVA would test three effects: the main effect of gender on RI, the main effect of education on RI, and the interaction effect of gender × education — that is, whether the effect of education on RI differs depending on gender. The researcher reports the F-statistic and p-value for each effect. A significant interaction (p < 0.05) would mean that the education-RI relationship is stronger for one gender than the other. The advantage over running separate one-way ANOVAs is the ability to detect interaction effects that would be invisible in single-factor analyses.</p>

<h2>Chi-Square Test of Independence</h2>
<p>The chi-square test examines whether there is a statistically significant association between two categorical variables. For example, the researcher might test whether there is an association between gender (male/female) and prior social media use (yes/no). The test compares observed frequencies in a cross-tabulation table against expected frequencies under independence. If the chi-square statistic yields p < 0.05, an association exists. <b>Important:</b> chi-square is appropriate only when both variables are truly categorical. It should NOT be used when either variable is measured on a Likert scale, because chi-square ignores the ordered nature of ordinal data. For comparing groups on Likert-scale outcomes, ANOVA or Kruskal-Wallis are more appropriate.</p>

<h2>Logistic Regression</h2>
<p>Logistic regression is used when the dependent variable is binary rather than continuous. If the study recoded repurchase intention into a binary variable — "likely to repurchase" (scored 4-5) vs. "unlikely" (scored 1-3) — logistic regression models the probability of the outcome: log(p/(1-p)) = β₀ + β₁(Interaction) + β₂(Customisation) + β₃(Trendiness). The output produces odds ratios — an OR of 1.5 for interaction means a one-unit increase raises the odds of repurchasing by 50%. Model fit is assessed using AIC (lower = better) rather than R-squared.</p>

<h2>MANOVA</h2>
<p>MANOVA tests whether a categorical IV affects multiple continuous DVs simultaneously. If the researcher wanted to test whether gender affects both repurchase intention AND brand loyalty at once, MANOVA calculates Wilks' Lambda to test for an overall difference. The advantage over separate ANOVAs is controlling the Type I error rate and detecting multivariate patterns individual tests would miss.</p>

<h2>Factor Analysis</h2>
<p>Factor analysis identifies underlying latent constructs from many observed variables. If the survey has 15 Likert items for three constructs, factor analysis confirms whether items cluster into the expected factors. Loadings ≥ 0.707 indicate strong association. This is typically a preliminary step before SEM to validate the measurement model. In DBA801, it is integral to the SmartPLS workflow.</p>

<h2>DBA801 Thresholds Quick Reference</h2>
${bb("Factor Loading","≥ 0.707 — at least 50% shared variance with the construct")}
${bb("Cronbach's Alpha","≥ 0.707 — acceptable internal consistency")}
${bb("VIF","< 3 for SEM (SmartPLS) / < 10 for standard regression")}
${bb("AVE","Average Variance Extracted — convergent validity")}
${bb("Fornell-Larcker","√AVE of each construct must exceed its correlations with other constructs")}

<h2>Regression Interpretation Template</h2>
<p><em>"For every one-unit increase in [IV], the [DV] [increases/decreases] by [B] units, holding all other variables constant. This relationship is [statistically significant / not statistically significant] at the 0.05 level (p = [value]). The 95% confidence interval is [lower, upper], which [does / does not] include zero, [confirming / confirming the lack of] significance."</em></p>
${tip("Always address ALL variables in the output — including non-significant ones. Ignoring them is a common exam mistake. For non-significant variables, explicitly state the p-value, note it exceeds 0.05, and state the CI includes zero.")}
${tip("FIRST classify each variable: continuous, ordinal, nominal, binary. Write this as a quick table in your answer before selecting methods. This demonstrates systematic thinking and prevents errors.")}`},

{id:"q1q6",emoji:"👫",label:"Quant: Gender Impact",group:"part1quant",marks:"",
direct:`${cq('"If you want to understand if gender impacts repurchase intention, what steps? What variables?"')}
<h2>Step 1: Identify the Variables</h2>
<p>The first step is to clearly identify the variables involved. The dependent variable is repurchase intention, which is measured on a continuous Likert scale. The independent variable is gender, which is a categorical variable with two groups (male and female). This variable classification determines the appropriate statistical method.</p>

<h2>Step 2: Choose the Appropriate Method</h2>
<p>Because we are comparing the means of a continuous dependent variable across exactly two groups of a categorical independent variable, the appropriate primary method is the <b>independent samples t-test</b>. The t-test will determine whether there is a statistically significant difference in mean repurchase intention between male and female consumers. The null hypothesis (H0) states that there is no significant difference in repurchase intention between male and female consumers. The alternative hypothesis (H1) states that a significant difference exists between the two groups.</p>

<h2>Step 3: Check Assumptions Before Running the Test</h2>
<p>Before interpreting the t-test results, the researcher must verify that the underlying assumptions are met. The first assumption is normality — the distribution of repurchase intention scores within each gender group should be approximately normal, which can be assessed using the Shapiro-Wilk test or visual inspection of histograms and Q-Q plots. The second assumption is homogeneity of variances — the variance of repurchase intention should be similar across both groups, which is tested using Levene's test. If either assumption is violated, the researcher should use the non-parametric alternative, the Mann-Whitney U test, which does not require normality or equal variances.</p>

<h2>Step 4: Run the Analysis and Interpret Results</h2>
<p>After confirming assumptions, the researcher runs the t-test and interprets the output. The key elements to report are the mean repurchase intention for each group (males vs. females), the t-statistic, the degrees of freedom, and the p-value. If the p-value is less than 0.05, the researcher rejects the null hypothesis and concludes that gender has a statistically significant impact on repurchase intention. If the p-value is 0.05 or greater, the researcher retains the null hypothesis and concludes that no significant gender difference was found in repurchase intention.</p>

<h2>Step 5: Advanced Analysis (Demonstrating Depth)</h2>
<p>To demonstrate deeper methodological understanding, the researcher can extend the analysis in two ways. First, gender can be included as a dummy-coded variable (0 = male, 1 = female) in the multiple regression model from Q2, which tests gender's effect on repurchase intention while simultaneously controlling for interaction, customisation, and trendiness. This isolates gender's unique contribution beyond the social media dimensions. Second, the researcher can test gender as a moderating variable by creating interaction terms (for example, Gender × Interaction) and including them in the regression model. If the interaction term is statistically significant, it indicates that gender changes the strength or direction of the social media effect — for instance, that interaction matters more for female consumers than male consumers.</p>

<h2>Variables to Use</h2>
<p>The primary analysis uses repurchase intention (DV) and gender (IV). For the advanced regression extension, the researcher would additionally include interaction, customisation, and trendiness as predictors, and could include other demographic variables — age, education, income, and prior social media use — as control variables to isolate gender's unique effect.</p>`,
deep:`${tip("The question explicitly asks 'what steps to take' — so literally number your steps and walk through each one procedurally. This demonstrates that you know not just the theory but the actual process of conducting the analysis. Procedural competence is what separates strong answers from merely adequate ones.")}
<h2>Why t-test and Not Other Methods?</h2>
<p>The t-test is the correct choice because there are exactly two groups (male/female) and the DV is continuous. If gender had three or more categories (e.g., male, female, non-binary), ANOVA would be appropriate instead. Chi-square would be incorrect here because it tests associations between two categorical variables, and repurchase intention is measured on a Likert scale (treated as continuous), not as a categorical variable. ANOVA with two groups would produce identical results to the t-test but is considered overkill for a simple two-group comparison — the t-test is the more parsimonious and appropriate choice.</p>
<h2>Moderation Testing (Bonus Points)</h2>
<p>To test whether gender moderates the relationship between social media dimensions and repurchase intention, the model would take the form: RI = β₀ + β₁(Interaction) + β₂(Gender) + β₃(Interaction × Gender) + ε. If β₃ is statistically significant, it means gender changes the strength of the interaction-to-RI relationship. For example, a significant positive β₃ would suggest that social media interaction has a stronger effect on repurchase intention for one gender than the other. This type of moderation analysis goes beyond what the question asks but demonstrates advanced methodological thinking.</p>`},

{id:"q1q7",emoji:"⚠️",label:"Quant: Limitations",group:"part1quant",marks:"",
direct:`${cq('"Limitations to keep in mind?"')}${bb("1. No Causation","This is a cross-sectional survey design, which means we can only observe correlations between variables, not establish causal relationships. We cannot conclude that social media interaction causes repurchase intention; only that they are associated. A longitudinal design tracking the same consumers over time would be needed for causal claims.")}${bb("2. Self-Report Bias","All data is self-reported via surveys, meaning respondents may overstate their social media engagement or their intention to repurchase to appear socially desirable. This can be mitigated by ensuring anonymity, using indirect questioning techniques, and where possible triangulating with behavioral data such as actual purchase records.")}${bb("3. Common Method Bias","Both the independent variables and the dependent variable are measured using the same instrument (Likert scales within the same survey), which creates a risk that shared method variance artificially inflates the observed correlations. This can be mitigated by conducting Harman's single-factor test or by including a marker variable.")}${bb("4. Likert Scale Limitations","Likert scales are technically ordinal rather than truly interval, meaning the distance between response options may not be equal. Treating them as continuous in regression or SEM assumes equal intervals, which may not hold. This assumption should be acknowledged, and robust estimation methods should be considered.")}${bb("5. Sample Representativeness","If the sample is recruited from a single platform or a narrow demographic, the findings may not generalize to all consumers of high-tech brands. This can be mitigated by using random or stratified sampling techniques and reporting the full demographic breakdown.")}${bb("6. Confounders","Other factors not included in the model — such as brand loyalty, price sensitivity, product quality, or competitor activity — may influence repurchase intention and could explain some observed relationships. This can be mitigated by including relevant control variables and explicitly acknowledging unmeasured confounders.")}${bb("7. Multicollinearity","The three social media dimensions (interaction, customisation, trendiness) may be highly correlated with each other, making it difficult to isolate each dimension's unique effect. This can be detected by checking VIF values (below 3 for SEM or below 10 for standard regression) and addressed through factor analysis to confirm distinct constructs.")}`,
deep:`${tip('The template for every limitation: "While [limitation] may affect [what], we mitigate by [action]." Always pair limitations with mitigations — this was confirmed as a key differentiator between good and great answers.')}<p>Note that chi-square is suboptimal for Likert-scale (ordinal) data. If comparing groups on Likert variables, ANOVA or non-parametric alternatives like Kruskal-Wallis are more appropriate. Mentioning this distinction demonstrates methodological sophistication.</p>`},

{id:"p2q1",emoji:"🏢",label:"P2 Q1: Significance",group:"part2",marks:"10",
direct:`${cq("Significance of the study — company, industry, public. (10 marks)")}
<h2>Significance for Globex Corporation</h2>
<p>This study holds immediate strategic value for Globex Corporation. The company's Silicon Valley fabrication plant has incurred over USD 1.75 million in EPA fines in the past fiscal year alone, with private litigation adding roughly twice that amount — meaning environmental non-compliance is already costing the company over USD 5 million annually. Simultaneously, investors are migrating away from corporations lacking environmental and social principles, and Globex's stock value has declined over the past three years while competitors with visible sustainability programs have experienced investment growth. CEO Damian Wong has articulated the ambition to "broaden Globex's green influence and drive the industry towards low-carbon sustainability," but the company currently lacks empirical evidence about which specific sustainability initiatives — whether developing a sustainability plan, communicating goals to stakeholders, or pursuing costly third-party ESG certification — would most effectively reverse these trends. This study provides that evidence, enabling Globex's leadership to make data-driven decisions about where to invest its sustainability resources for maximum impact on investor confidence and regulatory risk reduction.</p>

<h2>Significance for the Semiconductor Industry</h2>
<p>The semiconductor industry is under increasing scrutiny because of its enormous environmental footprint — fabrication plants consume millions of gallons of water daily and produce hazardous waste. As demand for silicon chips surges (embedded in everything from smartphones to wind turbines), the industry faces a fundamental tension between growth and sustainability. Globex's situation is not unique; semiconductor firms globally face similar pressures from regulators, investors, and downstream customers keen to report clean supply chains. This study establishes industry-specific benchmarks for evaluating the effectiveness of different sustainability approaches, providing a evidence-based framework that other semiconductor manufacturers can adapt to their own contexts.</p>

<h2>Significance for the Academic and Public Community</h2>
<p>From an academic perspective, most existing research on CSR and investor behavior has focused on service industries or general corporate settings. This study extends that knowledge to capital-intensive, high-carbon-footprint manufacturing, where the stakes are qualitatively different — environmental liabilities run into millions of dollars, and the cost of ESG certification (up to 25% of annual net profits, per the case) represents a substantial resource commitment that demands rigorous evaluation. The study also contributes to policy discussions about the effectiveness of EPA enforcement as a driver of corporate sustainability and whether market-based mechanisms (investor pressure) or regulatory mechanisms (fines) are more powerful motivators for environmental responsibility.</p>`,
deep:`${tip("Always address all three audiences — company, industry, academic/public. Use specific case numbers ($1.75M fine, 25% net profit for ESG) to show you read the case carefully.")}`},

{id:"p2q2",emoji:"🎯",label:"P2 Q2: RQ + Variables",group:"part2",marks:"20",
direct:`${cq("Research problem, research question — variables included. (20 marks)")}
<h2>Research Problem</h2>
<p>Globex Corporation, a global leader in silicon-encapsulated microcircuits and semiconductors based in Silicon Valley, faces a compounding strategic crisis driven by two converging forces. On the regulatory front, the company's fabrication plant — which consumes millions of gallons of water daily and generates hazardous waste — has incurred USD 1.75 million in EPA fines in the past fiscal year, with private litigation adding approximately USD 3.5 million more. On the investor relations front, stock values have declined over the past three years as investors increasingly divest from companies lacking environmental and social commitments, while competitors with visible CSR programs have captured investment growth. CEO Damian Wong has commissioned this research to evaluate potential courses of action aimed at reducing the risk of continued profit loss from shrinking investments and rising EPA penalties.</p>

<p>The case identifies two specific courses of action to evaluate. First, the development of a sustainability plan and set of goals, with research into the impact of communicating these goals to stakeholders on investment behavior and regulatory exposure. Second, the pursuit of third-party ESG certification, which would validate the organization's commitment to sustainable and ethical practices but represents a significant resource commitment — up to 25% of annual net profits. The core research problem is that Globex currently lacks empirical evidence about whether and how these sustainability initiatives translate into measurable improvements in investor confidence and regulatory risk reduction, making it impossible to conduct a rational cost-benefit analysis of these investments.</p>

<h2>Research Questions</h2>
<p>The main research question is: <em>"To what extent do sustainability initiatives — specifically sustainability goal communication and third-party ESG certification — influence investor confidence and reduce regulatory risk for semiconductor manufacturers?"</em></p>

<p>This is supported by the following sub-questions: (1) What is the relationship between communicating sustainability goals to stakeholders and changes in investor confidence and investment behavior? (2) Does third-party ESG certification have a measurable effect on perceived regulatory risk and investor willingness to invest? (3) Do the potential benefits of ESG certification outweigh the substantial costs (up to 25% of net profits) in terms of reduced penalties and restored investment? (4) How do firm-level characteristics (size, regulatory history, current ESG standing) moderate the effectiveness of these initiatives?</p>

<h2>Variables</h2>
${tbl(["Variable","Type","Role","Measurement"],[
["Sustainability goal communication","Likert scale","IV","Perceived clarity, ambition, and visibility of communicated sustainability goals"],
["ESG certification status","Binary / ordinal","IV","Whether the firm holds third-party ESG certification, and at what level"],
["Investor confidence","Likert scale","DV","Investment willingness, perceived trustworthiness, forward-looking stock sentiment"],
["Perceived regulatory risk","Likert scale","DV","Anticipated EPA penalties, compliance burden, litigation risk exposure"],
["Investment behavior change","Ordinal","DV","Reported changes in portfolio allocation toward/away from the firm"],
["ESG certification cost","Continuous","Context variable","Percentage of net profits allocated to certification (up to 25%)"],
["Firm size","Continuous","Moderator","Revenue or market capitalization"],
["Regulatory penalty history","Continuous","Control","Total EPA fines + litigation costs in past 3 years"],
["Competitor ESG standing","Ordinal","Control","Relative ESG positioning vs. industry peers"]])}

<h2>Hypotheses</h2>
<p>H1: Communication of a clear sustainability plan and goals has a positive effect on investor confidence. H2: Third-party ESG certification reduces perceived regulatory risk among institutional investors. H3: The positive effect of ESG certification on investor confidence is moderated by firm size, such that larger firms benefit more from the signaling effect. H4: For firms with high recent regulatory penalties (like Globex), the effect of sustainability initiatives on investor confidence is stronger than for firms with clean compliance records, because the perceived improvement signal is more dramatic.</p>`,
deep:`${tip("Use specific case details in your answer: $1.75M EPA fines, $3.5M litigation, 25% net profit cost for ESG, CEO Damian Wong. Shows you read the case thoroughly and are tailoring your design to the actual problem, not giving a generic template.")}`},

{id:"p2q3",emoji:"📚",label:"P2 Q3: Literature",group:"part2",marks:"20",
direct:`${cq("Potential sources of relevant literature — sub-topics to organise the review. (20 marks)")}
<p>The literature review should be organized around six key sub-topics, each contributing a distinct theoretical and empirical layer to the research design. Together, these sub-topics ground the conceptual model, inform variable operationalization, and identify the gaps that justify this study's contribution.</p>

<h2>Sub-Topic 1: Corporate Social Responsibility and Stakeholder Communication</h2>
<p>This section reviews the theoretical foundations of CSR, drawing on Carroll's CSR pyramid and stakeholder theory to frame why and how corporations communicate sustainability commitments. Given that one of Globex's courses of action is developing and communicating a sustainability plan, the review should examine the literature on CSR signaling — how stakeholders perceive and respond to public sustainability commitments. Do communicated goals change investor behavior, or are they dismissed as "greenwashing" without substantive action? The section should also examine the conditions under which CSR communication is most credible — for instance, whether specificity and measurability of goals matters more than aspirational language.</p>

<h2>Sub-Topic 2: ESG Certification and Third-Party Validation</h2>
<p>This section covers the rapidly growing field of ESG certification — the standards, processes, costs, and benefits of third-party environmental, social, and governance validation. The case specifies that ESG certification could cost Globex up to 25% of its annual net profits, making this a high-stakes investment decision. The review should examine whether ESG certification provides a credible signal that goes beyond self-reported CSR claims, how institutional investors weight certified versus self-declared ESG commitments, and what the empirical evidence says about the financial returns on ESG certification investment in manufacturing sectors.</p>

<h2>Sub-Topic 3: Investor Confidence and ESG-Driven Investment Behavior</h2>
<p>This section examines what drives investor confidence, how investors incorporate ESG information into their decision-making, and the growing trend of ESG-motivated divestment. The case notes that investors are already moving away from corporations without environmental principles, and competitors with CSR programs have seen investment growth. The literature should cover the mechanisms through which ESG information affects portfolio allocation, whether ESG creates a valuation premium or reduces perceived risk, and how the strength of the effect varies by investor type (institutional vs. retail, ESG-mandated vs. discretionary).</p>

<h2>Sub-Topic 4: Regulatory Risk, EPA Enforcement, and Compliance Costs</h2>
<p>This section reviews the regulatory landscape specific to semiconductor manufacturing in the United States, including EPA enforcement mechanisms, fine structures, and private litigation costs. Globex has faced $1.75M in EPA fines and approximately $3.5M in private litigation — the review should contextualize whether these amounts are typical for the industry, whether they are escalating, and how firms that have successfully reduced their regulatory burden did so. The literature on regulatory risk perception among investors is also relevant — do investors treat EPA fines as one-time events or as signals of systemic governance failure?</p>

<h2>Sub-Topic 5: Sustainability in Semiconductor Manufacturing</h2>
<p>This section provides operational context specific to the semiconductor industry. Fabrication plants consume enormous quantities of water and energy while producing hazardous chemical waste. The review should cover existing sustainability strategies in semiconductor manufacturing — water recycling, renewable energy adoption, chemical waste reduction, and carbon offset programs. Understanding what practical sustainability looks like in this context is essential for designing realistic survey instruments and interview questions that resonate with both industry executives and investors familiar with the sector.</p>

<h2>Sub-Topic 6: Cost-Benefit Analysis of Sustainability Investments</h2>
<p>Given that the case explicitly frames ESG certification as costing up to 25% of net profits and asks whether benefits outweigh costs, the review should examine the literature on return on sustainability investment (ROSI). This includes studies that quantify the financial returns from reduced regulatory penalties, lower cost of capital, improved brand value, and increased investor willingness to pay a premium for sustainable firms. The review should also cover frameworks for evaluating sustainability investments under uncertainty, since the benefits are probabilistic rather than guaranteed.</p>

<h2>What the Literature Review Informs</h2>
<p>The literature review directly informs the conceptual model by identifying which variables to include and what relationships to hypothesize. It guides the operationalization of each construct by pointing to validated measurement instruments. It grounds the hypotheses in existing empirical evidence. It identifies control variables and moderators. And critically, it reveals the gap that this study fills: limited empirical research on the effectiveness of sustainability initiatives specifically in high-carbon semiconductor manufacturing, where both the environmental footprint and the investment costs are qualitatively different from other sectors.</p>`,
deep:`${tip("Reference case-specific details in your lit review framing: the $1.75M EPA fines, the 25% net profit ESG cost, the water/waste challenges unique to semiconductor fabrication. This shows you are tailoring the review to the actual problem, not giving generic sub-topics.")}`},

{id:"p2q4",emoji:"🧪",label:"P2 Q4: Research Design",group:"part2",marks:"20",
direct:`${cq("Structure your research process — which approach and why. (20 marks)")}
<h2>Recommended: Explanatory Sequential Mixed Methods Design</h2>
<p>This study should employ an explanatory sequential mixed methods design consisting of two phases. Given that CEO Damian Wong needs actionable evidence to decide between costly sustainability initiatives, the design must produce both statistically rigorous findings and contextual understanding of the mechanisms driving investor behavior.</p>

<h2>Phase 1: Quantitative Data Collection and Analysis</h2>
<p>The first phase involves administering a structured survey to institutional investors, financial analysts, and fund managers who currently hold or evaluate semiconductor industry stocks. The survey will use validated Likert-scale instruments to measure respondents' perceptions of sustainability goal communication effectiveness, attitudes toward third-party ESG certification, current and prospective investment confidence in firms like Globex, and perceived regulatory risk. The instrument will include scenario-based questions — for example, presenting investors with Globex's actual situation (EPA fines, declining stock) and asking them to rate how specific sustainability actions would affect their investment decisions. This approach reduces social desirability bias compared to asking direct questions about ESG importance. Demographic and portfolio variables (fund type, AUM, ESG mandate status, investment horizon) serve as controls. The target sample is 200 to 300 respondents recruited through stratified random sampling across fund types to ensure representation.</p>

<h2>Phase 2: Qualitative Follow-Up</h2>
<p>The second phase involves semi-structured interviews with 15 to 20 purposively selected participants from two groups: investors who participated in the Phase 1 survey and were identified as information-rich cases (those with strong or divergent views on ESG), and Globex executives including members of the sustainability strategy team and investor relations. The interviews explore the mechanisms behind the quantitative findings — for example, if Phase 1 reveals that ESG certification has a stronger effect on investor confidence than sustainability goal communication alone, Phase 2 probes why: Is it the third-party credibility? The standardized benchmarking? The signal of resource commitment? The interviews also explore Globex's internal perspective on the feasibility and trade-offs of the 25% net profit investment in ESG certification.</p>

<h2>Why Explanatory Sequential (Not Exploratory)?</h2>
<p>The constructs in this study — CSR, ESG certification, investor confidence, regulatory risk — are all well-established in existing academic literature with validated measurement instruments available. There is no need to "discover" what the relevant variables are through qualitative exploration first. What Globex needs is to first MEASURE the relationships at scale using quantitative methods (how much do investors actually care about ESG certification versus communicated goals?), and then EXPLAIN the underlying mechanisms through qualitative follow-up (why do they care, and what would change their behavior?). If the case instead involved a completely novel sustainability practice with no prior research, an exploratory sequential design — qualitative first to identify constructs, then quantitative to test them — would be more appropriate.</p>

<h2>Justification for Mixed Methods Over Single-Method</h2>
<p>A purely quantitative approach would tell CEO Wong whether ESG certification statistically predicts higher investor confidence, but not why investors value it or what specific aspects of certification matter most. A purely qualitative approach would provide rich investor perspectives but lack the statistical generalizability needed to justify a commitment of 25% of net profits. The mixed methods design produces both: generalizable quantitative evidence that ESG certification (or goal communication) has a significant effect, plus qualitative depth explaining the mechanisms and conditions under which it works. This combination gives Globex's board the statistical confidence and the strategic narrative needed to make a multi-million dollar decision.</p>`,
deep:`${tip("Decision rule: well-known constructs with existing scales → Explanatory Sequential (quant first). Novel phenomenon → Exploratory Sequential (qual first). The Globex case involves well-established constructs, so Explanatory is correct.")}<h2>Alternative: Quantitative Only</h2><p>Defensible if time and resources are severely constrained. Use SEM to test the full model. Acknowledge the limitation that you cannot explain WHY relationships exist. Recommend qualitative follow-up as future research. This is a weaker design but still passes.</p><h2>Alternative: Convergent Parallel</h2><p>Collect qual and quant simultaneously. Faster overall timeline. But Phase 2 cannot build on Phase 1 findings because they are collected in parallel. Less strategically useful for Globex because the qualitative questions cannot be targeted to the most surprising quant results.</p>`},

{id:"p2q5",emoji:"👥",label:"P2 Q5: Data + Sampling",group:"part2",marks:"10",
direct:`${cq("Source of primary data including population sampling strategy. (10 marks)")}
<h2>Quantitative Primary Data</h2>
<p>The primary quantitative data will be collected through a structured survey questionnaire using validated Likert-scale instruments adapted to the semiconductor sustainability context. The instrument will measure four core constructs — perceived effectiveness of sustainability goal communication, attitudes toward ESG certification, investor confidence, and perceived regulatory risk — along with scenario-based items presenting Globex's specific situation (EPA fines, stock decline, competitor positioning). Demographic and portfolio variables (fund type, assets under management, ESG mandate status, years of semiconductor sector experience) will be captured as controls.</p>

<h2>Quantitative Sampling Strategy</h2>
<p>The target population consists of institutional investors, financial analysts, and fund managers who currently hold or evaluate semiconductor industry stocks — these are the decision-makers whose behavior directly affects Globex's stock value and capital access. A stratified random sampling approach will ensure representation across investor types: mutual funds, pension funds, hedge funds, and ESG-focused funds. Each stratum may have different ESG priorities and risk tolerances, so proportional representation is critical. The target sample is 200 to 300 respondents, providing sufficient statistical power for SEM analysis. Access could be facilitated through investor conferences, financial industry associations, and Globex's own investor relations contacts.</p>

<h2>Qualitative Primary Data</h2>
<p>Semi-structured interviews will be conducted using an interview guide developed after Phase 1 analysis, allowing questions to be tailored to the most significant or unexpected quantitative findings. The guide will include open-ended questions exploring investors' reasoning processes around ESG, their perceptions of Globex's specific challenges, and the conditions under which they would increase or decrease investment.</p>

<h2>Qualitative Sampling</h2>
<p>Purposive sampling of 15 to 20 participants drawn from two groups: investors who participated in Phase 1 and represent information-rich cases (those with particularly strong, divergent, or unexpected responses), and Globex executives involved in sustainability strategy and investor relations — including individuals who can speak to the feasibility and internal trade-offs of the 25% net profit ESG certification investment.</p>

<h2>Secondary Data</h2>
<p>Secondary sources include Globex's EPA penalty records and compliance history, annual financial statements showing stock performance trends over the past three years, competitor sustainability reports and ESG ratings for benchmarking, industry reports on semiconductor environmental practices, and publicly available ESG rating agency assessments of Globex and its peers.</p>`,
deep:`<p><b>Why stratified random for quant?</b> Different investor types (pension funds vs. hedge funds vs. ESG-mandated funds) may respond very differently to sustainability initiatives. Stratified sampling ensures each type is represented rather than being dominated by whichever type is easiest to recruit.</p><p><b>Why purposive for qual?</b> Selects information-rich cases — participants most likely to provide deep insight into the mechanisms behind the quantitative patterns. Not random, but intentionally chosen for analytical value.</p>`},

{id:"p2q6",emoji:"📈",label:"P2 Q6: Data Analysis",group:"part2",marks:"10",
direct:`${cq("How you will analyse the data. (10 marks)")}
<h2>Quantitative Data Analysis</h2>
<p>The quantitative analysis proceeds in a systematic sequence designed to validate the measurement instruments before testing the hypothesized relationships. First, descriptive statistics — means, standard deviations, and a full correlation matrix — provide an overview of data distributions and initial relationships across all variables. Second, the reliability of each multi-item construct is assessed using Cronbach's alpha, with a threshold of 0.707 or higher confirming acceptable internal consistency. Third, confirmatory factor analysis validates the measurement model: factor loadings of 0.707 or higher confirm that each survey item adequately represents its intended construct, AVE (Average Variance Extracted) assesses convergent validity, and the Fornell-Larcker criterion confirms discriminant validity between constructs.</p>

<p>Fourth, the full structural model is tested using Structural Equation Modeling (SEM) via SmartPLS. The VIF (Variance Inflation Factor) is checked to remain below 3 to rule out collinearity issues. Bootstrapping with 5,000 subsamples tests the statistical significance of each path coefficient. Each hypothesis is evaluated based on the path coefficient (β), its p-value, and whether the 95% confidence interval excludes zero. Key paths include: sustainability goal communication → investor confidence, ESG certification → perceived regulatory risk, ESG certification → investor confidence, and the moderating effect of firm size. As supplementary analysis, multiple regression confirms key relationships, and t-tests compare investor confidence scores between respondents who view ESG certification favorably versus unfavorably.</p>

<h2>Qualitative Data Analysis</h2>
<p>All interviews are fully transcribed and imported into NVivo for systematic analysis. A thematic analysis approach proceeds through three stages: initial open coding to identify meaningful data segments, axial coding to group related codes into categories, and theme development to identify overarching patterns across participants. Special attention is given to themes that explain or contradict the quantitative findings — for example, if the SEM shows ESG certification has a stronger path to investor confidence than goal communication, the qualitative analysis explores why investors value certification more and what specific aspects of third-party validation matter most. Triangulation with quantitative findings and member checking with a subset of participants ensure credibility.</p>

<h2>Data Integration</h2>
<p>The integration of quantitative and qualitative findings is presented through a joint display matrix that maps qualitative themes onto the quantitative path relationships. For example, the matrix might show that the statistically significant ESG certification → investor confidence path (β = 0.45, p < 0.001) is explained by three qualitative themes: "third-party credibility removes greenwashing suspicion," "certification provides standardized benchmarking against competitors," and "the resource commitment signals long-term strategic seriousness." This integrated presentation gives CEO Wong both the statistical evidence and the strategic narrative needed to justify the investment decision to Globex's board.</p>`,
deep:`${tip("Name specific thresholds and tools throughout: Cronbach's α ≥ 0.707, factor loading ≥ 0.707, VIF < 3, SmartPLS, bootstrapping (5,000 subsamples), NVivo, joint display matrix. This demonstrates mastery of DBA801 and DBA802 course material and shows you can apply them to a real case.")}`},

{id:"p2q7",emoji:"⚖️",label:"P2 Q7: Strengths + Limits",group:"part2",marks:"10",
direct:`${cq("Strengths and limitations of your proposed approach. (10 marks)")}
<h2>Strengths</h2>
<p>The explanatory sequential mixed methods design offers several significant strengths for the Globex case specifically. First, it combines the breadth of quantitative survey research (200-300 investors) with the depth of qualitative interviews (15-20 key informants), providing CEO Wong with both statistical confidence and strategic narrative for a decision that involves committing up to 25% of net profits. Second, the sequential structure means Phase 2 interviews can be targeted to the most surprising or important findings from Phase 1 — if the quantitative data reveals that ESG certification matters far more than goal communication, the interviews dig into why, rather than exploring both equally. Third, multiple data sources — surveys, interviews, and secondary archival data (EPA records, stock data, competitor ESG ratings) — enable triangulation, strengthening the overall validity and credibility of the findings. Fourth, the use of SEM via SmartPLS tests all hypothesized relationships simultaneously, revealing the relative importance of sustainability goal communication versus ESG certification in a single integrated analysis rather than piecemeal tests.</p>

<h2>Limitations and Mitigation Strategies</h2>
<p>The first limitation is <b>generalizability</b>: because this study focuses on the semiconductor industry and specifically on Globex's situation (a firm under active EPA enforcement), findings may not directly transfer to other sectors or firms without regulatory pressure. This can be mitigated by providing thick descriptions of the semiconductor context and Globex's specific circumstances, enabling readers to judge transferability, and by recommending future replication studies in other high-carbon industries such as steel, petrochemicals, or automotive manufacturing.</p>

<p>The second limitation is <b>social desirability bias</b>: investors may overstate the importance they place on ESG factors, especially given the growing social expectation of responsible investing. This can be mitigated by using scenario-based questions (presenting Globex's actual situation and asking respondents to predict their investment behavior) rather than direct attitude questions ("How important is ESG to you?"), and by triangulating stated intentions with secondary data on actual portfolio behavior.</p>

<p>The third limitation is <b>self-report data</b>: survey responses about investment intentions may not reflect actual investment behavior. An investor who says they would increase allocation to an ESG-certified Globex may not follow through. This can be mitigated by supplementing survey data with archival data such as Globex's actual stock trading volumes and price movements around ESG-related announcements, and by comparing self-reported intentions with observable market behavior.</p>

<p>The fourth limitation is the <b>cross-sectional design</b> of Phase 1, which captures investor perceptions at a single point in time and cannot establish causation. We can observe that investors with higher ESG awareness report higher confidence, but cannot prove that ESG caused the confidence. This can be mitigated by framing findings explicitly as associational, using SEM path analysis to strengthen (though not prove) directional inference, and recommending a longitudinal follow-up study that tracks investor confidence before and after Globex implements specific sustainability milestones.</p>

<p>The fifth limitation is <b>selection bias</b>: investors who choose to participate may be systematically more ESG-engaged than non-participants, potentially inflating the apparent importance of sustainability initiatives. This can be mitigated by using stratified random sampling, tracking non-response rates and comparing respondent demographics against industry benchmarks, and applying statistical weighting if meaningful differences are detected.</p>

<p>Finally, the proposed research is <b>resource-intensive</b>, requiring expertise in both quantitative (SEM) and qualitative (thematic analysis) methods, plus significant time for two sequential phases. This can be mitigated by using a phased timeline with clear milestones, leveraging existing validated survey instruments rather than developing new ones, and conducting a small pilot study to refine the survey instrument before full deployment.</p>`,
deep:`${tip('The template for every limitation: "While [limitation] may affect [what], we mitigate this by [specific action]." Listing limitations WITHOUT mitigations is confirmed as a common weak answer — the mitigation is what demonstrates methodological maturity and earns marks.')}<p>If short on time, prioritize: at least 3 strengths and at least 4 limitations with mitigations. The mitigation is what scores — an unmitigated limitation is only half an answer.</p>`},
