  .tbl tr:nth-child(even){background:var(--card);}

<script>
function tip(t){return`<div class="box box-tip"><b>🔶 EXAM TIP:</b> ${t}</div>`}
function ex(t){return`<div class="box box-ex"><b>🟢 YOUR EXAMPLE:</b> ${t}</div>`}

const S=[
{id:"overview",emoji:"📋",label:"Mock Exam Overview",group:"overview",marks:"",
direct:`<p>Two parts, ~3 hours each. Part 1 = research methods. Part 2 = research design for a business case.</p><h2>Part 1 — Research Methods</h2><h3>Qualitative: 3 Questions</h3><ul><li><strong>Q1:</strong> Criteria for qual + when to use mixed/quant instead</li><li><strong>Q2:</strong> Propositions/hypotheses? Explain with examples</li><li><strong>Q3:</strong> Key issues — pick 3 of 4</li></ul><h3>Quantitative: 1 Case, 4 Questions</h3><p>Social media (interaction, customisation, trendiness) → repurchase intention, high-tech brands.</p><ul><li><strong>Q1:</strong> RQ + rationale</li><li><strong>Q2:</strong> Analysis method</li><li><strong>Q3:</strong> Gender impact — steps</li><li><strong>Q4:</strong> Limitations</li></ul><h2>Part 2 — Globex Case (100 marks)</h2>${tbl(["Q","Topic","Marks"],[["1","Significance","10"],["2","RQ + variables","20 ⭐"],["3","Literature","20 ⭐"],["4","Design + why","20 ⭐"],["5","Data + sampling","10"],["6","Analysis","10"],["7","Strengths + limits","10"]])}`,
deep:`${tip("Q2-Q4 in Part 2 are 20 marks each — invest most time. Leave 15 min for review.")}<h2>Answer Template</h2><ul><li><b>Define</b> → <b>Explain</b> → <b>Example</b> → <b>Connect</b></li></ul><h2>Power Moves</h2><ul><li>Comparison tables for contrasts</li><li>Name tools + thresholds (SmartPLS, α≥0.707, VIF&lt;3)</li><li>5 design components for study design Qs</li><li>Triangulation types for qual validity</li><li>"One-unit increase" template for regression</li></ul>${tip("Causation traps: Correlation≠causation, confounders, social desirability, cross-sectional=no temporal precedence, sampling bias.")}`},

{id:"q1q1",emoji:"🔍",label:"Qual: Criteria + When NOT",group:"part1qual",marks:"",
direct:`${cq('"What criteria for doing a qualitative study? When to suggest mixed/quant instead?"')}<p>This question is <b>ambiguous</b> — "criteria for doing a qualitative study" can mean (A) when should you choose qualitative methods, or (B) what makes a qualitative study good. <b>Cover both to score high</b>, plus the second part about when to use other methods instead.</p>

<h2>A. Criteria FOR Choosing Qualitative Methods</h2>
<p>Qualitative methods are the appropriate choice when specific conditions about the research problem, the state of knowledge, and the research goals are met:</p>
<ul>
<li><b>The phenomenon is not well understood</b> — the topic is exploratory, with limited prior research or no established theory to test. Qualitative methods allow the researcher to discover patterns and build understanding from the ground up.</li>
<li><b>The research question asks "how" or "why"</b> — the goal is to understand processes, experiences, perceptions, or meaning-making, not to measure "how much" or test statistical relationships.</li>
<li><b>Rich, contextual depth is needed</b> — the topic involves complex social interactions, cultural dynamics, or subjective experiences that cannot be captured through standardized instruments. The researcher needs data from participants' own words and perspectives.</li>
<li><b>The variables are not yet well-defined</b> — when it is unclear which constructs matter or how to measure them, qualitative inquiry helps identify and define the relevant variables before they can be quantified.</li>
<li><b>Small, purposive samples are appropriate</b> — the research prioritizes depth over breadth, studying a few information-rich cases in detail rather than surveying a large representative population.</li>
<li><b>The context matters</b> — the phenomenon is shaped by its specific social, cultural, organizational, or historical setting, and understanding that context is essential to understanding the findings.</li>
</ul>

<h2>B. Criteria OF a Good Qualitative Study (Trustworthiness)</h2>
<p>Once you have chosen qualitative methods, the quality of the study is evaluated through <b>trustworthiness criteria</b> (Lincoln & Guba), which parallel but differ from quantitative quality standards:</p>
${bb("Credibility (≈ Internal Validity)","The degree to which findings are believable and plausible based on the data collected. Achieved through triangulation (multiple sources/methods), member checking (verifying findings with participants), prolonged engagement in the research setting, and peer debriefing.")}
${bb("Transferability (≈ Generalizability)","The degree to which findings can be applied to other contexts. Achieved not by statistical generalization, but by providing thick description of the research context — detailed enough that readers can judge whether findings apply to their own settings.")}
${bb("Dependability (≈ Reliability)","The degree to which findings are consistent and stable over time and across conditions. Achieved through audit trails that document all research decisions, procedures, and analytical choices so the process can be traced and reviewed.")}
${bb("Confirmability (≈ Objectivity)","The degree to which findings are supported by data and free from researcher bias. Achieved through reflexivity (the researcher examining their own assumptions), transparent documentation, and triangulation.")}
${bb("Relevance","The degree to which the findings address a meaningful research question and contribute to the existing body of knowledge.")}
<p>A robust qualitative study also requires five design components: a focused <b>Research Question</b>, guiding <b>Propositions</b>, clear <b>Boundedness</b> (sample and setting), a <b>Logic Model</b> linking data to propositions, and consideration of <b>Rival Explanations</b>.</p>

<h2>C. When to Suggest Quantitative Instead</h2>
<ul>
<li>The research question asks "how much," "how many," or "what is the statistical relationship between X and Y" — these are measurement questions that require quantitative methods.</li>
<li>The variables are already well-defined with validated measurement instruments available in the literature.</li>
<li>The goal is to produce statistically generalizable results from a large, representative sample.</li>
<li>The researcher wants to test a specific, pre-defined hypothesis (confirmatory research).</li>
<li>The goal is to establish cause-and-effect through experimental design with control groups and random assignment.</li>
</ul>

<h2>D. When to Suggest Mixed Methods Instead</h2>
<ul>
<li>Neither qualitative nor quantitative alone provides a complete picture of the research problem.</li>
<li>Quantitative data shows WHAT is happening, but qualitative data is needed to explain WHY.</li>
<li>The researcher wants to validate or corroborate findings from one method with another (cross-paradigm triangulation).</li>
<li>A new measurement instrument needs to be developed — qualitative exploration discovers the constructs, then quantitative testing validates them at scale.</li>
</ul>`,
deep:`${tbl(["If you need...","Choose...","Because..."],[["Depth, context, 'how/why'","Qualitative","Explores perceptions & meaning"],["Breadth, measurement, 'how much'","Quantitative","Tests hypotheses with stats"],["Both depth AND breadth","Mixed Methods","Comprehensive understanding"],["Explore THEN test","Exploratory Sequential MM","Qual discovers, quant confirms"],["Measure THEN explain","Explanatory Sequential MM","Quant patterns, qual explains"]])}
${tbl(["Qualitative Criteria","Quantitative Criteria"],[["Credibility","Internal Validity"],["Transferability","Generalizability"],["Dependability","Reliability"],["Confirmability","Objectivity"],["Trustworthiness focus","Precision & significance focus"]])}
<h2>Mixed Methods Designs (Know by Name)</h2>
${bb("Convergent Parallel","Collect qual + quant simultaneously, compare side-by-side. Equal weight to both.")}
${bb("Explanatory Sequential","Phase 1: Quant data collection. Phase 2: Qual follow-up to explain quant results.")}
${bb("Exploratory Sequential","Phase 1: Qual exploration. Phase 2: Quant testing of discovered constructs.")}
${bb("Embedded","One method nested within a larger study of the other type.")}
${bb("Transformative","Driven by a social justice or advocacy framework.")}
${bb("Multiphase","Three or more phases combining qual and quant in sequence or concurrently.")}
${ex("In my DBA801 project, I chose quantitative methods (PLS-SEM) because the constructs — Power Distance, Psychological Safety, Job Performance — already had validated scales in the literature, and my goal was to TEST specific hypothesized relationships among 146 respondents. However, the surprising finding that PD positively predicted PS (contradicting Western theory) suggested qualitative follow-up was needed to explain WHY — which led directly to my DBA802 qualitative study. This illustrates when a single method is insufficient.")}
${tip("Structure your answer in the A-B-C-D order above: (A) when to choose qual, (B) what makes a qual study good, (C) when quant instead, (D) when mixed instead. This covers both possible interpretations of the question and shows comprehensive understanding.")}`},

{id:"q1q2",emoji:"💡",label:"Qual: Propositions",group:"part1qual",marks:"",
direct:`${cq('"Should we have propositions/hypotheses for qualitative study? Explain with examples."')}<p><b>Yes — propositions, not rigid hypotheses.</b> Flexible guides that focus collection without constraining discovery.</p><h2>Distinction</h2>${bb("Proposition (Qual)","If-then statement. Flexible, evolves. Tested via thematic analysis.")}${bb("Hypothesis (Quant)","Testable IV-DV statement. Fixed. Tested statistically.")}${bb("Assertion","Fact from evidence. No predictions.")}<h2>Examples</h2><p><b>Proposition:</b> "If leaders acknowledge mistakes, then members report greater willingness to voice disagreements." → Tested via themes, can revise.</p><p><b>Hypothesis:</b> "H1: Leader vulnerability → PS (β>0.30, p<0.05)." → Fixed, SEM-tested.</p><h2>Why They Matter</h2><ul><li>One of 5 design components</li><li>Connect to theory via logic model</li><li>Focus without rigidity</li><li>Table of Propositions organizes relationships</li></ul><p>Without them (tabula rasa) is possible but risks becoming unfocused.</p>`,
deep:`${tbl(["Propositions (Qual)","Hypotheses (Quant)"],[["If-then, conditional","Testable statistical"],["Flexible, evolves","Fixed before collection"],["Exploratory","Confirmatory"],["Pattern matching, themes","t-test, ANOVA, SEM"],["Descriptions & inferences","Precise IV-DV"]])}<h2>Answer Structure</h2><p><b>Open:</b> "Yes, propositions — not rigid hypotheses."</p><p><b>Distinction</b> with table. <b>Both examples.</b> <b>Address "without":</b> possible but risky.</p>${ex("DBA802: Proposition 1 (dyadic relationships) → SUPPORTED by Theme 1. Theme 3 (maturity) → EMERGENT, not predicted. Shows: focus + discovery.")}<h3>Theory Approaches</h3>${bb("Tabula Rasa","Blank slate, pure induction")}${bb("Grounded Theory","Theory from data via coding")}${bb("Proposition-guided","Start with propositions, refine. Most common in case studies.")}`},

{id:"q1q3",emoji:"⚡",label:"Qual: Key Issues (3/4)",group:"part1qual",marks:"",
direct:`${cq('"Key issues (choose 3/4): triangulation & credibility, generalizability, active interviewing, software."')}<p>Prepare all 4. Note specific angles: triangulation→<b>credibility</b>, interviewing→<b>researcher-participant interaction</b>.</p><h2>1. Triangulation & Credibility</h2><p>Triangulation means cross-validating findings through multiple independent sources. It directly improves <b>credibility</b> — the qualitative parallel to internal validity — because if multiple sources converge on the same conclusion, the finding is more believable than one supported by a single source. It reduces the risk that findings are artifacts of a single method's bias or a single participant's perspective.</p>${bb("Data Triangulation","Using multiple data sources such as interviews from different organizational roles, archival documents, and observation notes to verify findings across contexts.")}${bb("Investigator Triangulation","Having multiple researchers independently analyse the same dataset, reducing the influence of any single researcher's interpretation.")}${bb("Theory Triangulation","Applying multiple theoretical frameworks to the same data to examine whether different lenses yield consistent or complementary insights.")}${bb("Method Triangulation","Using multiple research methods such as interviews, surveys, and observation to study the same phenomenon from different angles.")}<p>Triangulation is considered more important in qualitative research than quantitative research because qualitative data collection methods are inherently less structured and more subjective. In quantitative research, standardized instruments and statistical tests establish validity. In qualitative research, triangulation compensates for this subjectivity by cross-validating through multiple angles.</p><h2>2. Limits of Generalizability</h2><p>Generalizability — the extent to which findings can be applied to a larger population beyond the sample studied — is a persistent challenge in qualitative research. This difficulty arises from several inherent characteristics. Qualitative studies typically use small, purposive samples selected for depth rather than representativeness, which limits statistical generalization. The sampling is non-random, meaning participants are chosen based on specific criteria rather than chance. Findings tend to be context-specific, shaped by the unique demographic, cultural, and organizational characteristics of the setting. Additionally, researcher subjectivity in interpretation introduces personal bias that can limit universality.</p><p>Rather than claiming generalizability, qualitative researchers should aim for <b>transferability</b> by providing thick descriptions of the research context, enabling readers to judge whether findings apply to their own settings. Comprehensive sampling from varied groups and explicit acknowledgment of limitations also strengthen the study's contribution.</p><h2>3. Active Interviewing & Researcher-Participant Interaction</h2><p>Active interviewing is an approach that emphasizes engaging the interviewee in genuine, dynamic conversation rather than mechanically asking a fixed set of predetermined questions. The interviewer uses open-ended questions, follow-up probes, and authentic curiosity to encourage participants to share deeper thoughts, reflections, and experiences. This involves both actively probing — asking spontaneous follow-up questions — and passively asking predetermined questions for consistency.</p><p>Active interviewing is helpful because it produces more honest, detailed, and nuanced responses than structured interviews. By demonstrating genuine interest, the interviewer builds rapport and trust, creating a psychologically safe environment where participants feel comfortable sharing openly. This captures richness and complexity that standardized instruments miss.</p><p>However, active interviewing introduces several challenges. There is a risk of inadvertently leading the interviewee toward particular responses. The approach requires strong interviewing skills not all researchers possess. It is harder to standardize across multiple interviews, which can introduce inconsistencies. The interviewer's own biases can influence the conversation direction. Finally, active interviews are significantly more time-consuming to conduct and analyse.</p><h2>4. Qualitative Data Software</h2><p>Qualitative research software such as NVivo assists researchers in managing and analysing large volumes of qualitative data that would be unwieldy to handle manually. These tools allow researchers to organize data efficiently by inputting, categorizing, searching, and retrieving transcripts and documents in a structured database. They support systematic analysis by providing tools for coding data segments, identifying patterns and themes, and visualizing relationships between codes. They enable collaboration by allowing multiple researchers to work simultaneously, which is particularly valuable for investigator triangulation. They save time by automating repetitive tasks such as coding frequency counts and categorization. Other tools include Word Cloud for visual text summaries, Text Analytics for AI-powered pattern detection, and Computer Vision and Video Analyzer for non-text data sources.</p>`,
deep:`${ex("In my DBA802 study, I used data triangulation (participants from multinational Gameloft and local studios) and method triangulation (semi-structured interviews combined with contact sheets and a think display matrix). Theme 7 — face-saving creating a private-public safety differential — was validated across multiple participants from different organizational contexts, strengthening its credibility.")}${ex("My DBA802 study had 6 participants — clearly not generalizable to all tech companies. However, the thick descriptions of Vietnamese hierarchical culture, face-saving norms, and game development workflows enable readers in similar settings to judge transferability to their own contexts.")}<h2>When Triangulation Reveals Contradictions</h2><p>Contradictions across sources are not a failure — they are analytically valuable. Report them transparently, explore the reasons (power dynamics, different perspectives, contextual differences), and discuss implications. This shows analytical sophistication rather than a methodological flaw.</p><h2>Active Interviewing: The Three Phases</h2>${bb("Building Rapport","Establish a genuine connection and put the participant at ease before diving into substantive questions.")}${bb("Main Questions","Conduct the core inquiry with active probing, following up on unexpected or rich responses to explore them in depth.")}${bb("Closing","Conclude positively, allow the participant to share any final thoughts, and leave a good impression for potential follow-up.")}${tip("The confirmed question links triangulation to 'credibility' and active interviewing to 'researcher-participant interaction' — tailor your answers specifically to these angles rather than giving generic definitions.")}`},

{id:"q1q4",emoji:"📊",label:"Quant: RQ + Rationale",group:"part1quant",marks:"",
direct:`${cq('"Set up the research question and rationale."')}<h2>Main RQ</h2><p><em>"How do social media dimensions (interaction, customisation, trendiness) influence consumers' repurchase intention toward high-tech brands?"</em></p><h3>Sub-Qs</h3><ul><li>Interaction → RI?</li><li>Customisation → RI?</li><li>Trendiness → RI?</li><li>Demographics moderate?</li></ul><h2>Rationale</h2>${bb("Practical","Evidence on WHICH dimensions drive repeat purchases → budget allocation")}${bb("Academic","Decomposes SM into specific dimensions in high-tech context")}${bb("Methodological","Validated Likert + demographic controls = rigorous")}`,
deep:`<h2>Good RQ Criteria</h2><ul><li><b>Feasible</b> — answerable with available resources</li><li><b>Interesting</b> — stakeholders care</li><li><b>Novel</b> — specific dimensions in high-tech = new</li><li><b>Ethical</b> — no harm</li><li><b>Relevant</b> — practical implications</li></ul>${tip('"How do...influence" → quantitative. "How do consumers experience..." → qualitative.')}`},

{id:"q1q5",emoji:"🔬",label:"Quant: Analysis Method",group:"part1quant",marks:"",
direct:`${cq('"How to analyse interaction, customisation, trendiness → repurchase intention? Method?"')}<h2>Multiple Likert Items → SEM (SmartPLS)</h2><ol><li><b>Data prep:</b> Missing data, outliers, normality</li><li><b>Measurement model:</b> Loadings≥0.707, α≥0.707, AVE, Fornell-Larcker</li><li><b>Structural model:</b> PLS, path coefficients β, VIF&lt;3, bootstrapping</li><li><b>Interpret:</b> β, p-value, hypothesis supported?</li></ol><h2>Single Score → Multiple Regression</h2><p>RI = β₀ + β₁(Int) + β₂(Cust) + β₃(Trend) + ε</p><ol><li>Assumptions: linearity, normality, homoscedasticity, VIF&lt;10</li><li>Interpret B: "one-unit increase → [B] change"</li><li>p&lt;0.05, R²</li></ol><p><b>H1:</b> Interaction→+RI. <b>H2:</b> Customisation→+RI. <b>H3:</b> Trendiness→+RI.</p>`,
deep:`${tip('"Measured by 4 items" → SEM. Single score → regression. Read case carefully.')}${tbl(["Scenario","Method","DV","IV"],[["2 groups","t-test","Continuous","Cat(2)"],["3+ groups","ANOVA","Continuous","Cat(3+)"],["1 IV","Simple Reg.","Continuous","Continuous"],["Multiple IVs","Multiple Reg.","Continuous","Mixed"],["Multiple constructs","SEM","Latent","Latent"],["Binary outcome","Logistic Reg.","Binary","Mixed"]])}${tip("FIRST classify each variable: continuous, ordinal, nominal, binary. Write as table before choosing methods.")}<h2>DBA801 Thresholds</h2>${bb("Loading","≥0.707")}${bb("α","≥0.707")}${bb("VIF","&lt;3 (SEM)")}${bb("AVE","Convergent validity")}${bb("Fornell-Larcker","√AVE > correlations → discriminant")}<h2>Regression Template</h2><p><em>"For every one-unit increase in [IV], [DV] changes by [B], holding others constant. [Sig/not] at 0.05 (p=[val]). CI [does/doesn't] include zero."</em></p>${tip("Address ALL variables including non-significant ones.")}`},

{id:"q1q6",emoji:"👫",label:"Quant: Gender Impact",group:"part1quant",marks:"",
direct:`${cq('"Gender impacts RI — steps + variables?"')}${bb("Step 1","DV: RI (continuous). IV: Gender (binary).")}${bb("Step 2","Independent samples t-test — means of continuous DV across 2 groups.")}<p>H0: No difference. H1: Difference exists.</p>${bb("Step 3","Assumptions: normality (Shapiro-Wilk), variances (Levene's). Violated → Mann-Whitney U.")}${bb("Step 4","Compare means. Report t, df, p. p&lt;0.05 → significant.")}${bb("Step 5 (Advanced)","Gender as dummy in regression → control for SM dimensions. Or moderation: Gender×Interaction.")}<p><b>Variables:</b> RI (DV) + Gender (IV). Optionally age, education, income, SM use as controls.</p>`,
deep:`${tip("'What steps' → number them. Shows procedural competence.")}<h2>Why t-test?</h2><p><b>t-test:</b> Correct — 2 groups, continuous DV. <b>Chi-square:</b> Wrong — RI is continuous. <b>ANOVA:</b> Works but overkill for 2 groups.</p><h2>Moderation (Bonus)</h2><p>RI = β₀ + β₁(Int) + β₂(Gender) + β₃(Int×Gender) + ε. If β₃ sig → gender moderates.</p>`},

{id:"q1q7",emoji:"⚠️",label:"Quant: Limitations",group:"part1quant",marks:"",
direct:`${cq('"Limitations to keep in mind?"')}${bb("1. No Causation","This is a cross-sectional survey design, which means we can only observe correlations between variables, not establish causal relationships. We cannot conclude that social media interaction causes repurchase intention; only that they are associated. A longitudinal design tracking the same consumers over time would be needed for causal claims.")}${bb("2. Self-Report Bias","All data is self-reported via surveys, meaning respondents may overstate their social media engagement or their intention to repurchase to appear socially desirable. This can be mitigated by ensuring anonymity, using indirect questioning techniques, and where possible triangulating with behavioral data such as actual purchase records.")}${bb("3. Common Method Bias","Both the independent variables and the dependent variable are measured using the same instrument (Likert scales within the same survey), which creates a risk that shared method variance artificially inflates the observed correlations. This can be mitigated by conducting Harman's single-factor test or by including a marker variable.")}${bb("4. Likert Scale Limitations","Likert scales are technically ordinal rather than truly interval, meaning the distance between response options may not be equal. Treating them as continuous in regression or SEM assumes equal intervals, which may not hold. This assumption should be acknowledged, and robust estimation methods should be considered.")}${bb("5. Sample Representativeness","If the sample is recruited from a single platform or a narrow demographic, the findings may not generalize to all consumers of high-tech brands. This can be mitigated by using random or stratified sampling techniques and reporting the full demographic breakdown.")}${bb("6. Confounders","Other factors not included in the model — such as brand loyalty, price sensitivity, product quality, or competitor activity — may influence repurchase intention and could explain some observed relationships. This can be mitigated by including relevant control variables and explicitly acknowledging unmeasured confounders.")}${bb("7. Multicollinearity","The three social media dimensions (interaction, customisation, trendiness) may be highly correlated with each other, making it difficult to isolate each dimension's unique effect. This can be detected by checking VIF values (below 3 for SEM or below 10 for standard regression) and addressed through factor analysis to confirm distinct constructs.")}`,
deep:`${tip('The template for every limitation: "While [limitation] may affect [what], we mitigate by [action]." Always pair limitations with mitigations — this was confirmed as a key differentiator between good and great answers.')}<p>Note that chi-square is suboptimal for Likert-scale (ordinal) data. If comparing groups on Likert variables, ANOVA or non-parametric alternatives like Kruskal-Wallis are more appropriate. Mentioning this distinction demonstrates methodological sophistication.</p>`},

{id:"p2q1",emoji:"🏢",label:"P2 Q1: Significance",group:"part2",marks:"10",
direct:`${cq("Significance of the study — company, industry, public. (10 marks)")}<h2>Significance for Globex Corporation</h2><p>This study holds direct strategic value for Globex Corporation, which is currently navigating a critical juncture between environmental accountability and investor relations. By empirically examining which sustainability initiatives — whether CSR programs, ESG certification, or explicit sustainability goal-setting — most effectively restore investor confidence, the study provides Globex's leadership with evidence-based guidance for allocating their sustainability investment. Rather than pursuing broad, unfocused environmental commitments, Globex will be able to identify which specific actions carry the most weight with institutional investors and which interventions most effectively reduce perceived regulatory risk.</p><h2>Significance for the Semiconductor Industry</h2><p>Beyond Globex, this research establishes valuable benchmarks for ESG adoption across the semiconductor industry, which is one of the most energy-intensive and environmentally scrutinized manufacturing sectors globally. Other semiconductor firms facing similar environmental pressures — rising compliance costs, carbon emission regulations, and investor demands for transparency — can use the findings to design their own sustainability strategies. The study contributes an industry-specific understanding of how sustainability initiatives translate into measurable investor outcomes.</p><h2>Significance for the Academic and Public Community</h2><p>From an academic perspective, the study contributes to the growing body of literature on the CSR-investor confidence relationship by examining it within a high-carbon-footprint industrial context, which remains underexplored. Most existing research has focused on service industries or general corporate settings. This study extends that knowledge to capital-intensive manufacturing, providing insights into whether the mechanisms linking sustainability to investor confidence operate differently in industries with substantial environmental liabilities. For the broader public, the findings can inform policy discussions about the effectiveness of environmental regulations and corporate sustainability mandates.</p>`,
deep:`${tip("Always address all three audiences — company, industry, and academic/public. Many students forget the academic dimension, which demonstrates research awareness and broader contribution thinking.")}`},

{id:"p2q2",emoji:"🎯",label:"P2 Q2: RQ + Variables",group:"part2",marks:"20",
direct:`${cq("Research problem, research question — variables included. (20 marks)")}<h2>Research Problem</h2><p>Globex Corporation, a leading semiconductor manufacturer, faces a compounding strategic crisis. Recent environmental penalties for excessive carbon emissions have triggered a decline in investor confidence, raising concerns about the company's long-term viability and governance quality. Despite management's stated commitment to sustainability — including investments in corporate social responsibility programs, pursuit of ESG certification, and the establishment of formal sustainability goals — there is no systematic empirical evidence demonstrating whether these initiatives are effectively addressing investor concerns or reducing regulatory exposure. This gap between sustainability investment and measurable stakeholder outcomes creates significant strategic uncertainty for Globex's leadership and board.</p><h2>Research Questions</h2><p>The main research question guiding this study is: <em>"How do sustainability initiatives influence investor confidence and regulatory risk reduction for semiconductor manufacturers?"</em> This overarching question is supported by three sub-questions: (1) What is the relationship between CSR program implementation and investor confidence? (2) To what extent does ESG certification affect perceived regulatory risk among institutional investors? (3) How do explicit sustainability goal-setting practices mediate the relationship between environmental initiatives and stakeholder trust?</p><h2>Variables</h2>${tbl(["Variable","Type","Role","Measurement"],[["CSR program implementation","Likert scale","IV","Scope, investment, visibility of CSR programs"],["ESG certification","Binary/ordinal","IV","Certified or not, and at what level"],["Sustainability goals","Likert scale","IV","Specificity, ambition, and public commitment"],["Investor confidence","Likert scale","DV","Investment willingness, trustworthiness, forward-looking sentiment"],["Perceived regulatory risk","Likert scale","DV","Anticipated penalties, compliance burden, risk exposure"],["Company size","Continuous","Moderator","Revenue, employee count, or market cap"],["Time since penalty","Continuous","Control","Months since most recent environmental penalty"]])}<h2>Hypotheses</h2><p>H1: The implementation of CSR programs has a positive effect on investor confidence. H2: ESG certification reduces perceived regulatory risk among investors. H3: Setting explicit sustainability goals mediates the positive relationship between CSR initiatives and investor confidence. H4: Company size moderates the relationship between sustainability initiatives and investor outcomes, such that the effect is stronger for larger firms with greater public visibility.</p>`,
deep:`${tip("The question specifically asks for 'variables included' — always name each variable, classify it as IV/DV/moderator/control, and state how it would be measured. The table format demonstrates systematic thinking and scores well.")}`},

{id:"p2q3",emoji:"📚",label:"P2 Q3: Literature",group:"part2",marks:"20",
direct:`${cq("Potential sources of relevant literature — sub-topics to organise the review. (20 marks)")}<p>The literature review should be organized around six key sub-topics, each contributing a distinct layer of theoretical and empirical grounding that together form the conceptual foundation for the research model.</p><h2>Sub-Topic 1: Corporate Social Responsibility (CSR)</h2><p>This section reviews the theoretical foundations of CSR, including seminal frameworks such as Carroll's CSR pyramid and stakeholder theory. It examines the empirical evidence on whether and how CSR investments translate into financial performance, investor behavior, and reputational outcomes, with particular attention to studies in manufacturing contexts.</p><h2>Sub-Topic 2: ESG Frameworks and Investor Behavior</h2><p>This section covers ESG certification standards, disclosure practices, and the growing body of evidence on how ESG ratings influence investor decision-making. It should review the mechanisms through which ESG information affects perceived risk, expected returns, and portfolio allocation decisions among institutional investors.</p><h2>Sub-Topic 3: Investor Confidence</h2><p>This section examines the determinants of investor confidence, including corporate governance quality, transparency, sustainability commitments, and market signaling. It should review validated instruments for measuring investor confidence and explore its relationship to corporate sustainability initiatives.</p><h2>Sub-Topic 4: Regulatory Risk and Environmental Compliance</h2><p>This section reviews the regulatory landscape for environmental compliance in the semiconductor industry, including carbon emission standards, penalty structures, and the financial costs of non-compliance. It examines how investors perceive and price regulatory risk.</p><h2>Sub-Topic 5: Sustainability in Manufacturing</h2><p>This section covers practical sustainability strategies including carbon footprint reduction, green supply chain management, clean production technologies, and circular economy approaches — providing the operational context for understanding what CSR initiatives look like in practice.</p><h2>Sub-Topic 6: Semiconductor Industry Context</h2><p>This section provides industry-specific context: the unique environmental challenges of semiconductor fabrication (high energy and water usage, chemical waste), the competitive landscape, and how industry leaders are approaching sustainability.</p><h2>What the Literature Review Informs</h2><p>The literature review directly informs the conceptual model design, the operationalization of each construct using validated measurement instruments, the theoretical grounding of hypotheses, the identification of appropriate control variables and moderators, and the gaps in existing knowledge that justify the study's contribution.</p>`,
deep:`<h2>Source Types to Reference</h2><ul><li>Academic journals (Journal of Business Ethics, Strategic Management Journal, sustainability-focused journals)</li><li>Industry reports (McKinsey, Deloitte sustainability studies, semiconductor industry ESG reports)</li><li>Regulatory documents (environmental compliance frameworks, penalty records)</li><li>Company reports (ESG disclosures, annual reports, sustainability reports)</li></ul>${tip("You don't need to write the actual lit review — show you know WHAT to search for, HOW to organize it into sub-topics, and WHAT it informs in your research design. The sub-topic structure is what earns marks.")}`},

{id:"p2q4",emoji:"🧪",label:"P2 Q4: Research Design",group:"part2",marks:"20",
direct:`${cq("Structure your research process — which approach and why. (20 marks)")}<h2>Recommended: Explanatory Sequential Mixed Methods Design</h2><p>This study should employ an explanatory sequential mixed methods design consisting of two phases conducted in sequence. This design combines the statistical rigor of quantitative analysis with the contextual depth of qualitative exploration.</p><h2>Phase 1: Quantitative</h2><p>The first phase involves administering a structured survey to institutional investors, financial analysts, and fund managers who hold or evaluate semiconductor stocks. The survey instrument will use validated Likert-scale measures to assess perceptions across the key constructs: CSR program awareness, ESG certification awareness, investor confidence, and perceived regulatory risk. Demographic and portfolio variables serve as controls. The target sample is 200 to 300 respondents recruited through stratified random sampling across different investor types.</p><h2>Phase 2: Qualitative</h2><p>The second phase involves conducting semi-structured interviews with 15 to 20 purposively selected participants — investors identified as information-rich cases from Phase 1, plus Globex executives involved in sustainability strategy. The interviews explore the mechanisms behind the quantitative findings. For example, if Phase 1 reveals ESG certification has the strongest path coefficient to investor confidence, Phase 2 probes why investors weight certification so heavily.</p><h2>Why Explanatory Sequential (Not Exploratory)?</h2><p>The choice hinges on whether constructs are already well-defined. Here, CSR, ESG certification, investor confidence, and regulatory risk are all well-established in existing literature with validated measurement instruments. There is no need to "discover" the relevant variables through qualitative exploration first. What is needed is to first MEASURE relationships at scale, then EXPLAIN the underlying mechanisms. Exploratory Sequential would be appropriate if the phenomenon were completely novel with no prior instruments or research.</p><h2>Justification for Mixed Methods</h2><p>A purely quantitative approach would establish whether relationships exist but not explain why. A purely qualitative approach would provide rich context but lack statistical generalizability. The mixed methods design combines both strengths: generalizable evidence plus explanatory depth. The sequential structure is particularly valuable because Phase 2 can be designed to directly follow up on Phase 1's most important or surprising findings.</p>`,
deep:`${tip("Decision rule: well-known constructs with existing scales → Explanatory Sequential (quant first). Novel phenomenon with unknown variables → Exploratory Sequential (qual first). State this reasoning explicitly.")}<h2>Alternative: Quantitative Only</h2><p>Defensible if focusing purely on SEM testing. Acknowledge limitation: won't explain WHY relationships exist. Recommend qualitative follow-up as future research.</p><h2>Alternative: Convergent Parallel</h2><p>Collect qual + quant simultaneously. Advantage: faster timeline. Disadvantage: Phase 2 cannot build on Phase 1 findings because they are collected simultaneously. Use if time or resources are severely constrained.</p>`},

{id:"p2q5",emoji:"👥",label:"P2 Q5: Data + Sampling",group:"part2",marks:"10",
direct:`${cq("Source of primary data including population sampling strategy. (10 marks)")}<h2>Quantitative Primary Data</h2><p>The primary quantitative data will be collected through a structured survey questionnaire using validated Likert-scale instruments for each construct. The instrument will include established scales for CSR perception, ESG awareness, investor confidence, and perceived regulatory risk, adapted to the semiconductor context. Demographic and portfolio variables will also be captured as controls.</p><h2>Quantitative Sampling</h2><p>The target population consists of institutional investors, financial analysts, and fund managers with exposure to semiconductor stocks. A stratified random sampling approach will ensure adequate representation across investor types — mutual funds, pension funds, hedge funds, and ESG-focused funds. The target sample is 200 to 300 respondents, providing sufficient statistical power for SEM. Stratified random sampling is preferable to convenience sampling because it ensures findings are not biased toward a single investor type.</p><h2>Qualitative Primary Data</h2><p>Semi-structured interviews using an interview guide with open-ended questions designed to explore the mechanisms behind the quantitative findings. The guide will be developed after Phase 1 analysis, allowing questions to be tailored to the most significant or unexpected results.</p><h2>Qualitative Sampling</h2><p>Purposive sampling of 15 to 20 participants: investors who participated in Phase 1 and represent information-rich cases, plus Globex executives involved in sustainability strategy. This combination captures both the investor perspective and the corporate perspective.</p><h2>Secondary Data</h2><p>The study will also draw on Globex's ESG reports and sustainability disclosures, annual financial statements, regulatory filings and environmental penalty records, and industry benchmarks from semiconductor associations and sustainability rating agencies.</p>`,
deep:`<p><b>Why stratified random for quant?</b> Ensures representation across investor types — different fund types have different ESG priorities. Random selection within strata ensures statistical validity and supports generalizability.</p><p><b>Why purposive for qual?</b> Selects information-rich cases who can provide the most insight into WHY quantitative relationships exist. Not random — intentionally chosen for depth, not representativeness.</p>`},

{id:"p2q6",emoji:"📈",label:"P2 Q6: Data Analysis",group:"part2",marks:"10",
direct:`${cq("How you will analyse the data. (10 marks)")}<h2>Quantitative Data Analysis</h2><p>The quantitative analysis proceeds in a systematic sequence. First, descriptive statistics (means, standard deviations, correlation matrix) provide an overview of data distribution and initial relationships. Second, reliability is assessed using Cronbach's alpha, with a threshold of 0.707 or higher indicating acceptable internal consistency. Third, confirmatory factor analysis validates the measurement model, with factor loadings of 0.707 or higher required. AVE assesses convergent validity, and the Fornell-Larcker criterion confirms discriminant validity.</p><p>Fourth, the full structural model is tested using SEM via SmartPLS (PLS-SEM). VIF is checked to remain below 3 for collinearity. Bootstrapping (5,000 subsamples) tests significance of path coefficients. Each hypothesis is evaluated based on β, p-value, and whether the confidence interval excludes zero. Multiple regression and ANOVA/t-tests serve as supplementary analyses.</p><h2>Qualitative Data Analysis</h2><p>All interviews are fully transcribed and imported into NVivo. Thematic analysis begins with initial open coding to identify meaningful segments, followed by axial coding to group codes into categories, and theme development to identify overarching patterns. Findings are triangulated with quantitative results, and member checking verifies accuracy with a subset of participants.</p><h2>Data Integration</h2><p>A joint display matrix systematically maps qualitative themes onto quantitative path relationships — for example, presenting the qualitative explanations for why ESG certification has the strongest statistical effect alongside the SEM path coefficient. This provides both evidence and narrative for stakeholder decision-making.</p>`,
deep:`${tip("Name specific thresholds and tools: Cronbach's α ≥ 0.707, factor loading ≥ 0.707, VIF < 3, SmartPLS, bootstrapping, NVivo, joint display matrix. This demonstrates mastery of DBA801 and DBA802 course material.")}`},

{id:"p2q7",emoji:"⚖️",label:"P2 Q7: Strengths + Limits",group:"part2",marks:"10",
direct:`${cq("Strengths and limitations of your proposed approach. (10 marks)")}<h2>Strengths</h2><p>The explanatory sequential mixed methods design offers several significant strengths. It combines the breadth of quantitative survey research with the depth of qualitative interviews, providing a more comprehensive understanding than either method alone. The sequential structure allows Phase 2 to be designed based on Phase 1 findings, making the qualitative exploration targeted and purposeful. Multiple data sources — surveys, interviews, and secondary archival data — enable triangulation, strengthening overall validity. The use of SEM via SmartPLS allows all hypothesized relationships to be tested simultaneously, providing a holistic view of the system.</p><h2>Limitations and Mitigation Strategies</h2><p>The first limitation is <b>generalizability</b>: because the study focuses on the semiconductor industry, findings may not directly transfer to other sectors. This can be mitigated by providing thick descriptions of the context and recommending future replication in other high-carbon industries such as steel or petrochemicals.</p><p>The second limitation is <b>social desirability bias</b>: investors may overstate the importance they place on ESG factors given growing public pressure for responsible investing. This can be mitigated by using indirect or scenario-based questioning and triangulating self-reported attitudes with actual investment behavior data from secondary sources.</p><p>The third limitation is <b>self-report data</b>, which may not reflect actual investment behavior. This can be mitigated by supplementing survey data with archival data such as trading patterns and portfolio allocation changes after ESG announcements.</p><p>The fourth limitation is the <b>cross-sectional design</b>, which cannot establish causation. This can be mitigated by framing findings as associational, using control variables to strengthen inference, and recommending a longitudinal follow-up study.</p><p>The fifth limitation is <b>selection bias</b>: participating investors may differ from non-participants. This can be mitigated by stratified random sampling, tracking non-response rates, and applying statistical weighting if bias is detected.</p><p>Finally, the <b>resource-intensive</b> nature of mixed methods requires significant time and expertise. This can be mitigated by using phased timelines, leveraging validated instruments, and conducting a pilot study.</p>`,
deep:`${tip('The template for every limitation: "While [limitation] may affect [what], we mitigate this by [specific action]." Listing limitations WITHOUT mitigations is confirmed as a common weak answer — the mitigation is what demonstrates methodological maturity.')}`},

{id:"projects",emoji:"🎯",label:"My 3 Projects",group:"reference",marks:"",
direct:`<p>Three paradigms — examples for any question.</p><h2>DBA800: Longitudinal Experiment</h2><p><em>Fostering PS via Online Leadership Training</em></p>${bb("Design","6mo experiment, 50-85 teams, Gameloft global")}${bb("Key","SEL→PS, cultural moderators. 4 RQs.")}${bb("Use","Experimental, longitudinal, hypothesis, moderation")}<h2>DBA801: PLS-SEM Mediation</h2><p><em>Power Distance, PS, Job Performance</em></p>${bb("Design","146 respondents, SmartPLS")}${bb("Surprise","PD+ → PS+ (β=0.314, contradicts West!). VAF=34.5%")}${bb("Use","SEM, thresholds, mediation, contradicting hypotheses")}<h2>DBA802: Qualitative Thematic</h2><p><em>Multilevel Exploration of PS in Vietnamese Tech</em></p>${bb("Design","6 interviews, two-cycle coding, 7 themes")}${bb("Key","77% PS deficit. Face-saving = private-public differential.")}${bb("Use","Qual design, propositions, coding, credibility, generalizability")}`,
deep:`${tbl(["","DBA800","DBA801","DBA802"],[["Paradigm","Experimental","Correlational","Interpretivist"],["Question","Does SEL cause PS?","PD↔PS↔Perf?","How is PS experienced?"],["Sample","50-85 teams","146","6"],["Strength","Causal","Generalizable","Depth"],["Cultural","Moderators","PD+→PS+","Face-saving"]])}<p><b>Together:</b> DBA802 EXPLAINS DBA801's surprise. DBA800 TESTS culturally-informed intervention. = Exploratory Sequential at program level.</p>${ex("'My research program: DBA802 qual exploration → DBA801 quant modeling → DBA800 experimental testing.'")}`},

{id:"cheat",emoji:"📖",label:"Cheat Sheet",group:"reference",marks:"",
direct:`<h2>Definitions</h2>${tbl(["Term","Def"],[["Proposition","If-then, qual"],["Hypothesis","IV-DV, fixed, quant"],["Triangulation","Multi-source cross-validate"],["Credibility","Believability (≈int.validity)"],["Transferability","Other contexts (≈generalizability)"],["Dependability","Consistency (≈reliability)"],["Confirmability","No bias (≈objectivity)"],["Loading","≥0.707"],["Cronbach's α","≥0.707"],["VIF","<3 SEM / <10 reg"],["R²","Variance explained"],["p-value","<0.05 = sig"],["Boundedness","Sample+setting params"],["Thick Description","Context for transferability"],["IRB","Ethics approval"]])}<h2>Common Errors</h2>${bb("No visuals","Always propose charts")}${bb("Only 'the top'","Interview across levels")}${bb("Interviews only","Multiple methods")}${bb("Respondent=conclusion","Interpret independently")}${bb("Theory must match topic","Adjacent fields valid")}`,
deep:`<h2>5 Design Components</h2><ul><li>Research Question</li><li>Propositions</li><li>Boundedness</li><li>Logic Model</li><li>Rival Explanations</li></ul><h2>Templates</h2><p><em>Regression: "For every one-unit increase in [IV], [DV] changes by [B], holding others constant. [Sig/not] at 0.05."</em></p><p><em>Limitation: "While [limitation] may affect [what], we mitigate by [action]."</em></p>`},
];

const groups=[{id:"overview",label:"Overview"},{id:"part1qual",label:"Part 1 — Qualitative"},{id:"part1quant",label:"Part 1 — Quantitative"},{id:"part2",label:"Part 2 — Globex Case"},{id:"reference",label:"Reference"}];

function renderHome(){
  let h='';
  groups.forEach(g=>{
    const items=S.filter(s=>s.group===g.id);
    h+=`<div class="group"><div class="group-label">${g.label}</div><div class="grid">${items.map(s=>`<button class="card" onclick="openModal('${s.id}')"><div class="card-emoji">${s.emoji}</div><div class="card-label">${s.label}</div>${s.marks?`<div class="card-marks">${s.marks}m</div>`:''}</button>`).join('')}</div></div>`;
  });
  document.getElementById('home').innerHTML=h;
}
function openModal(id){
  const s=S.find(x=>x.id===id);if(!s)return;
  document.getElementById('modalTitle').textContent=s.emoji+' '+s.label;
  document.getElementById('modalMarks').textContent=s.marks?s.marks+' marks':'';
  document.getElementById('directContent').innerHTML=s.direct;
  document.getElementById('deepContent').innerHTML=s.deep;
  document.getElementById('deepBody').classList.remove('open');
  document.getElementById('deepToggle').classList.remove('open');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modalBody').scrollTop=0;
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';}
function toggleDeep(){document.getElementById('deepBody').classList.toggle('open');document.getElementById('deepToggle').classList.toggle('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
renderHome();
</script>
